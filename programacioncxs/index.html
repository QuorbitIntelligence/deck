<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --surface-3:#E3E9F1;
  --border:#DCE3EC; --text:#101826; --text-muted:#5B6675; --text-faint:#8A94A3;
  --primary:#2660AB; --primary-dark:#1B3E73; --primary-light:#E7EFFA;
  --violet:#6C4AB6; --violet-light:#EDE7F9;
  --green:#158A4A; --green-bg:#DFF5E7;
  --amber:#B5750B; --amber-bg:#FCF0D6;
  --orange:#C2570C; --orange-bg:#FDE8D7;
  --red:#C2291F; --red-bg:#FBE2DF;
  --blue:#1D5FBF; --blue-bg:#E1EBFB;
  --guinda:#8E1B3C; --guinda-light:#FBE7ED;
  --shadow: 0 1px 2px rgba(16,32,43,.04), 0 4px 16px rgba(16,32,43,.06);
  --shadow-lg: 0 8px 24px rgba(16,32,43,.12), 0 2px 6px rgba(16,32,43,.06);
  --radius:14px; --radius-sm:9px;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2C; --surface-2:#182238; --surface-3:#1F2C46;
  --border:#26334D; --text:#E9EFF4; --text-muted:#93A5B5; --text-faint:#5E7085;
  --primary:#5B9BE0; --primary-dark:#3E7AC0; --primary-light:#132A4A;
  --violet:#A48AE8; --violet-light:#241C3D;
  --green:#4ADE80; --green-bg:#123321;
  --amber:#FBBF24; --amber-bg:#3A2A08;
  --orange:#FB923C; --orange-bg:#3A1E08;
  --red:#F87171; --red-bg:#3A1512;
  --blue:#60A5FA; --blue-bg:#0F2544;
  --guinda:#D64D74; --guinda-light:#3A1522;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{max-width:100vw;}
body{font-family:var(--font-body); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px;}
svg{width:16px; height:16px; display:inline-block; vertical-align:middle; flex-shrink:0;}
button{font-family:inherit; cursor:pointer; color:inherit;}
input,select,textarea{font-family:inherit; color:var(--text);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::selection{background:var(--primary); color:#fff;}

/* ---------- LAYOUT ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px;}
.brand .mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); display:flex; align-items:center; justify-content:center; color:#fff;}
.brand .mark svg{width:20px; height:20px;}
.brand b{font-family:var(--font-display); font-size:15px; display:block; line-height:1.15;}
.brand small{font-size:11px; color:var(--text-muted);}
.nav-btn{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:none; background:none; font-size:13.5px; font-weight:500; color:var(--text-muted); text-align:left; width:100%;}
.nav-btn:hover{background:var(--surface-2); color:var(--text);}
.nav-btn.active{background:var(--primary-light); color:var(--primary); font-weight:600;}
.nav-btn .badge{margin-left:auto; background:var(--guinda); color:#fff; font-size:11px; font-weight:700; border-radius:20px; padding:1px 7px;}
.side-foot{margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint); line-height:1.6;}
.theme-switch{display:flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px; margin-bottom:10px;}
.theme-switch button{flex:1; border:none; background:none; font-size:11.5px; padding:5px 0; border-radius:7px; color:var(--text-muted);}
.theme-switch button.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow); font-weight:600;}
.main{flex:1; min-width:0; padding:22px 26px 60px;}
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.topbar h1{font-family:var(--font-display); font-size:22px; font-weight:700;}
.topbar .sub{font-size:12.5px; color:var(--text-muted);}
.topbar .grow{flex:1;}
.mobile-bar{display:none;}

/* ---------- COMPONENTS ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.btn{display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-danger{color:var(--red); border-color:var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:6px 10px; font-size:12px;}
.btn-icon{padding:7px; }
.btn:disabled{opacity:.45; cursor:not-allowed;}
.input,select.input,textarea.input{width:100%; padding:9px 11px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); font-size:13.5px; outline:none; transition:border-color .15s;}
.input:focus{border-color:var(--primary);}
textarea.input{resize:vertical; min-height:64px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.pill svg{width:12px; height:12px;}
.p-amber{background:var(--amber-bg); color:var(--amber);} .p-blue{background:var(--blue-bg); color:var(--blue);}
.p-violet{background:var(--violet-light); color:var(--violet);} .p-green{background:var(--green-bg); color:var(--green);}
.p-red{background:var(--red-bg); color:var(--red);} .p-orange{background:var(--orange-bg); color:var(--orange);}
.p-muted{background:var(--surface-2); color:var(--text-muted);} .p-guinda{background:var(--guinda-light); color:var(--guinda);}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px;}
.seg button{border:none; background:none; padding:7px 14px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--text-muted);}
.seg button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow);}
.section-title{font-family:var(--font-display); font-size:15px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.muted{color:var(--text-muted);} .faint{color:var(--text-faint);} .mono{font-family:var(--font-mono);}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.grid{display:grid; gap:14px;}
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:16px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; box-shadow:var(--shadow);}
.kpi .l{font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.kpi .v{font-family:var(--font-display); font-size:24px; font-weight:700; margin-top:4px;}
.kpi .s{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.empty{padding:34px 16px; text-align:center; color:var(--text-muted); font-size:13px; line-height:1.6;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
.toolbar .range{font-family:var(--font-display); font-weight:700; font-size:16px; min-width:200px;}
.toolbar select.input{width:auto; min-width:150px; padding:8px 10px;}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0;}
table.tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
table.tbl th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); padding:9px 10px; border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0; white-space:nowrap;}
table.tbl td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
table.tbl tr.click:hover td{background:var(--surface-2); cursor:pointer;}
.tbl-wrap{overflow:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); max-height:70vh;}

/* ---------- WEEK MATRIX ---------- */
.week-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
.week{display:grid; min-width:1040px;}
.wk-h{padding:10px 8px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); background:var(--surface-2); font-size:12px;}
.wk-h b{font-family:var(--font-display); font-size:14px; display:block;}
.wk-h.today{background:var(--primary-light);}
.wk-h.today b{color:var(--primary);}
.wk-h .occ{height:4px; border-radius:3px; background:var(--surface-3); margin-top:6px; overflow:hidden;}
.wk-h .occ i{display:block; height:100%; background:var(--primary);}
.wk-sala{padding:10px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); font-weight:600; font-size:12.5px; display:flex; gap:8px; align-items:flex-start; background:var(--surface-2);}
.wk-cell{border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px; min-height:96px; display:flex; flex-direction:column; gap:5px; position:relative;}
.wk-cell.today{background:color-mix(in srgb, var(--primary-light) 45%, transparent);}
.wk-cell .add{opacity:0; border:1px dashed var(--border); border-radius:8px; background:none; font-size:11.5px; color:var(--text-muted); padding:5px; margin-top:auto;}
.wk-cell:hover .add{opacity:1;}
.ev{display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; border-radius:8px; padding:6px 8px; font-size:11.5px; line-height:1.35; cursor:pointer; border-left:4px solid var(--c, var(--primary)); background:color-mix(in srgb, var(--c, var(--primary)) 11%, var(--surface)); text-align:left; border-top:none; border-right:none; border-bottom:none; width:100%;}
.ev:hover{filter:brightness(.97); box-shadow:var(--shadow);}
.ev .t{font-family:var(--font-mono); font-weight:600; font-size:11px;}
.ev .p{font-weight:600; display:block;}
.ev .m{color:var(--text-muted); display:block;}
.ev .tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px;}
.ev .tags span{font-size:10px; padding:1px 6px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);}
.ev .tags span.warn{background:var(--amber-bg); color:var(--amber); border-color:transparent;}
.ev .tags span.ok{background:var(--green-bg); color:var(--green); border-color:transparent;}
.ev.st-Cancelada,.ev.st-Suspendida{opacity:.55; text-decoration:line-through;}
.ev.st-Tentativa{border-left-style:dashed;}

/* ---------- DAY GRID ---------- */
.day-wrap{overflow:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); max-height:78vh;}
.day{display:grid; position:relative;}
.day-head{position:sticky; top:0; z-index:3; background:var(--surface-2); border-bottom:1px solid var(--border); padding:10px; font-weight:600; font-size:12.5px; border-right:1px solid var(--border); display:flex; align-items:center; gap:8px;}
.day-times{border-right:1px solid var(--border); position:relative;}
.day-times div{position:absolute; right:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); transform:translateY(-6px);}
.day-col{position:relative; border-right:1px solid var(--border); cursor:copy;}
.day-col .slot{position:absolute; left:0; right:0; border-top:1px solid var(--border);}
.day-col .slot.half{border-top-style:dashed; opacity:.5;}
.day-col .off{position:absolute; left:0; right:0; background:repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, transparent 6px, transparent 12px);}
.day-col .ev{position:absolute; left:4px; right:4px; overflow:hidden; z-index:2;}
.day-col .clean{position:absolute; left:4px; right:4px; background:repeating-linear-gradient(-45deg, var(--surface-3), var(--surface-3) 4px, transparent 4px, transparent 8px); border-radius:0 0 6px 6px; font-size:9.5px; color:var(--text-faint); text-align:center; z-index:1; overflow:hidden;}
.now-line{position:absolute; left:0; right:0; height:2px; background:var(--red); z-index:4;}

/* ---------- MONTH ---------- */
.month{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); box-shadow:var(--shadow);}
.month .mh{padding:8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--text-muted); background:var(--surface-2); border-bottom:1px solid var(--border); text-align:center;}
.month .md{min-height:112px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px;}
.month .md:nth-child(7n){border-right:none;}
.month .md:hover{background:var(--surface-2);}
.month .md.out{background:var(--bg); opacity:.55;}
.month .md .n{font-family:var(--font-display); font-weight:700; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
.month .md.today .n span:first-child{background:var(--primary); color:#fff; border-radius:20px; padding:0 7px;}
.month .mini{font-size:10.5px; border-radius:5px; padding:2px 5px; border-left:3px solid var(--c); background:color-mix(in srgb, var(--c) 12%, var(--surface)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.month .more{font-size:10.5px; color:var(--text-muted); font-weight:600;}
.month .occbar{display:flex; gap:2px; margin-top:auto;}
.month .occbar i{height:4px; flex:1; border-radius:2px; background:var(--surface-3);}

/* ---------- MODAL / DRAWER ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,18,32,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; overflow-y:auto;}
.modal{background:var(--surface); border-radius:18px; box-shadow:var(--shadow-lg); width:100%; max-width:560px; display:flex; flex-direction:column; max-height:calc(100vh - 56px);}
.modal.xl{max-width:1180px;}
.modal.lg{max-width:820px;}
.modal-head{display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-head h2{font-family:var(--font-display); font-size:17px; font-weight:700; flex:1;}
.modal-body{padding:18px 20px; overflow-y:auto; flex:1;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; align-items:center;}
.x-btn{border:none; background:var(--surface-2); border-radius:9px; padding:7px; display:flex;}
.drawer-ov{position:fixed; inset:0; background:rgba(10,18,32,.35); z-index:90;}
.drawer{position:fixed; top:0; right:0; bottom:0; width:560px; max-width:100vw; background:var(--surface); z-index:91; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; animation:slide .18s ease-out;}
@keyframes slide{from{transform:translateX(30px); opacity:0;}to{transform:none; opacity:1;}}
.drawer .modal-body{padding:16px 20px 30px;}
.kv{display:grid; grid-template-columns:150px 1fr; gap:6px 12px; font-size:13px;}
.kv dt{color:var(--text-muted); font-size:12px; padding-top:1px;}
.kv dd{font-weight:500; word-break:break-word;}
.dsec{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
.dsec h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:10px; display:flex; align-items:center; gap:6px;}

/* ---------- FORM ---------- */
.form-grid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start;}
.fsec{border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 16px; margin-bottom:14px;}
.fsec > h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--primary); margin-bottom:12px; display:flex; align-items:center; gap:7px;}
.fsec > h3 .n{background:var(--primary); color:#fff; width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px;}
.fr{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px 12px;}
.ff{display:flex; flex-direction:column; gap:5px; min-width:0;}
.ff label{font-size:11.5px; font-weight:600; color:var(--text-muted);}
.ff label .req{color:var(--red);}
.ff .hint{font-size:11px; color:var(--text-faint);}
.c2{grid-column:span 2;} .c3{grid-column:span 3;} .c4{grid-column:1 / -1;}
.calc{padding:9px 11px; border-radius:var(--radius-sm); background:var(--surface-2); font-weight:600; font-size:13.5px; min-height:38px; display:flex; align-items:center; gap:6px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{border:1.5px solid var(--border); background:var(--surface); border-radius:20px; padding:6px 11px; font-size:12px; font-weight:500; color:var(--text-muted); display:inline-flex; align-items:center; gap:5px;}
.chip:hover{border-color:var(--primary);}
.chip.on{background:var(--primary-light); border-color:var(--primary); color:var(--primary); font-weight:600;}
.chip.on::before{content:'✓';}
.side-panel{position:sticky; top:0; display:flex; flex-direction:column; gap:12px;}
.alert{border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.45; display:flex; gap:8px; align-items:flex-start;}
.alert svg{margin-top:1px;}
.alert.err{background:var(--red-bg); color:var(--red);}
.alert.warn{background:var(--amber-bg); color:var(--amber);}
.alert.ok{background:var(--green-bg); color:var(--green);}
.alert.info{background:var(--blue-bg); color:var(--blue);}
.prov-row{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto auto; gap:8px; align-items:center; margin-bottom:8px;}
.check-list{display:flex; flex-direction:column; gap:6px;}
.check-list label{display:flex; gap:9px; align-items:flex-start; font-size:13px; padding:7px 9px; border-radius:8px; background:var(--surface-2); cursor:pointer;}
.check-list label.done{color:var(--green);}
.check-list input{margin-top:2px; accent-color:var(--primary); width:15px; height:15px;}

/* picker */
.picker{position:relative;}
.picker .plist{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-lg); max-height:280px; overflow-y:auto; z-index:20; display:none;}
.picker.open .plist{display:block;}
.picker .opt{padding:8px 11px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--surface-2);}
.picker .opt:hover,.picker .opt.hl{background:var(--primary-light);}
.picker .opt small{display:block; color:var(--text-muted); font-size:11.5px;}
.picker .clear{position:absolute; right:7px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--text-faint); font-size:16px; padding:2px 5px;}
.picker .input{padding-right:28px;}

/* config */
.cfg-layout{display:grid; grid-template-columns:240px minmax(0,1fr); gap:16px; align-items:start;}
.cfg-nav{display:flex; flex-direction:column; gap:2px; position:sticky; top:12px;}
.cfg-nav button{border:none; background:none; text-align:left; padding:9px 12px; border-radius:9px; font-size:13px; color:var(--text-muted); display:flex; justify-content:space-between; gap:6px;}
.cfg-nav button:hover{background:var(--surface-2);}
.cfg-nav button.active{background:var(--primary-light); color:var(--primary); font-weight:600;}
.cfg-nav button span{font-size:11px; color:var(--text-faint);}
.cfg-table td{padding:6px 8px; vertical-align:middle;}
.cfg-table .input{padding:7px 9px; font-size:13px;}
.cfg-table input[type=color]{width:40px; height:32px; padding:2px; border-radius:8px; border:1px solid var(--border); background:var(--surface);}
.switch{position:relative; width:36px; height:20px; display:inline-block;}
.switch input{opacity:0; width:0; height:0;}
.switch span{position:absolute; inset:0; background:var(--surface-3); border-radius:20px; transition:.15s; cursor:pointer;}
.switch span::before{content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + span{background:var(--green);}
.switch input:checked + span::before{transform:translateX(16px);}

/* requerimientos */
.dept-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.dept h3{font-family:var(--font-display); font-size:15px; display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.dept h3 .cnt{margin-left:auto;}
.dept ul{list-style:none; display:flex; flex-direction:column; gap:8px;}
.dept li{font-size:12.5px; line-height:1.45; padding:8px 10px; background:var(--surface-2); border-radius:9px;}
.dept li b{font-weight:600;}

#toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:#101826; color:#fff; padding:11px 18px; border-radius:11px; font-size:13px; opacity:0; transition:.2s; z-index:300; pointer-events:none; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%);}
#print-area{display:none;}
#boot{position:fixed; inset:0; z-index:400; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px;}
#boot .box{text-align:center; max-width:440px; line-height:1.6; font-size:13.5px; color:var(--text-muted);}
#boot .box h2{font-family:var(--font-display); color:var(--text); font-size:20px; margin:14px 0 6px;}
#boot .spin{width:34px; height:34px; border-radius:50%; border:3px solid var(--surface-3); border-top-color:var(--primary); animation:spin .8s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
#boot .logo{width:64px; height:64px; border-radius:16px; margin:0 auto;}
body.ro .ro-hide{display:none !important;}
body.no-admin .admin-only{display:none !important;}
.user-box{font-size:11.5px; line-height:1.5; margin-bottom:8px; padding:8px; border-radius:9px; background:var(--surface-2); word-break:break-all;}
.user-box b{color:var(--text); font-weight:600;}
.sync{display:inline-flex; align-items:center; gap:5px;}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block;}
.sync.busy i{background:var(--amber);} .sync.err i{background:var(--red);}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  .form-grid{grid-template-columns:1fr;}
  .side-panel{position:static;}
  .dept-grid{grid-template-columns:1fr;}
}
@media (max-width:820px){
  .sidebar{position:fixed; left:0; top:0; z-index:120; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:none;}
  .mobile-bar{display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;}
  .mobile-bar b{font-family:var(--font-display);}
  #app{flex-direction:column;}
  .main{padding:16px 16px 60px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .fr{grid-template-columns:repeat(2,minmax(0,1fr));}
  .c3{grid-column:1 / -1;}
  .cfg-layout{grid-template-columns:1fr;}
  .cfg-nav{position:static; flex-direction:row; overflow-x:auto;}
  .cfg-nav button{white-space:nowrap;}
  .kv{grid-template-columns:1fr;}
  .kv dt{margin-top:6px;}
  .prov-row{grid-template-columns:1fr 1fr;}

@media print{
  @page{size:landscape; margin:8mm;}
  body{background:#fff; color:#000; font-size:10px;}
  #app,.overlay,.drawer,.drawer-ov,#toast,.mobile-bar{display:none !important;}
  #print-area{display:block;}
  #print-area h1{font-size:15px; margin-bottom:2px;}
  #print-area .ps{font-size:10px; color:#444; margin-bottom:8px;}
  #print-area h2{font-size:12px; margin:10px 0 4px; padding:3px 6px; background:#E7EFFA; -webkit-print-color-adjust:exact; print-color-adjust:exact;}

  #print-area th{background:#2660AB; color:#fff; text-align:left; padding:4px; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #print-area td{border:1px solid #bbb; padding:3px 4px; vertical-align:top;}
  #print-area tr{page-break-inside:avoid;}
  #print-area .sheet td{font-size:10.5px; padding:5px 6px;}
  #print-area .sheet td.k{width:26%; background:#F1F4F9; font-weight:600; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #print-area .sig{display:flex; gap:40px; margin-top:40px;}
  #print-area .sig div{flex:1; border-top:1px solid #000; text-align:center; padding-top:4px; font-size:10px;}
}
</style>

function fmtF(s){ if(!s) return '—'; const d = parseYMD(s); return d.getDate()+' '+MESES_C[d.getMonth()]+' '+d.getFullYear(); }
function fmtFL(s){ if(!s) return '—'; const d = parseYMD(s); return DIAS_L[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear(); }
function fmtFC(s){ const d = parseYMD(s); return DIAS_L[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MESES_C[d.getMonth()]; }

/* ---------- EDAD ---------- */
function edadDetalle(fnac, ref){
  if(!fnac) return null;
  const a = parseYMD(fnac), b = parseYMD(ref || todayYMD());
  if(b < a) return null;
  let y = b.getFullYear()-a.getFullYear(), m = b.getMonth()-a.getMonth(), d = b.getDate()-a.getDate();
  if(d < 0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if(m < 0){ y--; m += 12; }
  return {y, m, d};
}
function edadTxt(fnac, ref){
  const e = edadDetalle(fnac, ref); if(!e) return '';
  if(e.y >= 3) return e.y+' años';
  if(e.y >= 1) return e.y+(e.y===1?' año':' años')+(e.m?' '+e.m+(e.m===1?' mes':' meses'):'');
  if(e.m >= 1) return e.m+(e.m===1?' mes':' meses')+(e.d?' '+e.d+' d':'');
  return e.d+(e.d===1?' día':' días');
}
function edadAnios(fnac, ref){ const e = edadDetalle(fnac, ref); return e ? e.y : null; }

const GAS = !!(typeof google!=='undefined' && google.script && google.script.run);

function gs(fn){ const args = Array.prototype.slice.call(arguments, 1); return new Promise((res, rej)=>{ google.script.run.withSuccessHandler(r=>{ let o = r; try{ if(typeof r==='string') o = JSON.parse(r); }catch(e){} if(o && o.error) rej(new Error(o.error)); else res(o); }).withFailureHandler(e=> rej(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn].apply(null, args); }); }

/* Guarda una cirugía (objeto completo). Devuelve la versión guardada o null si no se pudo. */
async function guardarCirugia(c, accion){
  if(!GAS){
    if(!c.id){ c.id = nuevoFolio(); c.creado = c.creado || new Date().toISOString(); }
    c.actualizado = new Date().toISOString();
    reemplazarLocal(c); save(); return c;
  }
  setSync('busy');
  try{
    const r = await gs('api_guardarCirugia', JSON.stringify({ c, res: resumenFila(c), ver: c._ver||null, accion: accion||'' }));
    if(r.conflicto){
      reemplazarLocal(r.actual); setSync('ok'); updateNavBadges();
      toast('Otro usuario ('+(r.actual._por||'')+') acaba de modificar '+r.actual.id+'. Se cargó su versión; vuelve a aplicar tu cambio.');
      return null;
    }
    reemplazarLocal(r.cirugia); SRV.mod = r.mod; setSync('ok'); updateNavBadges();
    return r.cirugia;
  }catch(e){ setSync('err'); toast('No se pudo guardar: '+(e.message||e)); return null; }
}

  catch(e){ setSync('err'); toast('No se pudo eliminar: '+(e.message||e)); return false; }
}

  if(!forzar && (document.hidden || layers.length)) return;
  try{
    const r = await gs('api_cambios', SRV.mod||'', SRV.crmGen||'');
    if(r.cambio){
      S.cirugias = r.cirugias||S.cirugias; if(r.config) S.config = mezclarConfig(r.config);
      if(r.crm){ setCRM(r.crm, 'hoja'); SRV.crmGen = r.crm.generado; }
      if(r.usuario){ USER = r.usuario; aplicarRolUI(); }
      SRV.mod = r.mod; updateNavBadges(); if(!layers.length) render();
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
}

function loadAll(){
  if(GAS){ try{ const u = JSON.parse(lsGet(KEY_UI)||'{}'); ['view','theme','cfgTab','filtroSala'].forEach(k=>{ if(u[k]!=null) UI[k] = u[k]; }); }catch(e){} return; }
  try{

      const d = JSON.parse(raw);
      const base = defaultConfig();

  loadCRM();
}
function saveUI(){ lsSet(KEY_UI, JSON.stringify({view:UI.view, theme:UI.theme, cfgTab:UI.cfgTab, filtroSala:UI.filtroSala})); }
let _saveWarned = false;
function save(){
  if(GAS){ updateNavBadges(); return; }
  S.actualizado = new Date().toISOString();
  const ok = lsSet(KEY_DATA, JSON.stringify(S));
  if(!ok && !_saveWarned){ _saveWarned = true; toast('⚠️ No se pudo guardar: el almacenamiento del navegador está lleno. Descarga un respaldo.'); setTimeout(()=>_saveWarned=false, 15000); }
  publicarPuente();
  updateNavBadges();
}

/* ---------- PUENTE CON EL CRM ---------- */
function loadCRM(){
  if(GAS) return; // en modo servidor el CRM vive en la Hoja de Google
  let live = null, cache = null;
  try{ live = JSON.parse(lsGet(BRIDGE_CRM)||'null'); }catch(e){}
  try{ cache = JSON.parse(lsGet(KEY_CRM_CACHE)||'null'); }catch(e){}
  const pick = (live && cache) ? (new Date(live.generado) >= new Date(cache.generado) ? live : cache) : (live || cache);
  if(pick && Array.isArray(pick.medicos)){
    CRM = { medicos: pick.medicos||[], cotizaciones: pick.cotizaciones||[], generado: pick.generado, version: pick.version_crm||null, fuente: pick===live ? 'navegador' : 'archivo' };
  } else {
    CRM = { medicos:[], cotizaciones:[], generado:null, version:null, fuente:null };
  }
}
function publicarPuente(){
  const payload = {
    tipo:'noor_programacion', version:1, version_app: APP_VERSION, generado: new Date().toISOString(),
    cirugias: S.cirugias.filter(c=>c.cotizacion && c.cotizacion.folio).map(c=>({
      id:c.id, folio:c.cotizacion.folio, tipo:c.cotizacion.tipo||'particular',
      fecha:c.fecha, hora_inicio:c.horaInicio, hora_fin: c.horaInicio ? fromMin(toMin(c.horaInicio)+(c.duracionMin||0)) : null,
      sala: salaNombre(c.salaId), estatus:c.estatus, paciente: (c.paciente&&c.paciente.nombre)||'',
      cirujano: c.cirujanoNombre||'', anestesiologo: c.anestesiologoNombre||'',
      motivo: c.motivoCancelacion||'', actualizado: c.actualizado||c.creado
    }))
  };
  if(!GAS) lsSet(BRIDGE_PROG, JSON.stringify(payload));
  return payload;
}
async function importarArchivoCRM(obj){
  if(!obj || obj.tipo!=='noor_crm' || !Array.isArray(obj.medicos)) throw new Error('formato');
  if(GAS){
    setSync('busy');
    const r = await gs('api_guardarCRM', JSON.stringify(obj));
    setCRM(obj, 'hoja'); SRV.crmGen = obj.generado; SRV.mod = r.mod; setSync('ok');
    return;
  }
  lsSet(KEY_CRM_CACHE, JSON.stringify(obj));
  loadCRM();
}

/* ---------- CATÁLOGOS: ACCESO ---------- */
function cfgList(k){ return S.config[k]||[]; }
function cfgActivos(k){ return cfgList(k).filter(x=>x.activo!==false); }
function cfgItem(k, id){ return cfgList(k).find(x=>x.id===id); }
function cfgNombre(k, id){ const x = cfgItem(k, id); return x ? x.nombre : ''; }
function salaNombre(id){ return cfgNombre('salas', id) || 'Sin sala'; }
function salaColor(id){ const s = cfgItem('salas', id); return s && s.color ? s.color : '#8A94A3'; }

/* ---------- MÉDICOS (CRM + externos) ---------- */
function todosMedicos(){
  const crm = (CRM.medicos||[]).map(m=>({ id:'crm:'+m.id, nombre:m.nombre, esp:m.especialidad||'', tel:m.telefono||'', correo:m.correo||'', activo: m.activo!==false, fuente:'CRM' }));
  const ext = cfgList('medicosExternos').map(m=>({ id:'ext:'+m.id, nombre:m.nombre, esp:m.especialidad||'', tel:m.telefono||'', correo:'', activo: m.activo!==false, fuente:'Externo' }));
  return crm.concat(ext);
}
function medicoById(id){ return id ? todosMedicos().find(m=>m.id===id) : null; }
function esAnestesiologo(m){ return /ANESTESI/i.test(norm(m.esp).toUpperCase()); }
function anestesiologos(){ return todosMedicos().filter(m=>m.activo && esAnestesiologo(m)); }
function cirujanos(){ return todosMedicos().filter(m=>m.activo); }

/* ---------- COTIZACIONES DEL CRM ---------- */
const CRM_POR_PROGRAMAR = ['Aprobada','Confirmado','Programación agendada'];
const CRM_FINALES = ['Realizado','Cancelado','Perdido','Archivado','Cerrado','Caducado','Vencida'];
function cotKey(folio, tipo){ return (tipo||'particular')+'|'+folio; }
function cirugiaDeCot(folio, tipo){ return S.cirugias.find(c=>c.cotizacion && c.cotizacion.folio===folio && (c.cotizacion.tipo||'particular')===(tipo||'particular') && c.estatus!=='Cancelada'); }
function porProgramar(){
  return (CRM.cotizaciones||[]).filter(q=> CRM_POR_PROGRAMAR.includes(q.estatus) && !cirugiaDeCot(q.folio, q.tipo));
}
function cotizacionesLigables(){
  return (CRM.cotizaciones||[]).filter(q=> !CRM_FINALES.includes(q.estatus) || q.estatus==='Realizado');
}
</script>
<script>
/* =====================================================================
   LÓGICA DE CIRUGÍAS: alta, conflictos, pendientes
   ===================================================================== */
function nuevoFolio(){ S.seq = (S.seq||0)+1; return 'PQ-'+String(S.seq).padStart(5,'0'); }
function nuevaCirugia(pre){
  const hz = S.config.horario;
  return Object.assign({
    id:null, estatus:'Tentativa', prioridad:'Electiva',
    fecha: UI.fecha || todayYMD(), horaInicio: hz.inicio, duracionMin: hz.duracionDefaultMin||120,
    salaId: (cfgActivos('salas')[0]||{}).id || null,
    cotizacion:null,
    cirujanoId:null, cirujanoNombre:'', cirujanoEsp:'', ayudantes:'',
    anestesiologoId:null, anestesiologoNombre:'', instrumentistaId:'', circulanteId:'',
    paciente:{ nombre:'', fnac:'', sexo:'', telefono:'', correo:'', expediente:'', peso:'', talla:'', asa:'', alergias:'', comorbilidades:'', responsable:'', responsableTel:'' },
    procedimiento:'', diagnostico:'', lateralidad:'No aplica', cie:'',
    tipoAnestesiaId:'',
    tipoEstancia:'Ambulatorio', diasEstancia:'', habitacionId:'', uciPostop:false, ingresoFecha:'', ingresoHora:'',
    tipoAtencion:'Particular', aseguradoraId:'', poliza:'', siniestro:'', autorizacion:'Pendiente', convenioId:'',
    montoCotizado:'', anticipo:'',
    equipos:[], proveedores:[], laboratorio:[], imagenologia:[], servicios:[],
    notaLab:'', notaImagen:'', notaProveedores:'', hemoderivados:'',
    checklist:{}, notas:'', notasEnfermeria:'',
    horaRealInicio:'', horaRealFin:'', motivoCancelacion:'', notaCancelacion:'',
    historial:[], creado:null, actualizado:null
  }, pre||{});
}
function rango(c){ const s = toMin(c.horaInicio); return s==null ? null : {s, e: s + (Number(c.duracionMin)||0)}; }
function finTxt(c){ const r = rango(c); return r ? fromMin(r.e) : '—'; }

/* ---------- CHECKLIST APLICABLE ---------- */
function checklistAplicable(c){
  return cfgActivos('checklist').filter(it=>{
    switch(it.aplica||'Siempre'){
      case 'Particular': return c.tipoAtencion==='Particular';
      case 'Aseguradora': return c.tipoAtencion==='Aseguradora';
      case 'Convenio / financiamiento': return c.tipoAtencion==='Convenio / financiamiento';
      case 'Hospitalización': return c.tipoEstancia==='Hospitalización';
      case 'Ambulatorio': return c.tipoEstancia==='Ambulatorio';
      case 'Con proveedor': return (c.proveedores||[]).length>0;
      case 'Con equipo': return (c.equipos||[]).length>0;
      case 'Con banco de sangre': return (c.servicios||[]).some(id=>/sangre/i.test(cfgNombre('servicios', id)));
      default: return true;
    }
  });
}

/* ---------- PENDIENTES (lo que falta para que la cirugía esté lista) ---------- */
function pendientes(c){
  const p = [];
  if(!c.cirujanoId && !c.cirujanoNombre) p.push('Falta cirujano');
  if(!c.anestesiologoId && !c.anestesiologoNombre) p.push('Falta anestesiólogo');
  if(!c.tipoAnestesiaId) p.push('Falta tipo de anestesia');
  if(!c.paciente.fnac) p.push('Falta fecha de nacimiento del paciente');
  if(!c.paciente.telefono) p.push('Falta teléfono del paciente');
  if(c.tipoEstancia==='Hospitalización'){
    if(!c.diasEstancia) p.push('Faltan días de estancia');
    if(!c.habitacionId) p.push('Falta tipo de habitación');
  }
  if(c.tipoAtencion==='Aseguradora'){
    if(!c.aseguradoraId) p.push('Falta aseguradora');
    if(c.autorizacion!=='Autorizada') p.push('Autorización de aseguradora: '+(c.autorizacion||'Pendiente'));
  }
  if(c.tipoAtencion==='Convenio / financiamiento' && !c.convenioId) p.push('Falta convenio / financiera');
  (c.proveedores||[]).forEach(pr=>{ if(!pr.confirmado) p.push('Proveedor sin confirmar: '+(cfgNombre('proveedores', pr.provId)||'(sin elegir)')); });
  const cl = checklistAplicable(c).filter(it=>!c.checklist[it.id]);
  if(cl.length) p.push('Checklist: '+cl.length+' de '+checklistAplicable(c).length+' sin completar');
  return p;
}

/* ---------- CONFLICTOS ---------- */
function solapa(a, b, margen){ return a.s < b.e + margen && b.s < a.e + margen; }
function conflictos(c){
  const out = []; const r = rango(c);
  if(!c.fecha || !r) return out;
  const L = Number(S.config.horario.limpiezaMin)||0;
  const hz = S.config.horario;
  if(!OCUPAN.includes(c.estatus)) return out;
  const otros = S.cirugias.filter(o=> o.id!==c.id && o.fecha===c.fecha && OCUPAN.includes(o.estatus));
  // También cirugías del día anterior que terminan después de medianoche
  const prev = S.cirugias.filter(o=> o.id!==c.id && o.fecha===addDays(c.fecha,-1) && OCUPAN.includes(o.estatus) && rango(o) && rango(o).e > 1440)
    .map(o=>{ const ro = rango(o); return Object.assign({}, o, {_r:{s: ro.s-1440, e: ro.e-1440}}); });
  const lista = otros.map(o=> Object.assign({}, o, {_r: rango(o)})).concat(prev).filter(o=>o._r);
  const desc = o=> `${o.id} · ${fromMin(o._r.s)}–${fromMin(o._r.e)} · ${o.procedimiento||'sin procedimiento'}`;
  lista.forEach(o=>{
    if(c.salaId && o.salaId===c.salaId && solapa(r, o._r, L)) out.push({nivel:'err', tipo:'Sala', msg:`${salaNombre(c.salaId)} ocupada${L?' (incluye '+L+' min de limpieza)':''}: ${desc(o)}`});
    const mismo = (a,b,na,nb)=> (a && b && a===b) || (!a && !b && na && nb && norm(na)===norm(nb));
    if((c.cirujanoId||c.cirujanoNombre) && mismo(c.cirujanoId, o.cirujanoId, c.cirujanoNombre, o.cirujanoNombre) && solapa(r, o._r, 0)) out.push({nivel:'err', tipo:'Cirujano', msg:`${c.cirujanoNombre} ya opera a esa hora en ${salaNombre(o.salaId)}: ${desc(o)}`});
    if((c.anestesiologoId||c.anestesiologoNombre) && mismo(c.anestesiologoId, o.anestesiologoId, c.anestesiologoNombre, o.anestesiologoNombre) && solapa(r, o._r, 0)) out.push({nivel:'err', tipo:'Anestesiólogo', msg:`${c.anestesiologoNombre} ya está asignado a esa hora en ${salaNombre(o.salaId)}: ${desc(o)}`});
    if(c.paciente.nombre && o.paciente && norm(o.paciente.nombre)===norm(c.paciente.nombre) && solapa(r, o._r, 0)) out.push({nivel:'err', tipo:'Paciente', msg:`El paciente ya tiene otro procedimiento a esa hora: ${desc(o)}`});
    ['instrumentistaId','circulanteId'].forEach(k=>{ if(c[k] && (o.instrumentistaId===c[k] || o.circulanteId===c[k]) && solapa(r, o._r, 0)) out.push({nivel:'warn', tipo:'Personal', msg:`${cfgNombre('personal', c[k])} también está asignado en ${salaNombre(o.salaId)}: ${desc(o)}`}); });
  });
  (c.equipos||[]).forEach(eid=>{
    const eq = cfgItem('equipos', eid); if(!eq) return;
    const cap = Math.max(1, Number(eq.cantidad)||1);
    const usan = lista.filter(o=> (o.equipos||[]).includes(eid) && solapa(r, o._r, 0));
    if(usan.length >= cap) out.push({nivel:'err', tipo:'Equipo', msg:`${eq.nombre}: hay ${cap} disponible(s) y ya ${usan.length===1?'lo usa':'lo usan'} ${usan.map(o=>o.id+' ('+salaNombre(o.salaId)+' '+fromMin(o._r.s)+')').join(', ')}`});
  });
  const ini = toMin(hz.inicio), fin = toMin(hz.fin);
  if(r.s < ini || r.e > fin) out.push({nivel:'warn', tipo:'Horario', msg:`Fuera del horario quirúrgico configurado (${hz.inicio}–${hz.fin}). Termina ${fromMin(r.e)}.`});
  const sala = cfgItem('salas', c.salaId); if(sala && sala.activo===false) out.push({nivel:'warn', tipo:'Sala', msg:`${sala.nombre} está desactivada en Configuración.`});
  if(c.fecha < todayYMD() && ABIERTAS.includes(c.estatus)) out.push({nivel:'warn', tipo:'Fecha', msg:'La fecha ya pasó y la cirugía sigue abierta. ¿Ya se realizó?'});
  return out;
}

/* ---------- HISTORIAL ---------- */
function logH(c, accion, detalle){ c.historial = c.historial||[]; const e = {fecha:new Date().toISOString(), accion, detalle: detalle||''}; if(USER.correo) e.usuario = USER.correo; c.historial.push(e); c.actualizado = new Date().toISOString(); }

/* ---------- FILTROS ---------- */
function pasaFiltros(c){
  if(UI.filtroSala && c.salaId!==UI.filtroSala) return false;
  if(UI.filtroMedico && c.cirujanoId!==UI.filtroMedico && c.anestesiologoId!==UI.filtroMedico) return false;
  if(UI.filtroEstatus==='sin-canceladas' && (c.estatus==='Cancelada')) return false;
  if(UI.filtroEstatus && UI.filtroEstatus!=='sin-canceladas' && c.estatus!==UI.filtroEstatus) return false;
  return true;
}
function delDia(f){ return S.cirugias.filter(c=>c.fecha===f && pasaFiltros(c)).sort((a,b)=> (toMin(a.horaInicio)||0)-(toMin(b.horaInicio)||0)); }

/* ---------- RESUMEN CORTO PARA TARJETAS ---------- */
function etiquetas(c){
  const t = [];
  if(c.prioridad==='Urgencia') t.push('<span class="warn">Urgencia</span>');
  if(c.tipoEstancia==='Hospitalización') t.push(`<span>Hosp ${c.diasEstancia?c.diasEstancia+'d':''}</span>`);
  if(c.tipoAtencion==='Aseguradora') t.push(`<span>${h(cfgNombre('aseguradoras', c.aseguradoraId)||'Aseg.')}</span>`);
  if((c.equipos||[]).length) t.push(`<span>${c.equipos.length} equipo${c.equipos.length>1?'s':''}</span>`);
  if((c.proveedores||[]).length) t.push(`<span>${c.proveedores.length} prov.</span>`);
  if(c.cotizacion) t.push(`<span>${h(c.cotizacion.folio)}</span>`);
  if(ABIERTAS.includes(c.estatus)){ const n = pendientes(c).length; t.push(n ? `<span class="warn">${n} pendiente${n>1?'s':''}</span>` : '<span class="ok">Lista</span>'); }
  return t.join('');
}
function evHTML(c, compact){
  const edad = c.paciente.fnac ? ' · '+edadTxt(c.paciente.fnac, c.fecha) : '';
  return `<button class="ev st-${c.estatus.replace(/\s/g,'')}" style="--c:${salaColor(c.salaId)}" data-ev="${c.id}" title="${h(c.estatus+' — '+(c.procedimiento||''))}">
    <span><span class="t">${h(c.horaInicio||'')}–${h(finTxt(c))}</span> ${c.estatus!=='Confirmada'?`<span class="pill ${(ESTATUS[c.estatus]||{}).cls}" style="font-size:9.5px; padding:0 6px;">${h(c.estatus)}</span>`:''}</span>
    <span class="p">${h(c.procedimiento||'Sin procedimiento')}</span>
    <span class="m">${h(c.paciente.nombre||'Paciente sin nombre')}${h(edad)}</span>
    ${compact?'':`<span class="m">${h(c.cirujanoNombre||'Sin cirujano')}</span>`}
    ${compact?'':`<span class="tags">${etiquetas(c)}</span>`}
  </button>`;
}
</script>
<script>
/* =====================================================================
   NAVEGACIÓN Y AGENDA
   ===================================================================== */
const PAGES = [
  {id:'agenda', label:'Agenda de quirófanos', icon:'cal'},
  {id:'porprogramar', label:'Por programar (CRM)', icon:'queue'},
  {id:'requerimientos', label:'Requerimientos por área', icon:'dept'},
  {id:'lista', label:'Lista de cirugías', icon:'list'},
  {id:'config', label:'Configuración', icon:'config'},
  {id:'datos', label:'Conexión y respaldos', icon:'db'}
];
function renderNav(){
  $('#nav').innerHTML = PAGES.map(p=>`<button class="nav-btn ${UI.page===p.id?'active':''}" data-p="${p.id}">${icon(p.icon)} ${p.label}<span class="badge" id="badge-${p.id}" style="display:none"></span></button>`).join('');
  $$('#nav .nav-btn').forEach(b=> b.onclick = ()=>{ go(b.dataset.p); $('#sidebar').classList.remove('open'); });
  updateNavBadges();
}
function updateNavBadges(){
  const b = $('#badge-porprogramar'); if(b){ const n = porProgramar().length; b.textContent = n; b.style.display = n ? '' : 'none'; }
  const st = $('#crm-status-mini');
  if(st) st.innerHTML = CRM.generado ? `<span style="color:var(--green)">●</span> CRM: ${CRM.medicos.length} médicos · ${CRM.cotizaciones.length} cot.<br>` : `<span style="color:var(--amber)">●</span> Sin datos del CRM<br>`;
}
function go(p){ UI.page = p; location.hash = p; renderNav(); render(); window.scrollTo(0,0); }
function render(){
  const fn = {agenda:renderAgenda, porprogramar:renderPorProgramar, requerimientos:renderRequerimientos, lista:renderLista, config:renderConfig, datos:renderDatos}[UI.page] || renderAgenda;
  fn();
}

/* ---------- AGENDA ---------- */
function rangoVista(){
  if(UI.view==='dia') return {desde:UI.fecha, hasta:UI.fecha};
  if(UI.view==='mes'){ const d = parseYMD(UI.fecha); const a = ymd(new Date(d.getFullYear(), d.getMonth(), 1, 12)); const b = ymd(new Date(d.getFullYear(), d.getMonth()+1, 0, 12)); return {desde:a, hasta:b}; }
  const a = startOfWeek(UI.fecha); return {desde:a, hasta:addDays(a,6)};
}
function tituloRango(){
  const {desde, hasta} = rangoVista();
  if(UI.view==='dia') return fmtFL(desde);
  if(UI.view==='mes'){ const d = parseYMD(desde); return MESES[d.getMonth()].replace(/^./, c=>c.toUpperCase())+' '+d.getFullYear(); }
  const a = parseYMD(desde), b = parseYMD(hasta);
  return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MESES_C[a.getMonth()]:'')+' – '+b.getDate()+' '+MESES_C[b.getMonth()]+' '+b.getFullYear();
}
function mover(dir){
  if(UI.view==='dia') UI.fecha = addDays(UI.fecha, dir);
  else if(UI.view==='mes'){ const d = parseYMD(UI.fecha); UI.fecha = ymd(new Date(d.getFullYear(), d.getMonth()+dir, 1, 12)); }
  else UI.fecha = addDays(UI.fecha, 7*dir);
  renderAgenda();
}
function minutosDisponiblesDia(){ const hz = S.config.horario; return Math.max(0, toMin(hz.fin)-toMin(hz.inicio)) * Math.max(1, cfgActivos('salas').length); }
function kpisHTML(){
  const {desde, hasta} = rangoVista();
  const lst = S.cirugias.filter(c=>c.fecha>=desde && c.fecha<=hasta);
  const ocup = lst.filter(c=>OCUPAN.includes(c.estatus));
  const mins = ocup.reduce((s,c)=>s+(Number(c.duracionMin)||0),0);
  let dias = 0; for(let f=desde; f<=hasta; f=addDays(f,1)) dias++;
  const disp = minutosDisponiblesDia()*dias;
  const conPend = lst.filter(c=>ABIERTAS.includes(c.estatus) && pendientes(c).length).length;
  const confl = lst.filter(c=>ABIERTAS.includes(c.estatus) && conflictos(c).some(x=>x.nivel==='err')).length;
  const pp = porProgramar().length;
  return `<div class="kpis">
    <div class="kpi"><div class="l">Cirugías en el periodo</div><div class="v">${ocup.length}</div><div class="s">${lst.filter(c=>c.estatus==='Realizada').length} realizadas · ${lst.filter(c=>['Cancelada','Suspendida'].includes(c.estatus)).length} canc./susp.</div></div>
    <div class="kpi"><div class="l">Horas de quirófano</div><div class="v">${(mins/60).toLocaleString('es-MX',{maximumFractionDigits:1})} h</div><div class="s">de ${(disp/60).toLocaleString('es-MX',{maximumFractionDigits:0})} h disponibles</div></div>
    <div class="kpi"><div class="l">Ocupación</div><div class="v">${disp?Math.round(mins*100/disp):0}%</div><div class="s">${cfgActivos('salas').length} salas · ${S.config.horario.inicio}–${S.config.horario.fin}</div></div>
    <div class="kpi"><div class="l">Con pendientes</div><div class="v" style="color:${conPend?'var(--amber)':'inherit'}">${conPend}</div><div class="s">${confl?`<span style="color:var(--red)">${confl} con conflicto</span>`:'sin conflictos'}</div></div>
    <div class="kpi" style="cursor:pointer" onclick="go('porprogramar')"><div class="l">Por programar (CRM)</div><div class="v" style="color:${pp?'var(--guinda)':'inherit'}">${pp}</div><div class="s">cotizaciones confirmadas sin fecha en agenda</div></div>
  </div>`;
}
function filtrosHTML(){
  const meds = []; const seen = new Set();
  S.cirugias.forEach(c=>{ [[c.cirujanoId,c.cirujanoNombre],[c.anestesiologoId,c.anestesiologoNombre]].forEach(([id,n])=>{ if(id && !seen.has(id)){ seen.add(id); meds.push({id,n}); } }); });
  meds.sort((a,b)=>a.n.localeCompare(b.n));
  return `<select class="input" id="f-sala"><option value="">Todas las salas</option>${cfgList('salas').map(s=>`<option value="${s.id}" ${UI.filtroSala===s.id?'selected':''}>${h(s.nombre)}</option>`).join('')}</select>
    <select class="input" id="f-med"><option value="">Todos los médicos</option>${meds.map(m=>`<option value="${m.id}" ${UI.filtroMedico===m.id?'selected':''}>${h(m.n)}</option>`).join('')}</select>
    <select class="input" id="f-est"><option value="sin-canceladas" ${UI.filtroEstatus==='sin-canceladas'?'selected':''}>Ocultar canceladas</option><option value="" ${UI.filtroEstatus===''?'selected':''}>Todos los estatus</option>${Object.keys(ESTATUS).map(e=>`<option ${UI.filtroEstatus===e?'selected':''}>${e}</option>`).join('')}</select>`;
}
function renderAgenda(){
  $('#main').innerHTML = `
    <div class="topbar"><div><h1>Agenda de quirófanos</h1><div class="sub">Programación quirúrgica por sala · ${cfgActivos('salas').length} salas activas</div></div><div class="grow"></div>
      <button class="btn" id="btn-print">${icon('print')} Imprimir programa</button>
      <button class="btn btn-primary ro-hide" id="btn-new">${icon('plus')} Programar cirugía</button></div>
    ${kpisHTML()}
    <div class="toolbar">
      <div class="row" style="gap:6px;"><button class="btn btn-icon" id="nav-prev" aria-label="Anterior">${icon('left')}</button><button class="btn btn-sm" id="nav-hoy">Hoy</button><button class="btn btn-icon" id="nav-next" aria-label="Siguiente">${icon('right')}</button></div>
      <div class="range">${tituloRango()}</div>
      <input type="date" class="input" id="nav-date" value="${UI.fecha}" style="width:auto;">
      <div class="seg" id="view-seg"><button data-v="dia">Día</button><button data-v="semana">Semana</button><button data-v="mes">Mes</button></div>
      <div style="flex:1"></div>
      ${filtrosHTML()}
    </div>
    <div id="agenda-body"></div>`;
  $$('#view-seg button').forEach(b=>{ b.classList.toggle('active', b.dataset.v===UI.view); b.onclick = ()=>{ UI.view = b.dataset.v; saveUI(); renderAgenda(); }; });
  $('#nav-prev').onclick = ()=>mover(-1); $('#nav-next').onclick = ()=>mover(1);
  $('#nav-hoy').onclick = ()=>{ UI.fecha = todayYMD(); renderAgenda(); };
  $('#nav-date').onchange = e=>{ if(e.target.value){ UI.fecha = e.target.value; renderAgenda(); } };
  $('#f-sala').onchange = e=>{ UI.filtroSala = e.target.value; saveUI(); renderAgenda(); };
  $('#f-med').onchange = e=>{ UI.filtroMedico = e.target.value; renderAgenda(); };
  $('#f-est').onchange = e=>{ UI.filtroEstatus = e.target.value; renderAgenda(); };
  $('#btn-new').onclick = ()=> abrirForm(null, {fecha: UI.view==='dia'?UI.fecha:(UI.fecha<todayYMD()?todayYMD():UI.fecha)});
  $('#btn-print').onclick = ()=> UI.view==='dia' ? imprimirPrograma(UI.fecha, UI.fecha) : (()=>{ const r = rangoVista(); imprimirPrograma(r.desde, r.hasta); })();
  if(UI.view==='dia') renderDia(); else if(UI.view==='mes') renderMes(); else renderSemana();
  $$('#agenda-body [data-ev]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); abrirDetalle(b.dataset.ev); });
}
function salasVisibles(){ const s = cfgList('salas').filter(x=>x.activo!==false || S.cirugias.some(c=>c.salaId===x.id)); return UI.filtroSala ? s.filter(x=>x.id===UI.filtroSala) : s; }

function renderSemana(){
  const ini = startOfWeek(UI.fecha); const dias = [0,1,2,3,4,5,6].map(i=>addDays(ini,i)); const hoy = todayYMD();
  const salas = salasVisibles();
  const dispSala = Math.max(1, toMin(S.config.horario.fin)-toMin(S.config.horario.inicio));
  if(!salas.length){ $('#agenda-body').innerHTML = `<div class="card empty">No hay salas configuradas. Agrega tus quirófanos en <b>Configuración → Salas</b>.</div>`; return; }
  let html = `<div class="week-wrap"><div class="week" style="grid-template-columns:150px repeat(7, minmax(126px,1fr));"><div class="wk-h"></div>`;
  dias.forEach((f,i)=>{
    const occ = S.cirugias.filter(c=>c.fecha===f && OCUPAN.includes(c.estatus) && salas.some(s=>s.id===c.salaId)).reduce((s,c)=>s+(Number(c.duracionMin)||0),0);
    const pct = Math.min(100, Math.round(occ*100/(dispSala*salas.length)));
    const n = S.cirugias.filter(c=>c.fecha===f && OCUPAN.includes(c.estatus)).length;
    html += `<div class="wk-h ${f===hoy?'today':''}" style="cursor:pointer" data-dia="${f}" title="Ver el día"><span class="muted">${DIAS[i]}</span><b>${parseYMD(f).getDate()} ${MESES_C[parseYMD(f).getMonth()]}</b><span class="faint" style="font-size:11px">${n} cirugía${n!==1?'s':''} · ${pct}%</span><div class="occ"><i style="width:${pct}%"></i></div></div>`;
  });
  salas.forEach(s=>{
    html += `<div class="wk-sala"><span class="dot" style="background:${s.color||'#8A94A3'}; margin-top:3px;"></span><div>${h(s.nombre)}${s.activo===false?'<div class="faint" style="font-size:11px; font-weight:500">desactivada</div>':''}</div></div>`;
    dias.forEach(f=>{
      const evs = delDia(f).filter(c=>c.salaId===s.id);
      html += `<div class="wk-cell ${f===hoy?'today':''}" data-cell="${f}|${s.id}">${evs.map(c=>evHTML(c)).join('')}<button class="add ro-hide" data-add="${f}|${s.id}">+ Programar</button></div>`;
    });
  });
  const sinSala = S.cirugias.filter(c=>dias.includes(c.fecha) && pasaFiltros(c) && !cfgItem('salas', c.salaId));
  html += `</div></div>`;
  if(sinSala.length) html += `<div class="alert warn" style="margin-top:12px">${icon('alert')} <div><b>${sinSala.length} cirugía(s) sin sala válida esta semana:</b> ${sinSala.map(c=>`<a href="#" data-ev="${c.id}">${h(c.id)}</a>`).join(', ')}</div></div>`;
  $('#agenda-body').innerHTML = html;
  $$('#agenda-body [data-add]').forEach(b=> b.onclick = e=>{ e.stopPropagation(); const [f,sid] = b.dataset.add.split('|'); abrirForm(null, {fecha:f, salaId:sid, horaInicio: siguienteHoraLibre(f, sid)}); });
  $$('#agenda-body [data-dia]').forEach(b=> b.onclick = ()=>{ UI.fecha = b.dataset.dia; UI.view = 'dia'; saveUI(); renderAgenda(); });
}
function siguienteHoraLibre(f, salaId){
  const hz = S.config.horario; const L = Number(hz.limpiezaMin)||0;
  let t = toMin(hz.inicio);
  S.cirugias.filter(c=>c.fecha===f && c.salaId===salaId && OCUPAN.includes(c.estatus)).map(rango).filter(Boolean).sort((a,b)=>a.s-b.s).forEach(r=>{ if(r.s < t + (hz.duracionDefaultMin||60) + L && r.e + L > t) t = r.e + L; });
  t = Math.ceil(t/15)*15;
  return fromMin(Math.min(t, 23*60+45)).slice(0,5);
}

function renderDia(){
  const f = UI.fecha; const salas = salasVisibles(); const hz = S.config.horario;
  const evsDia = delDia(f);
  let ini = toMin(hz.inicio), fin = toMin(hz.fin);
  evsDia.forEach(c=>{ const r = rango(c); if(r){ ini = Math.min(ini, Math.floor(r.s/60)*60); fin = Math.max(fin, Math.min(1440, Math.ceil((r.e + (Number(hz.limpiezaMin)||0))/60)*60)); } });
  ini = Math.floor(ini/60)*60; fin = Math.ceil(fin/60)*60;
  const PPM = 1.3; const H = (fin-ini)*PPM;
  if(!salas.length){ $('#agenda-body').innerHTML = `<div class="card empty">No hay salas configuradas.</div>`; return; }
  let html = `<div class="day-wrap"><div class="day" style="grid-template-columns:60px repeat(${salas.length}, minmax(190px,1fr));">`;
  html += `<div class="day-head" style="padding:0"></div>` + salas.map(s=>{ const n = evsDia.filter(c=>c.salaId===s.id && OCUPAN.includes(c.estatus)); const m = n.reduce((a,c)=>a+(Number(c.duracionMin)||0),0); return `<div class="day-head"><span class="dot" style="background:${s.color}"></span>${h(s.nombre)}<span class="faint" style="margin-left:auto; font-weight:500; font-size:11px">${n.length} · ${durTxt(m)}</span></div>`; }).join('');
  html += `<div class="day-times" style="height:${H}px">`;
  for(let m=ini; m<=fin; m+=60) html += `<div style="top:${(m-ini)*PPM}px">${pad(Math.floor(m/60)%24)}:00</div>`;
  html += `</div>`;
  salas.forEach(s=>{
    html += `<div class="day-col" data-col="${s.id}" style="height:${H}px">`;
    for(let m=ini; m<fin; m+=30) html += `<div class="slot ${m%60?'half':''}" style="top:${(m-ini)*PPM}px"></div>`;
    if(toMin(hz.inicio) > ini) html += `<div class="off" style="top:0; height:${(toMin(hz.inicio)-ini)*PPM}px"></div>`;
    if(toMin(hz.fin) < fin) html += `<div class="off" style="top:${(toMin(hz.fin)-ini)*PPM}px; height:${(fin-toMin(hz.fin))*PPM}px"></div>`;
    const evs = evsDia.filter(c=>c.salaId===s.id);
    // Carriles para eventos que se enciman (p.ej. canceladas visibles o conflictos)
    const lanes = []; const pos = {};
    evs.forEach(c=>{ const r = rango(c); if(!r) return; let l = lanes.findIndex(e=>e <= r.s); if(l<0){ l = lanes.length; lanes.push(0); } lanes[l] = r.e; pos[c.id] = l; });
    const nL = Math.max(1, lanes.length);
    evs.forEach(c=>{
      const r = rango(c); if(!r) return;
      const top = (r.s-ini)*PPM, hgt = Math.max(30, (Math.min(r.e,fin)-r.s)*PPM - 2);
      const w = 100/nL, left = pos[c.id]*w;
      html += evHTML(c, hgt < 90).replace('<button class="ev', `<button style="top:${top}px; height:${hgt}px; left:calc(${left}% + 4px); width:calc(${w}% - 8px); right:auto;" class="ev`);
      const L = Number(hz.limpiezaMin)||0;
      if(L && OCUPAN.includes(c.estatus)) html += `<div class="clean" style="top:${(r.e-ini)*PPM}px; height:${L*PPM}px; left:calc(${left}% + 4px); width:calc(${w}% - 8px); right:auto;">limpieza</div>`;
    });
    if(f===todayYMD()){ const now = new Date(); const nm = now.getHours()*60+now.getMinutes(); if(nm>=ini && nm<=fin) html += `<div class="now-line" style="top:${(nm-ini)*PPM}px"></div>`; }
    html += `</div>`;
  });
  html += `</div></div><div class="faint" style="font-size:11.5px; margin-top:8px">Haz clic en un espacio vacío de la sala para programar a esa hora. Las franjas rayadas grises son tiempo de limpieza (${hz.limpiezaMin} min) o fuera de horario.</div>`;
  $('#agenda-body').innerHTML = html;
  $$('#agenda-body .day-col').forEach(col=> col.onclick = e=>{
    if(e.target.closest('.ev') || !puede('Programador')) return;
    const rect = col.getBoundingClientRect(); const y = e.clientY - rect.top;
    const m = Math.floor((ini + y/PPM)/30)*30;
    abrirForm(null, {fecha:f, salaId:col.dataset.col, horaInicio: fromMin(m).slice(0,5)});
  });
  const wrap = $('.day-wrap'); const first = evsDia[0] && rango(evsDia[0]); if(wrap && first) wrap.scrollTop = Math.max(0,(first.s-ini)*PPM-40);
}

function renderMes(){
  const d = parseYMD(UI.fecha); const first = ymd(new Date(d.getFullYear(), d.getMonth(), 1, 12));
  const ini = startOfWeek(first); const hoy = todayYMD(); const salas = cfgActivos('salas');
  const dispSala = Math.max(1, toMin(S.config.horario.fin)-toMin(S.config.horario.inicio));
  let html = `<div class="month">${DIAS.map(x=>`<div class="mh">${x}</div>`).join('')}`;
  for(let i=0;i<42;i++){
    const f = addDays(ini, i); const fd = parseYMD(f);
    if(i>=35 && fd.getMonth()!==d.getMonth()) break;
    const evs = delDia(f);
    html += `<div class="md ${fd.getMonth()!==d.getMonth()?'out':''} ${f===hoy?'today':''}" data-dia="${f}"><div class="n"><span>${fd.getDate()}</span>${evs.length?`<span class="pill p-blue" style="font-size:10px; padding:0 6px">${evs.length}</span>`:''}</div>`;
    evs.slice(0,3).forEach(c=> html += `<div class="mini" style="--c:${salaColor(c.salaId)}" data-ev="${c.id}">${h(c.horaInicio)} ${h(c.procedimiento||c.paciente.nombre||'')}</div>`);
    if(evs.length>3) html += `<div class="more">+${evs.length-3} más</div>`;
    html += `<div class="occbar">${salas.map(s=>{ const m = S.cirugias.filter(c=>c.fecha===f && c.salaId===s.id && OCUPAN.includes(c.estatus)).reduce((a,c)=>a+(Number(c.duracionMin)||0),0); const p = Math.min(1, m/dispSala); return `<i title="${h(s.nombre)}: ${Math.round(p*100)}%" style="background:${p?`color-mix(in srgb, ${s.color} ${Math.round(25+p*75)}%, transparent)`:'var(--surface-3)'}"></i>`; }).join('')}</div></div>`;
  }
  html += `</div><div class="faint" style="font-size:11.5px; margin-top:8px">Las barritas inferiores muestran la ocupación de cada sala ese día. Clic en un día para verlo en detalle.</div>`;
  $('#agenda-body').innerHTML = html;
  $$('#agenda-body .md').forEach(el=> el.onclick = e=>{ if(e.target.closest('[data-ev]')) return; UI.fecha = el.dataset.dia; UI.view = 'dia'; saveUI(); renderAgenda(); });
}
</script>
<script>
/* =====================================================================
   MODALES, PICKER Y FORMULARIO DE PROGRAMACIÓN
   ===================================================================== */
const layers = [];
function openModal(html, cls, onClose){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${cls||''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) ov._down = true; });
  ov.addEventListener('click', e=>{ if(e.target===ov && ov._down) closeTop(); ov._down = false; });
  $('#layer').appendChild(ov); layers.push({el:ov, onClose});
  $$('[data-close]', ov).forEach(b=> b.onclick = ()=> closeTop());
  return ov;
}
function openDrawer(html, onClose){
  const ov = document.createElement('div'); ov.className = 'drawer-ov';
  const dr = document.createElement('div'); dr.className = 'drawer'; dr.innerHTML = html;
  ov.onclick = ()=> closeTop();
  $('#layer').appendChild(ov); $('#layer').appendChild(dr);
  layers.push({el:dr, extra:ov, onClose});
  $$('[data-close]', dr).forEach(b=> b.onclick = ()=> closeTop());
  return dr;
}
function closeTop(){ const l = layers.pop(); if(!l) return; l.el.remove(); if(l.extra) l.extra.remove(); if(l.onClose) l.onClose(); }
function closeAll(){ while(layers.length) closeTop(); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    const open = document.querySelector('.picker.open'); if(open){ open.classList.remove('open'); return; }
    if(layers.length){ e.preventDefault(); closeTop(); }
  }
});
function confirmar(titulo, msg, siTxt, onSi, peligro){
  const ov = openModal(`<div class="modal-head"><h2>${h(titulo)}</h2><button class="x-btn" data-close>${icon('x')}</button></div>
    <div class="modal-body" style="font-size:13.5px; line-height:1.55">${msg}</div>
    <div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn ${peligro?'btn-danger':'btn-primary'}" id="cf-si">${h(siTxt||'Aceptar')}</button></div>`);
  $('#cf-si', ov).onclick = ()=>{ closeTop(); onSi(); };
}

/* ---------- PICKER CON BÚSQUEDA ---------- */
function mountPicker(host, opts){
  host.classList.add('picker');
  host.innerHTML = `<input class="input" autocomplete="off" placeholder="${h(opts.placeholder||'Buscar…')}"><button type="button" class="clear" title="Quitar">×</button><div class="plist"></div>`;
  const inp = $('input', host), list = $('.plist', host), clr = $('.clear', host);
  let hl = 0, shown = [];
  const setLabel = ()=>{ inp.value = opts.label() || ''; clr.style.display = inp.value ? '' : 'none'; };
  const draw = ()=>{
    const q = norm(inp.value).split(/\s+/).filter(Boolean);
    const all = opts.items();
    shown = all.filter(it=> !q.length || q.every(t=> norm(it.label+' '+(it.sub||'')).includes(t))).slice(0, 80);
    hl = 0;
    list.innerHTML = shown.length ? shown.map((it,i)=>`<div class="opt ${i===0?'hl':''}" data-i="${i}">${h(it.label)}${it.sub?`<small>${h(it.sub)}</small>`:''}</div>`).join('') : `<div class="opt faint" style="cursor:default">${h(opts.empty||'Sin resultados')}</div>`;
  };
  const pick = it=>{ host.classList.remove('open'); opts.onPick(it); setLabel(); };
  inp.addEventListener('focus', ()=>{ inp.select(); draw(); host.classList.add('open'); });
  inp.addEventListener('input', ()=>{ draw(); host.classList.add('open'); });
  inp.addEventListener('keydown', e=>{
    if(!host.classList.contains('open')) return;
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); hl = Math.max(0, Math.min(shown.length-1, hl + (e.key==='ArrowDown'?1:-1))); $$('.opt', list).forEach((o,i)=>o.classList.toggle('hl', i===hl)); const o = $$('.opt', list)[hl]; if(o) o.scrollIntoView({block:'nearest'}); }
    if(e.key==='Enter'){ e.preventDefault(); if(shown[hl]) pick(shown[hl]); }
  });
  inp.addEventListener('blur', ()=> setTimeout(()=>{ host.classList.remove('open'); if(!inp.value.trim() && opts.label()){ opts.onPick(null); } setLabel(); }, 160));
  list.addEventListener('mousedown', e=>{ const o = e.target.closest('[data-i]'); if(o){ e.preventDefault(); pick(shown[Number(o.dataset.i)]); } });
  clr.onclick = ()=>{ opts.onPick(null); setLabel(); inp.focus(); };
  setLabel();
  return { refresh: setLabel };
}

/* ---------- FORMULARIO ---------- */
let F = null;      // cirugía en edición (copia)
let F_ORIG = null; // original (para detectar reprogramación)
function abrirForm(id, pre){
  if(!exigir('Programador')) return;
  if(id){ const c = S.cirugias.find(x=>x.id===id); if(!c) return; F = clone(c); F_ORIG = clone(c); }
  else { F = nuevaCirugia(pre); F_ORIG = null; if(pre && pre.cotizacionObj){ aplicarCotizacion(pre.cotizacionObj); delete F.cotizacionObj; } }
  const ov = openModal(`<div class="modal-head"><h2>${F_ORIG ? 'Editar programación '+h(F.id) : 'Programar cirugía'}</h2><button class="x-btn" data-close>${icon('x')}</button></div>
    <div class="modal-body" id="form-body"></div>
    <div class="modal-foot"><span class="faint" style="font-size:12px; margin-right:auto">Los campos con <span style="color:var(--red)">*</span> son obligatorios. ESC cierra sin guardar.</span><button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="f-save">${icon('check')} Guardar programación</button></div>`, 'xl');
  $('#f-save', ov).onclick = guardarForm;
  const body = $('#form-body', ov);
  body.addEventListener('input', onFormInput); body.addEventListener('change', onFormInput);
  body.addEventListener('click', onFormClick);
  drawForm();
}
const fld = (label, inner, cls, hint)=> `<div class="ff ${cls||''}"><label>${label}</label>${inner}${hint?`<span class="hint">${hint}</span>`:''}</div>`;
const req = '<span class="req">*</span>';
function inp(path, type, attrs){ const v = getPath(F, path); return `<input class="input" data-f="${path}" type="${type||'text'}" value="${h(v==null?'':v)}" ${attrs||''}>`; }
function sel(path, options, blank, attrs){ const v = getPath(F, path); return `<select class="input" data-f="${path}" ${attrs||''}>${blank!=null?`<option value="">${h(blank)}</option>`:''}${options.map(o=>{ const val = typeof o==='string'?o:o.v, t = typeof o==='string'?o:o.t; return `<option value="${h(val)}" ${String(v)===String(val)?'selected':''}>${h(t)}</option>`; }).join('')}</select>`; }
function txa(path, ph){ return `<textarea class="input" data-f="${path}" placeholder="${h(ph||'')}">${h(getPath(F, path)||'')}</textarea>`; }
function chips(path, items){ const arr = getPath(F, path)||[]; return items.length ? `<div class="chips" data-chips="${path}">${items.map(i=>`<button type="button" class="chip ${arr.includes(i.id)?'on':''}" data-id="${i.id}">${h(i.nombre)}${i.cantidad>1?` <span class="faint">×${i.cantidad}</span>`:''}</button>`).join('')}</div>` : `<span class="faint" style="font-size:12px">Sin opciones. Agrégalas en Configuración.</span>`; }
function optsCfg(k, actual){ return cfgList(k).filter(x=>x.activo!==false || x.id===actual).map(x=>({v:x.id, t:x.nombre+(x.activo===false?' (inactivo)':'')})); }
function chipItems(k, actuales){ return cfgList(k).filter(x=>x.activo!==false || (actuales||[]).includes(x.id)); }

function drawForm(){
  const body = $('#form-body'); if(!body) return;
  const st = body.scrollTop;
  const hz = S.config.horario;
  const cot = F.cotizacion;
  const personal = (rol)=> cfgList('personal').filter(p=>p.activo!==false && (!rol || p.rol===rol || p.rol==='Enfermería' || p.rol==='Otro')).map(p=>({v:p.id, t:p.nombre+(p.rol?' · '+p.rol:'')}));
  body.innerHTML = `<div class="form-grid"><div>
    <div class="fsec"><h3><span class="n">1</span> Origen — cotización del CRM</h3>
      ${cot ? `<div class="alert info" style="margin-bottom:10px">${icon('link')}<div style="flex:1"><b>Ligada a ${h(cot.folio)}</b> ${cot.tipo==='aseguradora'?'(aseguradora)':''} · ${h(cot.procedimiento||'')}<br><span style="font-size:12px">Estatus en CRM: ${h(cot.estatusCRM||'—')} · Monto: ${money(cot.monto)}${cot.lista?' · Lista: '+h(cot.lista):''}</span></div><button type="button" class="btn btn-sm" data-act="desligar">Desligar</button></div>` : ''}
      <div class="fr"><div class="ff c4"><label>${cot?'Cambiar cotización ligada':'Ligar a una cotización del CRM'} <span class="faint" style="font-weight:500">(opcional — autollena médico, procedimiento, estancia, pago)</span></label><div id="pk-cot"></div>${CRM.generado?'':`<span class="hint" style="color:var(--amber)">Aún no hay datos del CRM en este navegador. Ve a "Conexión y respaldos".</span>`}</div></div>
    </div>

    <div class="fsec"><h3><span class="n">2</span> Agenda</h3>
      <div class="fr">
        ${fld('Fecha '+req, inp('fecha','date'))}
        ${fld('Hora de inicio '+req, inp('horaInicio','time','step="300"'))}
        ${fld('Horas de quirófano '+req, `<input class="input" type="number" min="0.25" step="0.25" data-f="_horas" value="${F.duracionMin? +(F.duracionMin/60).toFixed(2):''}">`, '', 'Ej. 1.5 = 1 h 30 min')}
        ${fld('Termina', `<div class="calc" id="calc-fin">${icon('clock')} ${h(finTxt(F))}</div>`, '', `+ ${hz.limpiezaMin} min de limpieza`)}
        ${fld('Sala '+req, sel('salaId', optsCfg('salas', F.salaId), 'Selecciona…'))}
        ${fld('Prioridad', sel('prioridad', ['Electiva','Urgencia']))}
        ${fld('Estatus', sel('estatus', Object.keys(ESTATUS)), 'c2')}
      </div>
    </div>

    <div class="fsec"><h3><span class="n">3</span> Equipo médico</h3>
      <div class="fr">
        <div class="ff c2"><label>Cirujano ${req}</label><div id="pk-cir"></div><span class="hint" id="h-cir">${F.cirujanoEsp?h(F.cirujanoEsp):'Del directorio del CRM (o médicos externos de Configuración)'}</span></div>
        <div class="ff c2"><label>Anestesiólogo</label><div id="pk-anes"></div><span class="hint">Solo médicos con especialidad de Anestesiología (${anestesiologos().length} disponibles)</span></div>
        ${fld('Ayudante(s)', inp('ayudantes','text','list="dl-medicos" placeholder="Nombre(s) del ayudante"'), 'c2')}
        ${fld('Instrumentista', sel('instrumentistaId', personal('Instrumentista'), personal().length?'Sin asignar':'Agrega personal en Configuración'))}
        ${fld('Circulante', sel('circulanteId', personal('Circulante'), personal().length?'Sin asignar':'Agrega personal en Configuración'))}
      </div>

    <div class="fsec"><h3><span class="n">4</span> Paciente</h3>
      <div class="fr">
        <div class="ff c2"><label>Nombre completo ${req}</label><input class="input" data-f="paciente.nombre" list="dl-pacientes" value="${h(F.paciente.nombre)}" placeholder="Nombre y apellidos"><datalist id="dl-pacientes">${pacientesPrevios().map(p=>`<option value="${h(p.nombre)}">${p.fnac?h(fmtF(p.fnac)):''}</option>`).join('')}</datalist></div>
        ${fld('Fecha de nacimiento', inp('paciente.fnac','date', `max="${todayYMD()}"`))}
        ${fld('Edad', `<div class="calc" id="calc-edad">${F.paciente.fnac?h(edadTxt(F.paciente.fnac, F.fecha)):'<span class="faint">automática</span>'}</div>`, '', 'Calculada al día de la cirugía')}
        ${fld('Sexo', sel('paciente.sexo', ['Femenino','Masculino'], '—'))}

        ${fld('Clasificación ASA', sel('paciente.asa', ['ASA I','ASA II','ASA III','ASA IV','ASA V','ASA VI'], '—'), '', 'La define anestesiología')}
        ${fld('Alergias', inp('paciente.alergias','text','placeholder="Negadas / especificar"'), 'c2')}

    </div>

    <div class="fsec"><h3><span class="n">5</span> Procedimiento y anestesia</h3>
      <div class="fr">
        ${fld('Procedimiento '+req, inp('procedimiento','text','placeholder="Ej. Colecistectomía laparoscópica"'), 'c2')}
        ${fld('Diagnóstico', inp('diagnostico'), 'c2')}
        ${fld('Lateralidad', sel('lateralidad', ['No aplica','Derecha','Izquierda','Bilateral']), '', 'Seguridad: sitio quirúrgico')}
        ${fld('Tipo de anestesia', sel('tipoAnestesiaId', optsCfg('tiposAnestesia', F.tipoAnestesiaId), 'Selecciona…'), 'c3')}

          ${fld('Hora de ingreso', inp('ingresoHora','time'))}
          <div class="ff c2"><label>Alta estimada</label><div class="calc" id="calc-alta">${altaTxt(F)}</div></div>
          <div class="ff c2"><label>&nbsp;</label><label class="chip ${F.uciPostop?'on':''}" style="align-self:flex-start; cursor:pointer"><input type="checkbox" data-f="uciPostop" ${F.uciPostop?'checked':''} style="display:none"> Requiere UCI postquirúrgica</label></div>

    <div class="fsec"><h3><span class="n">6</span> Tipo de atención y pago</h3>
      <div class="fr">
        ${fld('Atención', sel('tipoAtencion', ['Particular','Aseguradora','Convenio / financiamiento']))}
        ${F.tipoAtencion==='Aseguradora' ? `
          ${fld('Aseguradora', sel('aseguradoraId', optsCfg('aseguradoras', F.aseguradoraId), 'Selecciona…'))}
          ${fld('No. de póliza', inp('poliza'))}
          ${fld('No. de siniestro / autorización', inp('siniestro'))}
          ${fld('Estatus de autorización', sel('autorizacion', ['Pendiente','En trámite','Autorizada','Rechazada']))}
        ` : ''}
        ${F.tipoAtencion==='Convenio / financiamiento' ? fld('Convenio / financiera', sel('convenioId', optsCfg('convenios', F.convenioId), 'Selecciona…')) : ''}
        ${fld('Monto cotizado', inp('montoCotizado','number','step="0.01" min="0"'))}
        ${fld('Anticipo recibido', inp('anticipo','number','step="0.01" min="0"'))}
      </div>
    </div>

    <div class="fsec"><h3><span class="n">7</span> Requerimientos y departamentos</h3>
      <div class="ff" style="margin-bottom:14px"><label>Equipo especial</label>${chips('equipos', chipItems('equipos', F.equipos))}</div>
      <div class="ff" style="margin-bottom:14px"><label>Proveedores</label>
        ${(F.proveedores||[]).map((p,i)=>`<div class="prov-row">
          <select class="input" data-prov="${i}" data-k="provId"><option value="">Proveedor…</option>${cfgList('proveedores').filter(x=>x.activo!==false||x.id===p.provId).map(x=>`<option value="${x.id}" ${x.id===p.provId?'selected':''}>${h(x.nombre)}${x.giro?' · '+h(x.giro):''}</option>`).join('')}</select>
          <input class="input" data-prov="${i}" data-k="material" value="${h(p.material||'')}" placeholder="Material / equipo que surte">
          <label class="chip ${p.confirmado?'on':''}" style="cursor:pointer"><input type="checkbox" data-prov="${i}" data-k="confirmado" ${p.confirmado?'checked':''} style="display:none">Confirmado</label>
          <button type="button" class="btn btn-icon btn-danger" data-act="prov-del" data-i="${i}" title="Quitar">${icon('trash')}</button></div>`).join('')}
        <div class="row"><button type="button" class="btn btn-sm" data-act="prov-add">${icon('plus')} Agregar proveedor</button>${cfgList('proveedores').length?'':'<span class="faint" style="font-size:12px">Da de alta tus proveedores en Configuración → Proveedores.</span>'}</div>
        ${fld('Nota para proveedores', inp('notaProveedores','text','placeholder="Ej. llevar set de placas 3.5, entrega 6:30 am"'))}
      </div>
      <div class="ff" style="margin-bottom:14px"><label>Laboratorio</label>${chips('laboratorio', chipItems('laboratorio', F.laboratorio))}${inp('notaLab','text','placeholder="Nota para laboratorio" style="margin-top:6px"')}</div>
      <div class="ff" style="margin-bottom:14px"><label>Imagenología</label>${chips('imagenologia', chipItems('imagenologia', F.imagenologia))}${inp('notaImagen','text','placeholder="Nota para imagenología (técnico de arco en C, horario…)" style="margin-top:6px"')}</div>
      <div class="ff"><label>Servicios de apoyo</label>${chips('servicios', chipItems('servicios', F.servicios))}
        ${(F.servicios||[]).some(id=>/sangre/i.test(cfgNombre('servicios', id))) ? inp('hemoderivados','text','placeholder="Hemoderivados a reservar (ej. 2 paquetes globulares O+)" style="margin-top:6px"') : ''}</div>
    </div>

    <div class="fsec"><h3><span class="n">8</span> Checklist y notas</h3>
      <div class="check-list" style="margin-bottom:12px">${checklistAplicable(F).map(it=>`<label class="${F.checklist[it.id]?'done':''}"><input type="checkbox" data-check="${it.id}" ${F.checklist[it.id]?'checked':''}> ${h(it.nombre)} ${it.aplica && it.aplica!=='Siempre'?`<span class="faint" style="font-size:11px">(${h(it.aplica)})</span>`:''}</label>`).join('') || '<span class="faint">Sin elementos de checklist.</span>'}</div>
      <div class="fr">${fld('Notas generales', txa('notas'), 'c2')}${fld('Indicaciones para enfermería / quirófano', txa('notasEnfermeria','Posición, material especial, instrumental…'), 'c2')}</div>
    </div>
  </div>
  <div class="side-panel"><div class="card" style="padding:14px"><div style="font-weight:700; font-size:13px; margin-bottom:10px">${icon('alert')} Conflictos de agenda</div><div id="live-confl"></div></div>
    <div class="card" style="padding:14px"><div style="font-weight:700; font-size:13px; margin-bottom:10px">${icon('check')} Pendientes para estar lista</div><div id="live-pend"></div></div>
    <div class="card" style="padding:14px; font-size:12.5px; line-height:1.6" id="live-res"></div>
  </div></div>`;
  body.scrollTop = st;
  mountPicker($('#pk-cot'), {
    placeholder: 'Folio, procedimiento o médico…', empty: CRM.generado ? 'Sin cotizaciones que coincidan' : 'Sin datos del CRM',
    items: ()=> cotizacionesLigables().map(q=>{ const ya = cirugiaDeCot(q.folio, q.tipo); return {q, label: q.folio+' · '+(q.procedimiento||''), sub: (q.medico_nombre||'')+' · '+q.estatus+(q.tipo==='aseguradora'?' · '+(q.aseguradora||'Aseguradora'):'')+(ya && ya.id!==F.id?' · YA PROGRAMADA ('+ya.id+')':'')}; }),
    label: ()=> '', onPick: it=>{ if(!it) return; const ya = cirugiaDeCot(it.q.folio, it.q.tipo); if(ya && ya.id!==F.id) toast('Ojo: esa cotización ya está ligada a '+ya.id); aplicarCotizacion(it.q); drawForm(); }
  });
  mountPicker($('#pk-cir'), {
    placeholder: 'Buscar médico o especialidad…',
    items: ()=> cirujanos().map(m=>({m, label:m.nombre, sub:(m.esp||'Sin especialidad')+(m.fuente==='Externo'?' · externo':'')})),
    label: ()=> F.cirujanoNombre, onPick: it=>{ F.cirujanoId = it?it.m.id:null; F.cirujanoNombre = it?it.m.nombre:''; F.cirujanoEsp = it?it.m.esp:''; $('#h-cir').textContent = F.cirujanoEsp || ''; updateLive(); }
  });
  mountPicker($('#pk-anes'), {
    placeholder: 'Buscar anestesiólogo…', empty: 'No hay anestesiólogos (revisa conexión con el CRM)',
    items: ()=> anestesiologos().map(m=>({m, label:m.nombre, sub:m.esp+(m.tel?' · '+m.tel:'')})),
    label: ()=> F.anestesiologoNombre, onPick: it=>{ F.anestesiologoId = it?it.m.id:null; F.anestesiologoNombre = it?it.m.nombre:''; updateLive(); }
  });
  updateLive();
}
function pacientesPrevios(){ const m = new Map(); S.cirugias.forEach(c=>{ if(c.paciente && c.paciente.nombre){ const k = norm(c.paciente.nombre); if(!m.has(k) || (c.actualizado||'') > (m.get(k)._t||'')) m.set(k, Object.assign({_t:c.actualizado||''}, c.paciente)); } }); return Array.from(m.values()); }
function imcTxt(p){ const w = Number(p.peso), t = Number(p.talla)/100; if(!w || !t) return ''; const i = w/(t*t); const cat = i<18.5?'bajo peso':i<25?'normal':i<30?'sobrepeso':i<35?'obesidad I':i<40?'obesidad II':'obesidad III'; return i.toFixed(1)+' <span class="faint" style="font-weight:500">('+cat+')</span>'; }
function altaTxt(c){ if(!c.diasEstancia || !c.fecha) return '<span class="faint">—</span>'; const base = c.ingresoFecha && c.ingresoFecha < c.fecha ? c.ingresoFecha : c.fecha; return fmtFC(addDays(base, Number(c.diasEstancia)||0)); }
function aplicarCotizacion(q){
  F.cotizacion = { folio:q.folio, tipo:q.tipo||'particular', procedimiento:q.procedimiento||'', monto:q.monto, estatusCRM:q.estatus, lista:q.lista_nombre||'' };
  if(q.id_medico!=null){ const m = medicoById('crm:'+q.id_medico); F.cirujanoId = 'crm:'+q.id_medico; F.cirujanoNombre = m?m.nombre:(q.medico_nombre||''); F.cirujanoEsp = m?m.esp:(q.especialidad||''); }
  if(q.procedimiento) F.procedimiento = q.procedimiento;
  if(q.tipo_procedimiento) F.tipoEstancia = /HOSPITAL/i.test(q.tipo_procedimiento) ? 'Hospitalización' : 'Ambulatorio';
  if(q.monto!=null) F.montoCotizado = Math.round(Number(q.monto)*100)/100;
  if(q.tipo==='aseguradora' && q.aseguradora){
    F.tipoAtencion = 'Aseguradora';
