    let a = cfgList('aseguradoras').find(x=>norm(x.nombre)===norm(q.aseguradora) || norm(x.nombre).includes(norm(q.aseguradora)) || norm(q.aseguradora).includes(norm(x.nombre)));
    if(!a){ a = {id:uid('c'), nombre:q.aseguradora, activo:true}; F.aseguradoraId = a.id; agregarACatalogo('aseguradoras', a).then(x=>{ if(F && x && F.aseguradoraId===a.id){ F.aseguradoraId = x.id; } }); toast('Se agregó "'+q.aseguradora+'" al catálogo de aseguradoras'); }
    else F.aseguradoraId = a.id;
  } else if(q.convenios && q.convenios.length){
    const cv = cfgList('convenios').find(x=> q.convenios.some(n=>norm(n).includes(norm(x.nombre)) || norm(x.nombre).includes(norm(n))));
    if(cv){ F.tipoAtencion = 'Convenio / financiamiento'; F.convenioId = cv.id; }
  }
  if(q.proveedor_nombre && !(F.proveedores||[]).length){
    const p = cfgList('proveedores').find(x=>norm(x.nombre)===norm(q.proveedor_nombre));
    F.proveedores = [{provId: p?p.id:'', material: p?'':q.proveedor_nombre, confirmado:false}];
  }
  if(q.fecha_programacion && !F_ORIG){ const fp = String(q.fecha_programacion).slice(0,10); if(fp >= todayYMD() || !F.fecha) F.fecha = fp; }
}
function onFormInput(e){
  const t = e.target;
  if(t.dataset.check){ F.checklist[t.dataset.check] = t.checked; t.closest('label').classList.toggle('done', t.checked); updateLive(); return; }
  if(t.dataset.prov!=null){ const p = F.proveedores[Number(t.dataset.prov)]; if(t.dataset.k==='confirmado'){ p.confirmado = t.checked; t.closest('label').classList.toggle('on', t.checked); } else p[t.dataset.k] = t.value; updateLive(); return; }
  const path = t.dataset.f; if(!path) return;
  if(path==='_horas'){ const v = parseFloat(t.value); F.duracionMin = isNaN(v) ? 0 : Math.round(v*60); updateLive(); return; }
  let v = t.type==='checkbox' ? t.checked : t.value;
  if(t.type==='number' && v!=='' ) v = Number(v);
  setPath(F, path, v);
  if(path==='uciPostop'){ t.closest('label').classList.toggle('on', t.checked); }
  if(path==='paciente.nombre' && e.type==='change'){
    const p = pacientesPrevios().find(x=>norm(x.nombre)===norm(v));
    if(p && !F.paciente.fnac){ ['fnac','sexo','telefono','correo','expediente','peso','talla','alergias','comorbilidades','responsable','responsableTel'].forEach(k=>{ if(!F.paciente[k] && p[k]) F.paciente[k] = p[k]; }); toast('Datos del paciente recuperados de una programación anterior'); drawForm(); return; }
  }
  if(['tipoEstancia','tipoAtencion','servicios'].includes(path) && e.type==='change'){ drawForm(); return; }
  updateLive();
}
function onFormClick(e){
  const chip = e.target.closest('[data-chips] .chip');
  if(chip){ const path = chip.parentElement.dataset.chips; const arr = getPath(F, path)||[]; const id = chip.dataset.id; const i = arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id); setPath(F, path, arr); if(path==='servicios'||path==='equipos') drawForm(); else { chip.classList.toggle('on'); updateLive(); } return; }
  const act = e.target.closest('[data-act]'); if(!act) return;
  if(act.dataset.act==='prov-add'){ F.proveedores = F.proveedores||[]; F.proveedores.push({provId:'', material:'', confirmado:false}); drawForm(); }
  if(act.dataset.act==='prov-del'){ F.proveedores.splice(Number(act.dataset.i),1); drawForm(); }
  if(act.dataset.act==='desligar'){ F.cotizacion = null; drawForm(); }
}
function updateLive(){
  const fin = $('#calc-fin'); if(fin) fin.innerHTML = icon('clock')+' '+h(finTxt(F))+(F.duracionMin?` <span class="faint" style="font-weight:500">(${durTxt(F.duracionMin)})</span>`:'');
  const ed = $('#calc-edad'); if(ed){ const t = edadTxt(F.paciente.fnac, F.fecha); const a = edadAnios(F.paciente.fnac, F.fecha); ed.innerHTML = t ? h(t)+(a!=null && a<18?' <span class="pill p-violet">Pediátrico</span>':'')+(a!=null && a>=65?' <span class="pill p-amber">Adulto mayor</span>':'') : '<span class="faint">automática</span>'; }
  const im = $('#calc-imc'); if(im) im.innerHTML = imcTxt(F.paciente) || '<span class="faint">automático</span>';
  const al = $('#calc-alta'); if(al) al.innerHTML = altaTxt(F);
  const cf = conflictos(F); const box = $('#live-confl');
  if(box) box.innerHTML = cf.length ? cf.map(x=>`<div class="alert ${x.nivel}" style="margin-bottom:6px">${icon(x.nivel==='err'?'alert':'info')}<div><b>${h(x.tipo)}:</b> ${h(x.msg)}</div></div>`).join('') : `<div class="alert ok">${icon('check')} Sin choques de sala, médicos, personal ni equipo.</div>`;
  const pd = pendientes(F); const pb = $('#live-pend');
  if(pb) pb.innerHTML = pd.length ? `<ul style="padding-left:18px; font-size:12.5px; line-height:1.6; color:var(--amber)">${pd.map(x=>`<li>${h(x)}</li>`).join('')}</ul><div class="faint" style="font-size:11.5px; margin-top:6px">Puedes guardar con pendientes; se marcarán en la agenda.</div>` : `<div class="alert ok">${icon('check')} Todo listo.</div>`;
  const rs = $('#live-res'); if(rs) rs.innerHTML = `<b>${h(F.procedimiento||'Procedimiento')}</b><br>${F.fecha?h(fmtFL(F.fecha)):''}<br>${h(F.horaInicio||'')}–${h(finTxt(F))} · ${h(salaNombre(F.salaId))}<br>${h(F.cirujanoNombre||'Sin cirujano')}<br>${h(F.paciente.nombre||'Sin paciente')}${F.paciente.fnac?' · '+h(edadTxt(F.paciente.fnac,F.fecha)):''}`;
}
function guardarForm(){
  const faltan = [];
  if(!F.fecha) faltan.push('fecha'); if(!F.horaInicio) faltan.push('hora de inicio'); if(!F.duracionMin) faltan.push('horas de quirófano');
  if(!F.salaId) faltan.push('sala'); if(!F.cirujanoNombre) faltan.push('cirujano'); if(!F.paciente.nombre.trim()) faltan.push('nombre del paciente'); if(!F.procedimiento.trim()) faltan.push('procedimiento');
  if(faltan.length){ toast('Falta: '+faltan.join(', ')); return; }
  if(F.paciente.fnac && F.paciente.fnac > F.fecha){ toast('La fecha de nacimiento es posterior a la cirugía'); return; }
  const errs = conflictos(F).filter(x=>x.nivel==='err');
  const doSave = async ()=>{
    const now = new Date().toISOString();
    if(F_ORIG){
      const cambios = [];
      if(F_ORIG.fecha!==F.fecha || F_ORIG.horaInicio!==F.horaInicio || F_ORIG.salaId!==F.salaId) cambios.push('Reprogramada: '+fmtF(F_ORIG.fecha)+' '+F_ORIG.horaInicio+' '+salaNombre(F_ORIG.salaId)+' → '+fmtF(F.fecha)+' '+F.horaInicio+' '+salaNombre(F.salaId));
      if(F_ORIG.duracionMin!==F.duracionMin) cambios.push('Duración: '+durTxt(F_ORIG.duracionMin)+' → '+durTxt(F.duracionMin));
      if(F_ORIG.estatus!==F.estatus) cambios.push('Estatus: '+F_ORIG.estatus+' → '+F.estatus);
      if((F_ORIG.cotizacion&&F_ORIG.cotizacion.folio)!==(F.cotizacion&&F.cotizacion.folio)) cambios.push('Cotización: '+((F_ORIG.cotizacion&&F_ORIG.cotizacion.folio)||'ninguna')+' → '+((F.cotizacion&&F.cotizacion.folio)||'ninguna'));
      logH(F, 'Edición', cambios.join(' · ') || 'Datos actualizados');
      if(errs.length) logH(F, 'Guardada con conflicto', errs.map(x=>x.tipo).join(', '));
    } else {
      F.id = null; F.creado = now; F.actualizado = now; F.historial = [];
      logH(F, 'Programada', fmtF(F.fecha)+' '+F.horaInicio+' · '+salaNombre(F.salaId)+(F.cotizacion?' · ligada a '+F.cotizacion.folio:''));
      if(errs.length) logH(F, 'Guardada con conflicto', errs.map(x=>x.tipo).join(', '));
    }
    const btn = $('#f-save'); if(btn){ btn.disabled = true; btn.innerHTML = 'Guardando…'; }
    const ok = await guardarCirugia(F, F_ORIG ? 'Editar' : 'Programar');
    if(!ok){ if(btn){ btn.disabled = false; btn.innerHTML = icon('check')+' Guardar programación'; } if(F_ORIG){ const cur = S.cirugias.find(x=>x.id===F.id); if(cur && cur._ver!==F._ver){ closeTop(); render(); abrirDetalle(cur.id); } } return; }
    closeTop(); toast('Programación '+ok.id+' guardada'); UI.fecha = ok.fecha; render();
  };
  if(errs.length){
    confirmar('Hay conflictos de agenda', `<p style="margin-bottom:10px">Esta programación choca con:</p>${errs.map(x=>`<div class="alert err" style="margin-bottom:6px">${icon('alert')}<div><b>${h(x.tipo)}:</b> ${h(x.msg)}</div></div>`).join('')}<p style="margin-top:10px">¿Quieres guardarla de todos modos? Quedará registrado en su historial.</p>`, 'Guardar con conflicto', doSave, true);
  } else doSave();
}
</script>
<script>
/* =====================================================================
   DETALLE, CAMBIOS DE ESTATUS, IMPRESIÓN
   ===================================================================== */
function nombres(k, ids){ return (ids||[]).map(id=>cfgNombre(k,id)).filter(Boolean); }
function provTxt(c){ return (c.proveedores||[]).map(p=> (cfgNombre('proveedores', p.provId)||'Proveedor sin elegir')+(p.material?' — '+p.material:'')+(p.confirmado?' ✓':' (sin confirmar)')); }
function abrirDetalle(id){
  const c = S.cirugias.find(x=>x.id===id); if(!c) return;
  if(layers.length && layers[layers.length-1].el.classList.contains('drawer')) closeTop();
  const pend = pendientes(c), confl = conflictos(c);
  const dd = (k, v)=> v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const acciones = [];
  if(c.estatus==='Tentativa') acciones.push(`<button class="btn btn-primary btn-sm" data-st="Confirmada">${icon('check')} Confirmar</button>`);
  if(['Tentativa','Confirmada'].includes(c.estatus)) acciones.push(`<button class="btn btn-sm" data-st="En quirófano">${icon('play')} Paciente en sala</button>`);
  if(['Confirmada','En quirófano'].includes(c.estatus)) acciones.push(`<button class="btn btn-sm" data-st="Realizada">${icon('check')} Marcar realizada</button>`);
  if(ABIERTAS.includes(c.estatus)) acciones.push(`<button class="btn btn-sm" data-st="Suspendida">${icon('pause')} Suspender</button><button class="btn btn-sm btn-danger" data-st="Cancelada">${icon('x')} Cancelar</button>`);
  if(['Suspendida','Cancelada'].includes(c.estatus)) acciones.push(`<button class="btn btn-sm" data-st="Tentativa">${icon('undo')} Reactivar</button>`);
  if(c.estatus==='Realizada') acciones.push(`<button class="btn btn-sm" data-st="Realizada">${icon('clock')} Horas reales</button>`);
  const edad = c.paciente.fnac ? edadTxt(c.paciente.fnac, c.fecha) : '';
  const dr = openDrawer(`<div class="modal-head"><div style="flex:1"><div class="mono faint" style="font-size:12px">${h(c.id)}${c.cotizacion?' · '+icon('link')+' '+h(c.cotizacion.folio):''}</div><h2 style="margin-top:2px">${h(c.procedimiento)}</h2></div>${stPill(c.estatus)}<button class="x-btn" data-close>${icon('x')}</button></div>
    <div class="modal-body">
      <div class="row ro-hide" style="gap:6px; margin-bottom:12px">${acciones.join('')}</div>
      <div class="row" style="gap:6px; margin-bottom:14px"><button class="btn btn-sm ro-hide" id="d-edit">${icon('edit')} Editar / reprogramar</button><button class="btn btn-sm" id="d-print">${icon('print')} Hoja de programación</button><button class="btn btn-sm ro-hide" id="d-dup">${icon('copy')} Duplicar</button><button class="btn btn-sm btn-danger admin-only" id="d-del">${icon('trash')}</button></div>
      ${confl.filter(x=>x.nivel==='err').map(x=>`<div class="alert err" style="margin-bottom:6px">${icon('alert')}<div><b>${h(x.tipo)}:</b> ${h(x.msg)}</div></div>`).join('')}
      ${ABIERTAS.includes(c.estatus) ? (pend.length ? `<div class="alert warn" style="margin-bottom:6px">${icon('alert')}<div><b>${pend.length} pendiente(s):</b><br>${pend.map(h).join('<br>')}</div></div>` : `<div class="alert ok">${icon('check')} Lista para quirófano</div>`) : ''}
      ${c.estatus==='Cancelada'||c.estatus==='Suspendida' ? `<div class="alert err">${icon('info')}<div><b>${h(c.estatus)}:</b> ${h(c.motivoCancelacion||'sin motivo')}${c.notaCancelacion?' — '+h(c.notaCancelacion):''}</div></div>`:''}
      <div class="dsec"><h4>${icon('cal')} Agenda</h4><dl class="kv">
        ${dd('Fecha', h(fmtFL(c.fecha)))}${dd('Horario', h(c.horaInicio+' – '+finTxt(c))+' <span class="faint">('+durTxt(c.duracionMin)+')</span>')}
        ${dd('Sala', `<span class="dot" style="background:${salaColor(c.salaId)}"></span> `+h(salaNombre(c.salaId)))}${dd('Prioridad', h(c.prioridad))}
        ${c.horaRealInicio?dd('Horario real', h(c.horaRealInicio+' – '+(c.horaRealFin||'?'))+(c.horaRealInicio&&c.horaRealFin?' <span class="faint">('+durTxt(Math.max(0,toMin(c.horaRealFin)-toMin(c.horaRealInicio)+(toMin(c.horaRealFin)<toMin(c.horaRealInicio)?1440:0)))+')</span>':'')):''}
      </dl></div>
      <div class="dsec"><h4>${icon('doctor')} Equipo médico</h4><dl class="kv">
        ${dd('Cirujano', h(c.cirujanoNombre)+(c.cirujanoEsp?`<br><span class="faint">${h(c.cirujanoEsp)}</span>`:''))}${dd('Anestesiólogo', h(c.anestesiologoNombre)||'<span style="color:var(--amber)">Sin asignar</span>')}
        ${dd('Ayudante(s)', h(c.ayudantes))}${dd('Instrumentista', h(cfgNombre('personal', c.instrumentistaId)))}${dd('Circulante', h(cfgNombre('personal', c.circulanteId)))}
      </dl></div>
      <div class="dsec"><h4>${icon('user')} Paciente</h4><dl class="kv">
        ${dd('Nombre', h(c.paciente.nombre))}${dd('Edad', edad ? h(edad)+' <span class="faint">(nac. '+h(fmtF(c.paciente.fnac))+')</span>' : '<span style="color:var(--amber)">Sin fecha de nacimiento</span>')}
        ${dd('Sexo', h(c.paciente.sexo))}${dd('Teléfono', h(c.paciente.telefono))}${dd('Correo', h(c.paciente.correo))}${dd('Expediente', h(c.paciente.expediente))}
        ${dd('Peso / talla', c.paciente.peso||c.paciente.talla ? h((c.paciente.peso||'?')+' kg / '+(c.paciente.talla||'?')+' cm')+(imcTxt(c.paciente)?' · IMC '+imcTxt(c.paciente):'') : '')}
        ${dd('ASA', h(c.paciente.asa))}${dd('Alergias', h(c.paciente.alergias))}${dd('Comorbilidades', h(c.paciente.comorbilidades))}
        ${dd('Responsable', h([c.paciente.responsable, c.paciente.responsableTel].filter(Boolean).join(' · ')))}
      </dl></div>
      <div class="dsec"><h4>${icon('scalpel')} Procedimiento</h4><dl class="kv">
        ${dd('Diagnóstico', h(c.diagnostico))}${dd('Lateralidad', c.lateralidad!=='No aplica'?h(c.lateralidad):'')}${dd('Anestesia', h(cfgNombre('tiposAnestesia', c.tipoAnestesiaId))||'<span style="color:var(--amber)">Sin definir</span>')}
        ${dd('Tipo', h(c.tipoEstancia)+(c.tipoEstancia==='Hospitalización'?' · '+h((c.diasEstancia||'?')+' día(s)')+(c.habitacionId?' · '+h(cfgNombre('habitaciones',c.habitacionId)):'')+(c.uciPostop?' · <b>UCI postquirúrgica</b>':''):''))}
        ${c.tipoEstancia==='Hospitalización'?dd('Alta estimada', altaTxt(c)):''}${dd('Ingreso', h([c.ingresoFecha?fmtF(c.ingresoFecha):'', c.ingresoHora].filter(Boolean).join(' ')))}
      </dl></div>
      <div class="dsec"><h4>${icon('dept')} Atención y pago</h4><dl class="kv">
        ${dd('Atención', h(c.tipoAtencion))}${c.tipoAtencion==='Aseguradora'?dd('Aseguradora', h(cfgNombre('aseguradoras', c.aseguradoraId))+(c.poliza?' · póliza '+h(c.poliza):'')+(c.siniestro?' · siniestro '+h(c.siniestro):'')+` · <span class="pill ${c.autorizacion==='Autorizada'?'p-green':c.autorizacion==='Rechazada'?'p-red':'p-amber'}">${h(c.autorizacion)}</span>`):''}
        ${c.tipoAtencion==='Convenio / financiamiento'?dd('Convenio', h(cfgNombre('convenios', c.convenioId))):''}
        ${dd('Monto cotizado', c.montoCotizado!==''&&c.montoCotizado!=null?money(c.montoCotizado):'')}${dd('Anticipo', c.anticipo!==''&&c.anticipo!=null?money(c.anticipo):'')}
        ${c.cotizacion?dd('Cotización CRM', h(c.cotizacion.folio)+' · '+h(c.cotizacion.estatusCRM||'')+(c.cotizacion.lista?'<br><span class="faint">Lista: '+h(c.cotizacion.lista)+'</span>':'')):''}
      </dl></div>
      <div class="dsec"><h4>${icon('box')} Requerimientos</h4><dl class="kv">
        ${dd('Equipo especial', nombres('equipos', c.equipos).map(h).join(', '))}${dd('Proveedores', provTxt(c).map(h).join('<br>')+(c.notaProveedores?'<br><span class="faint">'+h(c.notaProveedores)+'</span>':''))}
        ${dd('Laboratorio', nombres('laboratorio', c.laboratorio).map(h).join(', ')+(c.notaLab?'<br><span class="faint">'+h(c.notaLab)+'</span>':''))}
        ${dd('Imagenología', nombres('imagenologia', c.imagenologia).map(h).join(', ')+(c.notaImagen?'<br><span class="faint">'+h(c.notaImagen)+'</span>':''))}
        ${dd('Servicios', nombres('servicios', c.servicios).map(h).join(', ')+(c.hemoderivados?'<br><span class="faint">'+h(c.hemoderivados)+'</span>':''))}
      </dl>${!(c.equipos||[]).length && !(c.proveedores||[]).length && !(c.laboratorio||[]).length && !(c.imagenologia||[]).length && !(c.servicios||[]).length ? '<div class="faint" style="font-size:12.5px">Sin requerimientos especiales.</div>':''}</div>
      <div class="dsec"><h4>${icon('check')} Checklist</h4><div class="check-list">${checklistAplicable(c).map(it=>`<label class="${c.checklist[it.id]?'done':''}"><input type="checkbox" data-dcheck="${it.id}" ${c.checklist[it.id]?'checked':''} ${puede('Programador')?'':'disabled'}> ${h(it.nombre)}</label>`).join('')}</div></div>
      ${c.notas||c.notasEnfermeria ? `<div class="dsec"><h4>${icon('edit')} Notas</h4>${c.notas?`<p style="font-size:13px; white-space:pre-wrap; margin-bottom:8px">${h(c.notas)}</p>`:''}${c.notasEnfermeria?`<p style="font-size:13px; white-space:pre-wrap"><b>Enfermería:</b> ${h(c.notasEnfermeria)}</p>`:''}</div>`:''}
      <div class="dsec"><h4>${icon('undo')} Historial</h4><div style="display:flex; flex-direction:column; gap:6px">${(c.historial||[]).slice().reverse().map(x=>`<div style="font-size:12px; padding:7px 9px; background:var(--surface-2); border-radius:8px"><b>${h(x.accion)}</b> <span class="faint">· ${new Date(x.fecha).toLocaleString('es-MX',{dateStyle:'medium', timeStyle:'short'})}</span>${x.detalle?'<br>'+h(x.detalle):''}</div>`).join('')}</div></div>
    </div>`);
  $$('[data-st]', dr).forEach(b=> b.onclick = ()=> cambiarEstatus(c.id, b.dataset.st));
  $$('[data-dcheck]', dr).forEach(ch=> ch.onchange = async ()=>{ if(!exigir('Programador')){ ch.checked = !ch.checked; return; } const n = clone(c); n.checklist[ch.dataset.dcheck] = ch.checked; const it = cfgItem('checklist', ch.dataset.dcheck); logH(n, 'Checklist', (ch.checked?'☑ ':'☐ ')+(it?it.nombre:'')); $$('[data-dcheck]', dr).forEach(x=>x.disabled = true); await guardarCirugia(n, 'Checklist'); render(); abrirDetalle(c.id); });
  $('#d-edit', dr).onclick = ()=>{ closeTop(); abrirForm(c.id); };
  $('#d-print', dr).onclick = ()=> imprimirHoja(c);
  $('#d-dup', dr).onclick = ()=>{ const n = clone(c); ['id','creado','actualizado','cotizacion','horaRealInicio','horaRealFin','motivoCancelacion','notaCancelacion'].forEach(k=>n[k]=k==='cotizacion'?null:''); n.id=null; n.historial=[]; n.checklist={}; n.estatus='Tentativa'; (n.proveedores||[]).forEach(p=>p.confirmado=false); closeTop(); abrirFormDesde(n); };
  $('#d-del', dr).onclick = ()=> confirmar('Eliminar programación', `¿Eliminar <b>${h(c.id)}</b> (${h(c.procedimiento)}) de forma permanente? Si solo no se hará, mejor usa <b>Cancelar</b> para conservar el registro.`, 'Eliminar', async ()=>{ if(!exigir('Administrador')) return; if(await eliminarCirugia(c.id)){ closeAll(); render(); toast('Programación eliminada'); } }, true);
}
function abrirFormDesde(obj){ abrirForm(null, clone(obj)); }
function cambiarEstatus(id, st){
  if(!exigir('Programador')) return;
  const c = S.cirugias.find(x=>x.id===id); if(!c) return;
  const aplicar = async (extra)=>{
    const n = clone(c);
    const prev = n.estatus; Object.assign(n, extra||{}); n.estatus = st;
    logH(n, 'Cambio de estatus', prev===st ? 'Horas reales actualizadas' : prev+' → '+st+(extra&&extra.motivoCancelacion?' · '+extra.motivoCancelacion:''));
    $$('.modal-foot .btn, .drawer [data-st]').forEach(b=>b.disabled = true);
    const ok = await guardarCirugia(n, 'Estatus: '+st);
    closeAll(); render(); abrirDetalle(c.id); if(ok) toast('Estatus: '+st);
  };
  if(st==='Suspendida' || st==='Cancelada'){
    const ov = openModal(`<div class="modal-head"><h2>${st==='Cancelada'?'Cancelar':'Suspender'} ${h(c.id)}</h2><button class="x-btn" data-close>${icon('x')}</button></div>
      <div class="modal-body"><div class="ff" style="margin-bottom:12px"><label>Motivo</label><select class="input" id="m-mot">${cfgActivos('motivos').map(m=>`<option>${h(m.nombre)}</option>`).join('')}</select></div>
      <div class="ff"><label>Nota</label><textarea class="input" id="m-nota" placeholder="Detalle (opcional)"></textarea></div>
      ${c.cotizacion?`<div class="alert info" style="margin-top:12px">${icon('info')}<div>La cotización ${h(c.cotizacion.folio)} quedará marcada en el CRM como "${st.toLowerCase()} en quirófano" para que no pase sola a Realizado.</div></div>`:''}</div>
      <div class="modal-foot"><button class="btn" data-close>Volver</button><button class="btn btn-danger" id="m-ok">${st==='Cancelada'?'Cancelar cirugía':'Suspender cirugía'}</button></div>`);
    $('#m-ok', ov).onclick = ()=> aplicar({motivoCancelacion: $('#m-mot', ov).value, notaCancelacion: $('#m-nota', ov).value.trim()});
    return;
  }
  if(st==='Realizada'){
    const ov = openModal(`<div class="modal-head"><h2>Cirugía realizada · ${h(c.id)}</h2><button class="x-btn" data-close>${icon('x')}</button></div>
      <div class="modal-body"><p class="muted" style="font-size:13px; margin-bottom:12px">Registra las horas reales de quirófano (entrada y salida de sala). Sirven para medir tiempos reales contra lo programado y para el costeo de la hora quirúrgica.</p>
      <div class="fr" style="grid-template-columns:1fr 1fr"><div class="ff"><label>Entrada a sala</label><input class="input" type="time" id="m-ri" value="${h(c.horaRealInicio||c.horaInicio)}"></div><div class="ff"><label>Salida de sala</label><input class="input" type="time" id="m-rf" value="${h(c.horaRealFin||fromMin(toMin(c.horaInicio)+(c.duracionMin||0)).slice(0,5))}"></div></div>
      <div class="faint" style="font-size:12px; margin-top:8px">Programado: ${h(c.horaInicio)}–${h(finTxt(c))} (${durTxt(c.duracionMin)})</div></div>
      <div class="modal-foot"><button class="btn" data-close>Volver</button><button class="btn btn-primary" id="m-ok">${icon('check')} Guardar</button></div>`);
    $('#m-ok', ov).onclick = ()=> aplicar({horaRealInicio: $('#m-ri', ov).value, horaRealFin: $('#m-rf', ov).value});
    return;
  }
  if(st==='Tentativa'){ aplicar({motivoCancelacion:'', notaCancelacion:''}); return; }
  if(st==='Confirmada'){
    const errs = conflictos(Object.assign({}, c, {estatus:'Confirmada'})).filter(x=>x.nivel==='err');
    if(errs.length){ confirmar('Confirmar con conflictos', errs.map(x=>`<div class="alert err" style="margin-bottom:6px">${icon('alert')}<div><b>${h(x.tipo)}:</b> ${h(x.msg)}</div></div>`).join('')+'<p style="margin-top:8px">¿Confirmar de todos modos?</p>', 'Confirmar', ()=>aplicar(), true); return; }
  }
  if(st==='En quirófano' && !c.horaRealInicio){ const n = new Date(); aplicar({horaRealInicio: pad(n.getHours())+':'+pad(n.getMinutes())}); return; }
  aplicar();
}

/* ---------- IMPRESIÓN ---------- */
function imprimirHTML(html){ $('#print-area').innerHTML = html; setTimeout(()=>{ window.print(); }, 60); }
function filaPrograma(c){
  const edad = c.paciente.fnac ? edadTxt(c.paciente.fnac, c.fecha) : '';
  return `<tr><td><b>${h(c.horaInicio)}–${h(finTxt(c))}</b><br>${h(durTxt(c.duracionMin))}</td><td>${h(salaNombre(c.salaId))}</td>
    <td><b>${h(c.paciente.nombre)}</b><br>${h([edad, c.paciente.sexo, c.paciente.expediente?'Exp. '+c.paciente.expediente:''].filter(Boolean).join(' · '))}${c.paciente.alergias?'<br>Alergias: '+h(c.paciente.alergias):''}</td>
    <td><b>${h(c.procedimiento)}</b>${c.lateralidad&&c.lateralidad!=='No aplica'?' ('+h(c.lateralidad)+')':''}${c.diagnostico?'<br>Dx: '+h(c.diagnostico):''}</td>
    <td>${h(c.cirujanoNombre)}${c.ayudantes?'<br>Ayud.: '+h(c.ayudantes):''}</td>
    <td>${h(c.anestesiologoNombre||'—')}<br>${h(cfgNombre('tiposAnestesia', c.tipoAnestesiaId))}${c.paciente.asa?' · '+h(c.paciente.asa):''}</td>
    <td>${h(c.tipoEstancia)}${c.tipoEstancia==='Hospitalización'?'<br>'+h((c.diasEstancia||'?')+' d · '+cfgNombre('habitaciones', c.habitacionId))+(c.uciPostop?' · UCI':''):''}</td>
    <td>${h(nombres('equipos', c.equipos).join(', '))}${(c.proveedores||[]).length?'<br>'+provTxt(c).map(h).join('<br>'):''}</td>
    <td>${h(c.tipoAtencion==='Aseguradora'?cfgNombre('aseguradoras', c.aseguradoraId)+' ('+c.autorizacion+')':c.tipoAtencion==='Convenio / financiamiento'?cfgNombre('convenios', c.convenioId):'Particular')}</td>
    <td>${h(c.estatus)}</td></tr>`;
}
function imprimirPrograma(desde, hasta){
  const lst = S.cirugias.filter(c=>c.fecha>=desde && c.fecha<=hasta && OCUPAN.includes(c.estatus)).sort((a,b)=> a.fecha.localeCompare(b.fecha) || (toMin(a.horaInicio)-toMin(b.horaInicio)) || salaNombre(a.salaId).localeCompare(salaNombre(b.salaId)));
  if(!lst.length){ toast('No hay cirugías en ese periodo'); return; }
  const head = `<tr><th>Horario</th><th>Sala</th><th>Paciente</th><th>Procedimiento</th><th>Cirujano</th><th>Anestesia</th><th>Estancia</th><th>Equipo / proveedor</th><th>Atención</th><th>Estatus</th></tr>`;
  let html = `<h1>Programa quirúrgico · Hospital Noor</h1><div class="ps">${desde===hasta?h(fmtFL(desde)):h(fmtFL(desde))+' al '+h(fmtFL(hasta))} · Impreso ${new Date().toLocaleString('es-MX',{dateStyle:'medium', timeStyle:'short'})}</div>`;
  const dias = [...new Set(lst.map(c=>c.fecha))];
  dias.forEach(f=>{ html += `<h2>${h(fmtFL(f))} — ${lst.filter(c=>c.fecha===f).length} cirugía(s)</h2><table>${head}${lst.filter(c=>c.fecha===f).map(filaPrograma).join('')}</table>`; });
  imprimirHTML(html);
}
function imprimirHoja(c){
  const r = (k, v)=> `<tr><td class="k">${k}</td><td>${v||'—'}</td></tr>`;
  const edad = c.paciente.fnac ? edadTxt(c.paciente.fnac, c.fecha) : '';
  imprimirHTML(`<h1>Solicitud de programación quirúrgica · ${h(c.id)}</h1><div class="ps">Hospital Noor · ${h(c.estatus)}${c.cotizacion?' · Cotización '+h(c.cotizacion.folio):''} · Impreso ${new Date().toLocaleString('es-MX',{dateStyle:'medium', timeStyle:'short'})}</div>
    <table class="sheet">
      ${r('Fecha y horario', h(fmtFL(c.fecha))+' · '+h(c.horaInicio)+'–'+h(finTxt(c))+' ('+h(durTxt(c.duracionMin))+') · '+h(salaNombre(c.salaId))+' · '+h(c.prioridad))}
      ${r('Paciente', '<b>'+h(c.paciente.nombre)+'</b> · '+h([edad, c.paciente.sexo, c.paciente.fnac?'nac. '+fmtF(c.paciente.fnac):'', c.paciente.expediente?'Exp. '+c.paciente.expediente:''].filter(Boolean).join(' · ')))}
      ${r('Contacto', h([c.paciente.telefono, c.paciente.correo, c.paciente.responsable?'Resp.: '+c.paciente.responsable+' '+(c.paciente.responsableTel||''):''].filter(Boolean).join(' · ')))}
      ${r('Datos clínicos', h([c.paciente.peso?c.paciente.peso+' kg':'', c.paciente.talla?c.paciente.talla+' cm':'', c.paciente.asa, c.paciente.alergias?'Alergias: '+c.paciente.alergias:'Alergias: no registradas', c.paciente.comorbilidades].filter(Boolean).join(' · ')))}
      ${r('Procedimiento', '<b>'+h(c.procedimiento)+'</b>'+(c.lateralidad!=='No aplica'?' · Lateralidad: <b>'+h(c.lateralidad)+'</b>':'')+(c.diagnostico?'<br>Dx: '+h(c.diagnostico):''))}
      ${r('Cirujano', h(c.cirujanoNombre)+(c.cirujanoEsp?' · '+h(c.cirujanoEsp):'')+(c.ayudantes?'<br>Ayudante(s): '+h(c.ayudantes):''))}
      ${r('Anestesia', h(c.anestesiologoNombre||'Sin asignar')+' · '+h(cfgNombre('tiposAnestesia', c.tipoAnestesiaId)||'tipo sin definir'))}
      ${r('Personal', h(['Instrumentista: '+(cfgNombre('personal', c.instrumentistaId)||'—'), 'Circulante: '+(cfgNombre('personal', c.circulanteId)||'—')].join(' · ')))}
      ${r('Estancia', h(c.tipoEstancia)+(c.tipoEstancia==='Hospitalización'?' · '+h((c.diasEstancia||'?')+' día(s) · '+cfgNombre('habitaciones', c.habitacionId))+(c.uciPostop?' · UCI postquirúrgica':'')+' · Alta estimada: '+altaTxt(c):'')+(c.ingresoHora||c.ingresoFecha?'<br>Ingreso: '+h([c.ingresoFecha?fmtF(c.ingresoFecha):fmtF(c.fecha), c.ingresoHora].filter(Boolean).join(' ')):''))}
      ${r('Atención', h(c.tipoAtencion)+(c.tipoAtencion==='Aseguradora'?' · '+h(cfgNombre('aseguradoras', c.aseguradoraId))+' · Póliza '+h(c.poliza||'—')+' · Siniestro '+h(c.siniestro||'—')+' · Autorización: '+h(c.autorizacion):'')+(c.tipoAtencion==='Convenio / financiamiento'?' · '+h(cfgNombre('convenios', c.convenioId)):'')+(c.montoCotizado?' · Cotizado '+money(c.montoCotizado):'')+(c.anticipo?' · Anticipo '+money(c.anticipo):''))}
      ${r('Equipo especial', h(nombres('equipos', c.equipos).join(', ')))}
      ${r('Proveedores', provTxt(c).map(h).join('<br>')+(c.notaProveedores?'<br>'+h(c.notaProveedores):''))}
      ${r('Laboratorio', h(nombres('laboratorio', c.laboratorio).join(', '))+(c.notaLab?'<br>'+h(c.notaLab):''))}
      ${r('Imagenología', h(nombres('imagenologia', c.imagenologia).join(', '))+(c.notaImagen?'<br>'+h(c.notaImagen):''))}
      ${r('Servicios de apoyo', h(nombres('servicios', c.servicios).join(', '))+(c.hemoderivados?'<br>'+h(c.hemoderivados):''))}
      ${r('Checklist', checklistAplicable(c).map(it=>(c.checklist[it.id]?'☑ ':'☐ ')+h(it.nombre)).join('<br>'))}
      ${r('Notas', h(c.notas).replace(/\n/g,'<br>')+(c.notasEnfermeria?'<br><b>Enfermería:</b> '+h(c.notasEnfermeria).replace(/\n/g,'<br>'):''))}
    </table>
    <div class="sig"><div>Cirujano</div><div>Anestesiólogo</div><div>Jefatura de quirófano</div></div>`);
}
</script>
<script>
/* =====================================================================
   POR PROGRAMAR · REQUERIMIENTOS · LISTA
   ===================================================================== */
function renderPorProgramar(){
  const pend = porProgramar().sort((a,b)=> String(a.fecha_programacion||'9').localeCompare(String(b.fecha_programacion||'9')));
  const ligadas = S.cirugias.filter(c=>c.cotizacion).sort((a,b)=> b.fecha.localeCompare(a.fecha)).slice(0,40);
  const sinCRM = !CRM.generado;
  $('#main').innerHTML = `<div class="topbar"><div><h1>Por programar</h1><div class="sub">Cotizaciones del CRM en estatus ${CRM_POR_PROGRAMAR.map(x=>'"'+x+'"').join(', ')} que aún no tienen lugar en la agenda</div></div></div>
    ${sinCRM ? `<div class="card empty">${icon('link')}<br><b>Todavía no hay datos del CRM en este navegador.</b><br>${GAS?'En el CRM Médicos ve a Configuración → Programación de quirófano → "Descargar datos para Programación" e importa ese archivo en':'Abre el CRM Médicos (v2.34.0 o posterior) en este mismo navegador y sitio, o importa su archivo en'} <a href="#" onclick="go('datos');return false;">Conexión y respaldos</a>.</div>` : `
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Folio</th><th>Médico</th><th>Procedimiento</th><th>Tipo</th><th>Atención</th><th>Estatus CRM</th><th>Fecha propuesta</th><th>Monto</th><th></th></tr></thead><tbody>
    ${pend.length ? pend.map((q,i)=>`<tr><td class="mono">${h(q.folio)}</td><td><b>${h(q.medico_nombre||'')}</b><br><span class="faint">${h(q.especialidad||'')}</span></td><td>${h(q.procedimiento||'')}${q.lista_nombre?`<br><span class="faint">${h(q.lista_nombre)}</span>`:''}</td><td>${h(q.tipo_procedimiento||'—')}</td><td>${q.tipo==='aseguradora'?h(q.aseguradora||'Aseguradora'):'Particular'}</td><td>${h(q.estatus)}${(()=>{ const cx = S.cirugias.filter(c=>c.cotizacion && c.cotizacion.folio===q.folio && (c.cotizacion.tipo||'particular')===(q.tipo||'particular') && c.estatus==='Cancelada').pop(); return cx ? `<br><span class="pill p-red" style="margin-top:4px">Cancelada en quirófano (${h(cx.id)})</span><br><span class="faint" style="font-size:11px">${h(cx.motivoCancelacion||'')} · si ya no se hará, cámbiala en el CRM</span>` : ''; })()}</td><td>${q.fecha_programacion?h(fmtF(q.fecha_programacion)):'<span class="faint">sin fecha</span>'}</td><td>${money(q.monto)}</td><td><button class="btn btn-primary btn-sm ro-hide" data-prog="${i}">${icon('cal')} Programar</button></td></tr>`).join('') : `<tr><td colspan="9" class="empty">No hay cotizaciones confirmadas pendientes de programar. ${icon('check')}</td></tr>`}
    </tbody></table></div>`}
    <div class="section-title">${icon('link')} Cirugías ligadas a cotizaciones</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Programación</th><th>Folio CRM</th><th>Fecha</th><th>Sala</th><th>Paciente</th><th>Procedimiento</th><th>Estatus</th></tr></thead><tbody>
    ${ligadas.length ? ligadas.map(c=>`<tr class="click" data-ev="${c.id}"><td class="mono">${h(c.id)}</td><td class="mono">${h(c.cotizacion.folio)}</td><td>${h(fmtF(c.fecha))} ${h(c.horaInicio)}</td><td>${h(salaNombre(c.salaId))}</td><td>${h(c.paciente.nombre)}</td><td>${h(c.procedimiento)}</td><td>${stPill(c.estatus)}</td></tr>`).join('') : `<tr><td colspan="7" class="empty">Aún no hay cirugías ligadas.</td></tr>`}
    </tbody></table></div>`;
  $$('[data-prog]').forEach(b=> b.onclick = ()=>{ const q = pend[Number(b.dataset.prog)]; const f = q.fecha_programacion ? String(q.fecha_programacion).slice(0,10) : (UI.fecha<todayYMD()?todayYMD():UI.fecha); abrirForm(null, {fecha: f < todayYMD() ? todayYMD() : f, cotizacionObj: q}); });
  $$('[data-ev]').forEach(r=> r.onclick = ()=> abrirDetalle(r.dataset.ev));
}

/* ---------- REQUERIMIENTOS POR DEPARTAMENTO ---------- */
function lineaCorta(c){ const e = c.paciente.fnac ? ' ('+edadTxt(c.paciente.fnac, c.fecha)+')' : ''; return `${fmtFC(c.fecha)} ${c.horaInicio} · ${salaNombre(c.salaId)} · ${c.paciente.nombre}${e} · ${c.procedimiento} · ${c.cirujanoNombre}`; }
function renderRequerimientos(){
  if(!UI.reqDesde){ UI.reqDesde = todayYMD(); UI.reqHasta = addDays(todayYMD(), 6); }
  const lst = S.cirugias.filter(c=> c.fecha>=UI.reqDesde && c.fecha<=UI.reqHasta && ABIERTAS.includes(c.estatus)).sort((a,b)=> a.fecha.localeCompare(b.fecha) || toMin(a.horaInicio)-toMin(b.horaInicio));
  const deptos = [];
  const add = (titulo, ic, items, txt)=> deptos.push({titulo, ic, items, txt});
  // Quirófano / enfermería
  add('Quirófano y enfermería', 'scalpel', lst.map(c=>({c, d:[ (c.equipos||[]).filter(id=>{ const e = cfgItem('equipos', id); return e && e.departamento!=='Imagenología'; }).map(id=>cfgNombre('equipos', id)).join(', '), c.lateralidad!=='No aplica'?'Lateralidad: '+c.lateralidad:'', c.instrumentistaId?'Instrumentista: '+cfgNombre('personal', c.instrumentistaId):'Sin instrumentista', c.notasEnfermeria ].filter(Boolean).join(' · ')})));
  // Anestesiología
  add('Anestesiología', 'doctor', lst.map(c=>({c, d:[ c.anestesiologoNombre||'⚠ SIN ANESTESIÓLOGO', cfgNombre('tiposAnestesia', c.tipoAnestesiaId)||'tipo de anestesia sin definir', c.paciente.asa, c.paciente.peso?c.paciente.peso+' kg':'', c.paciente.alergias?'Alergias: '+c.paciente.alergias:'', c.paciente.comorbilidades ].filter(Boolean).join(' · ')})));
  // Imagenología
  add('Imagenología', 'cal', lst.filter(c=> (c.imagenologia||[]).length || (c.equipos||[]).some(id=>(cfgItem('equipos', id)||{}).departamento==='Imagenología')).map(c=>({c, d:[ (c.equipos||[]).filter(id=>(cfgItem('equipos', id)||{}).departamento==='Imagenología').map(id=>cfgNombre('equipos', id)).join(', '), nombres('imagenologia', c.imagenologia).join(', '), c.notaImagen ].filter(Boolean).join(' · ')})));
  // Laboratorio
  add('Laboratorio', 'box', lst.filter(c=>(c.laboratorio||[]).length).map(c=>({c, d:[nombres('laboratorio', c.laboratorio).join(', '), c.notaLab].filter(Boolean).join(' · ')})));
  // Proveedores (uno por proveedor)
  const provs = {};
  lst.forEach(c=> (c.proveedores||[]).forEach(p=>{ const k = p.provId||'_'; (provs[k] = provs[k]||[]).push({c, d:(p.material||'material sin especificar')+(p.confirmado?' · ✓ confirmado':' · ⚠ SIN CONFIRMAR')+(c.notaProveedores?' · '+c.notaProveedores:'')}); }));
  Object.entries(provs).forEach(([k, items])=>{ const pv = cfgItem('proveedores', k); add('Proveedor: '+(pv?pv.nombre:'(sin elegir)'), 'box', items, pv?[pv.contacto, pv.telefono].filter(Boolean).join(' · '):''); });
  // Servicios de apoyo por departamento
  const servs = {};
  lst.forEach(c=> (c.servicios||[]).forEach(id=>{ const s = cfgItem('servicios', id); if(!s) return; const k = s.departamento||s.nombre; (servs[k] = servs[k]||[]).push({c, d:s.nombre+(/sangre/i.test(s.nombre)&&c.hemoderivados?' · '+c.hemoderivados:'')}); }));
  lst.filter(c=>c.uciPostop && !(c.servicios||[]).some(id=>/uci|intensiva/i.test(cfgNombre('servicios', id)))).forEach(c=> (servs['Terapia intensiva'] = servs['Terapia intensiva']||[]).push({c, d:'UCI postquirúrgica'}));
  Object.entries(servs).forEach(([k, items])=> add(k, 'dept', items));
  // Admisión / hospitalización
  add('Admisión y hospitalización', 'dept', lst.filter(c=>c.tipoEstancia==='Hospitalización').map(c=>({c, d:[ 'Ingreso: '+fmtFC(c.ingresoFecha||c.fecha)+(c.ingresoHora?' '+c.ingresoHora:''), (c.diasEstancia||'?')+' día(s)', cfgNombre('habitaciones', c.habitacionId)||'habitación sin definir', 'Alta est.: '+altaTxt(c).replace(/<[^>]+>/g,''), c.uciPostop?'UCI':'' ].filter(Boolean).join(' · ')})));
  // Caja / facturación
  add('Caja y facturación', 'list', lst.map(c=>({c, d:[ c.tipoAtencion==='Aseguradora' ? (cfgNombre('aseguradoras', c.aseguradoraId)||'Aseguradora')+' · autorización '+c.autorizacion+(c.siniestro?' · '+c.siniestro:'') : c.tipoAtencion==='Convenio / financiamiento' ? cfgNombre('convenios', c.convenioId)||'Convenio' : 'Particular', c.montoCotizado?'Cotizado '+money(c.montoCotizado):'', c.anticipo?'Anticipo '+money(c.anticipo):'', c.cotizacion?'Cot. '+c.cotizacion.folio:'' ].filter(Boolean).join(' · ')})));

  $('#main').innerHTML = `<div class="topbar"><div><h1>Requerimientos por área</h1><div class="sub">Lo que cada departamento necesita saber de las cirugías abiertas del periodo</div></div><div class="grow"></div><button class="btn" id="rq-print">${icon('print')} Imprimir</button></div>
    <div class="toolbar"><div class="seg" id="rq-q"><button data-q="hoy">Hoy</button><button data-q="man">Mañana</button><button data-q="sem">7 días</button><button data-q="sig">Semana siguiente</button></div>
    <label class="muted" style="font-size:12px">Desde</label><input type="date" class="input" id="rq-d" value="${UI.reqDesde}" style="width:auto"><label class="muted" style="font-size:12px">Hasta</label><input type="date" class="input" id="rq-h" value="${UI.reqHasta}" style="width:auto"><span class="pill p-blue">${lst.length} cirugía(s)</span></div>
    ${lst.length ? `<div class="dept-grid">${deptos.map((d,i)=>`<div class="card dept"><h3>${icon(d.ic)} ${h(d.titulo)} <span class="pill ${d.items.length?'p-blue':'p-muted'} cnt">${d.items.length}</span></h3>${d.txt?`<div class="faint" style="font-size:12px; margin:-4px 0 8px">${h(d.txt)}</div>`:''}
      ${d.items.length ? `<ul>${d.items.map(it=>`<li data-ev="${it.c.id}" style="cursor:pointer"><b>${h(fmtFC(it.c.fecha))} ${h(it.c.horaInicio)}</b> · ${h(salaNombre(it.c.salaId))} · ${h(it.c.paciente.nombre)}${it.c.paciente.fnac?' ('+h(edadTxt(it.c.paciente.fnac, it.c.fecha))+')':''}<br>${h(it.c.procedimiento)} · <span class="muted">${h(it.c.cirujanoNombre)}</span>${it.d?`<br><span style="color:${/⚠/.test(it.d)?'var(--amber)':'var(--text-muted)'}">${h(it.d)}</span>`:''}</li>`).join('')}</ul>
      <div class="row" style="margin-top:10px"><button class="btn btn-sm" data-copy="${i}">${icon('wa')} Copiar mensaje</button></div>` : `<div class="faint" style="font-size:12.5px">Sin requerimientos en el periodo.</div>`}</div>`).join('')}</div>` : `<div class="card empty">No hay cirugías abiertas (tentativas, confirmadas o en sala) en el periodo.</div>`}`;
  const setR = (a,b)=>{ UI.reqDesde = a; UI.reqHasta = b; renderRequerimientos(); };
  $$('#rq-q button').forEach(b=> b.onclick = ()=>{ const t = todayYMD(); const q = b.dataset.q; if(q==='hoy') setR(t,t); if(q==='man') setR(addDays(t,1), addDays(t,1)); if(q==='sem') setR(t, addDays(t,6)); if(q==='sig'){ const a = addDays(startOfWeek(t),7); setR(a, addDays(a,6)); } });
  $('#rq-d').onchange = e=>{ UI.reqDesde = e.target.value; if(UI.reqHasta < UI.reqDesde) UI.reqHasta = UI.reqDesde; renderRequerimientos(); };
  $('#rq-h').onchange = e=>{ UI.reqHasta = e.target.value; if(UI.reqHasta < UI.reqDesde) UI.reqDesde = UI.reqHasta; renderRequerimientos(); };
  $$('[data-ev]').forEach(r=> r.onclick = ()=> abrirDetalle(r.dataset.ev));
  $$('[data-copy]').forEach(b=> b.onclick = ()=>{ const d = deptos[Number(b.dataset.copy)]; const per = UI.reqDesde===UI.reqHasta ? fmtFL(UI.reqDesde) : fmtF(UI.reqDesde)+' al '+fmtF(UI.reqHasta);
    copyText(`*Hospital Noor · Programación quirúrgica*\n*${d.titulo}* — ${per}\n\n`+d.items.map((it,i)=>`${i+1}. ${lineaCorta(it.c)}${it.d?'\n   → '+it.d:''}`).join('\n')+`\n\nFavor de confirmar de enterado. Gracias.`); });
  $('#rq-print').onclick = ()=>{ if(!lst.length){ toast('Nada que imprimir'); return; } imprimirHTML(`<h1>Requerimientos por área · Hospital Noor</h1><div class="ps">${h(fmtFL(UI.reqDesde))}${UI.reqDesde!==UI.reqHasta?' al '+h(fmtFL(UI.reqHasta)):''}</div>`+deptos.filter(d=>d.items.length).map(d=>`<h2>${h(d.titulo)}</h2><table><tr><th>Fecha / hora</th><th>Sala</th><th>Paciente</th><th>Procedimiento</th><th>Cirujano</th><th>Requerimiento</th></tr>${d.items.map(it=>`<tr><td>${h(fmtFC(it.c.fecha))} ${h(it.c.horaInicio)}</td><td>${h(salaNombre(it.c.salaId))}</td><td>${h(it.c.paciente.nombre)}${it.c.paciente.fnac?' ('+h(edadTxt(it.c.paciente.fnac,it.c.fecha))+')':''}</td><td>${h(it.c.procedimiento)}</td><td>${h(it.c.cirujanoNombre)}</td><td>${h(it.d)}</td></tr>`).join('')}</table>`).join('')); };
}

/* ---------- LISTA ---------- */
function filtrarLista(){
  const q = norm(UI.listaQ).split(/\s+/).filter(Boolean);
  return S.cirugias.filter(c=>{
    if(UI.listaDesde && c.fecha < UI.listaDesde) return false;
    if(UI.listaHasta && c.fecha > UI.listaHasta) return false;
    if(UI.listaEst && c.estatus!==UI.listaEst) return false;
    if(UI.filtroSala && c.salaId!==UI.filtroSala) return false;
    if(q.length){ const t = norm([c.id, c.procedimiento, c.diagnostico, c.paciente.nombre, c.cirujanoNombre, c.anestesiologoNombre, c.cotizacion&&c.cotizacion.folio, salaNombre(c.salaId), cfgNombre('aseguradoras', c.aseguradoraId)].join(' ')); if(!q.every(x=>t.includes(x))) return false; }
    return true;
  }).sort((a,b)=> b.fecha.localeCompare(a.fecha) || toMin(a.horaInicio)-toMin(b.horaInicio));
}
function renderLista(){
  const lst = filtrarLista();
  $('#main').innerHTML = `<div class="topbar"><div><h1>Lista de cirugías</h1><div class="sub">${S.cirugias.length} programaciones registradas</div></div><div class="grow"></div><button class="btn" id="l-csv">${icon('download')} Exportar CSV (Excel)</button><button class="btn btn-primary ro-hide" id="l-new">${icon('plus')} Programar cirugía</button></div>
    <div class="toolbar"><input class="input" id="l-q" placeholder="Buscar paciente, médico, procedimiento, folio…" value="${h(UI.listaQ)}" style="max-width:340px">
      <label class="muted" style="font-size:12px">Desde</label><input type="date" class="input" id="l-d" value="${UI.listaDesde}" style="width:auto"><label class="muted" style="font-size:12px">Hasta</label><input type="date" class="input" id="l-h" value="${UI.listaHasta}" style="width:auto">
      <select class="input" id="l-e"><option value="">Todos los estatus</option>${Object.keys(ESTATUS).map(e=>`<option ${UI.listaEst===e?'selected':''}>${e}</option>`).join('')}</select>
      <select class="input" id="l-s"><option value="">Todas las salas</option>${cfgList('salas').map(s=>`<option value="${s.id}" ${UI.filtroSala===s.id?'selected':''}>${h(s.nombre)}</option>`).join('')}</select>
      <span class="pill p-blue">${lst.length} resultado(s)</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Folio</th><th>Fecha</th><th>Horario</th><th>Sala</th><th>Paciente</th><th>Edad</th><th>Procedimiento</th><th>Cirujano</th><th>Anestesiólogo</th><th>Estancia</th><th>Atención</th><th>Pendientes</th><th>Estatus</th></tr></thead><tbody>
    ${lst.length ? lst.map(c=>{ const p = ABIERTAS.includes(c.estatus) ? pendientes(c).length : 0; return `<tr class="click" data-ev="${c.id}"><td class="mono">${h(c.id)}${c.cotizacion?'<br><span class="faint">'+h(c.cotizacion.folio)+'</span>':''}</td><td style="white-space:nowrap">${h(fmtFC(c.fecha))}</td><td class="mono" style="white-space:nowrap">${h(c.horaInicio)}–${h(finTxt(c))}</td><td><span class="dot" style="background:${salaColor(c.salaId)}"></span> ${h(salaNombre(c.salaId))}</td><td>${h(c.paciente.nombre)}</td><td>${h(edadTxt(c.paciente.fnac, c.fecha))}</td><td>${h(c.procedimiento)}</td><td>${h(c.cirujanoNombre)}</td><td>${h(c.anestesiologoNombre)}</td><td>${h(c.tipoEstancia)}${c.tipoEstancia==='Hospitalización'&&c.diasEstancia?' ('+h(c.diasEstancia)+'d)':''}</td><td>${h(c.tipoAtencion==='Aseguradora'?cfgNombre('aseguradoras', c.aseguradoraId):c.tipoAtencion)}</td><td>${ABIERTAS.includes(c.estatus)?(p?`<span class="pill p-amber">${p}</span>`:'<span class="pill p-green">Lista</span>'):''}</td><td>${stPill(c.estatus)}</td></tr>`; }).join('') : `<tr><td colspan="13" class="empty">Sin resultados.</td></tr>`}
    </tbody></table></div>`;
  let t; $('#l-q').oninput = e=>{ clearTimeout(t); t = setTimeout(()=>{ UI.listaQ = e.target.value; renderLista(); const i = $('#l-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('#l-d').onchange = e=>{ UI.listaDesde = e.target.value; renderLista(); };
  $('#l-h').onchange = e=>{ UI.listaHasta = e.target.value; renderLista(); };
  $('#l-e').onchange = e=>{ UI.listaEst = e.target.value; renderLista(); };
  $('#l-s').onchange = e=>{ UI.filtroSala = e.target.value; saveUI(); renderLista(); };
  $('#l-new').onclick = ()=> abrirForm(null, {fecha: todayYMD()});
  $('#l-csv').onclick = ()=> exportarCSV(lst);
  $$('[data-ev]').forEach(r=> r.onclick = ()=> abrirDetalle(r.dataset.ev));
}
function exportarCSV(lst){
  if(!lst.length){ toast('No hay registros para exportar'); return; }
  const cols = [
    ['Folio', c=>c.id], ['Cotización CRM', c=>c.cotizacion?c.cotizacion.folio:''], ['Estatus', c=>c.estatus], ['Prioridad', c=>c.prioridad],
    ['Fecha', c=>c.fecha], ['Hora inicio', c=>c.horaInicio], ['Hora fin', c=>finTxt(c)], ['Horas quirófano', c=>((c.duracionMin||0)/60).toFixed(2)], ['Sala', c=>salaNombre(c.salaId)],
    ['Hora real entrada', c=>c.horaRealInicio], ['Hora real salida', c=>c.horaRealFin],
    ['Paciente', c=>c.paciente.nombre], ['Fecha nacimiento', c=>c.paciente.fnac], ['Edad', c=>edadTxt(c.paciente.fnac, c.fecha)], ['Sexo', c=>c.paciente.sexo], ['Teléfono', c=>c.paciente.telefono], ['Expediente', c=>c.paciente.expediente], ['ASA', c=>c.paciente.asa], ['Alergias', c=>c.paciente.alergias],
    ['Procedimiento', c=>c.procedimiento], ['Diagnóstico', c=>c.diagnostico], ['Lateralidad', c=>c.lateralidad],
    ['Cirujano', c=>c.cirujanoNombre], ['Especialidad', c=>c.cirujanoEsp], ['Ayudantes', c=>c.ayudantes], ['Anestesiólogo', c=>c.anestesiologoNombre], ['Tipo de anestesia', c=>cfgNombre('tiposAnestesia', c.tipoAnestesiaId)],
    ['Instrumentista', c=>cfgNombre('personal', c.instrumentistaId)], ['Circulante', c=>cfgNombre('personal', c.circulanteId)],
    ['Tipo', c=>c.tipoEstancia], ['Días estancia', c=>c.diasEstancia], ['Habitación', c=>cfgNombre('habitaciones', c.habitacionId)], ['UCI', c=>c.uciPostop?'Sí':''],
    ['Atención', c=>c.tipoAtencion], ['Aseguradora', c=>cfgNombre('aseguradoras', c.aseguradoraId)], ['Póliza', c=>c.poliza], ['Siniestro', c=>c.siniestro], ['Autorización', c=>c.tipoAtencion==='Aseguradora'?c.autorizacion:''], ['Convenio', c=>cfgNombre('convenios', c.convenioId)],
    ['Monto cotizado', c=>c.montoCotizado], ['Anticipo', c=>c.anticipo],
    ['Equipo especial', c=>nombres('equipos', c.equipos).join('; ')], ['Proveedores', c=>provTxt(c).join('; ')], ['Laboratorio', c=>nombres('laboratorio', c.laboratorio).join('; ')], ['Imagenología', c=>nombres('imagenologia', c.imagenologia).join('; ')], ['Servicios', c=>nombres('servicios', c.servicios).join('; ')],
    ['Pendientes', c=>ABIERTAS.includes(c.estatus)?pendientes(c).join('; '):''], ['Motivo cancelación/suspensión', c=>c.motivoCancelacion], ['Notas', c=>c.notas]
  ];
  const esc = v=>{ const s = String(v==null?'':v); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = '﻿'+cols.map(c=>esc(c[0])).join(',')+'\n'+lst.map(c=>cols.map(col=>esc(col[1](c))).join(',')).join('\n');
  download('programacion-quirofano-noor-'+todayYMD()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV descargado ('+lst.length+' registros)');
}
</script>
<script>
/* =====================================================================
   CONFIGURACIÓN DE CATÁLOGOS
   ===================================================================== */
const CFG_DEFS = {
  horario:      {t:'Horario y tiempos', d:'Horario quirúrgico, tiempo de limpieza entre cirugías y duración sugerida.'},
  salas:        {t:'Salas de quirófano', d:'Tus quirófanos. El color identifica a cada sala en la agenda. Desactiva una sala para dejar de programar en ella sin perder su historial.', f:[{k:'nombre',l:'Nombre'},{k:'color',l:'Color',type:'color'},{k:'notas',l:'Notas (equipamiento fijo, uso preferente…)'}], ref:c=>[c.salaId]},
  equipos:      {t:'Equipo especial', d:'Equipos que se reservan por cirugía (arco en C, torres, ultrasonido…). La cantidad sirve para avisar si dos cirugías a la misma hora necesitan el mismo equipo. El departamento define a quién le llega el requerimiento.', f:[{k:'nombre',l:'Equipo'},{k:'cantidad',l:'Cantidad',type:'number',w:90},{k:'departamento',l:'Departamento',type:'select',opts:()=>DEPTOS_EQUIPO}], ref:c=>c.equipos||[]},
  proveedores:  {t:'Proveedores', d:'Casas de ortopedia, implantes, renta de equipo, material de laparoscopía, etc.', f:[{k:'nombre',l:'Proveedor'},{k:'giro',l:'Giro',type:'select',opts:()=>S.config.girosProveedor},{k:'contacto',l:'Contacto'},{k:'telefono',l:'Teléfono'},{k:'correo',l:'Correo'}], ref:c=>(c.proveedores||[]).map(p=>p.provId)},
  tiposAnestesia:{t:'Tipos de anestesia', d:'Opciones del campo "Tipo de anestesia".', f:[{k:'nombre',l:'Tipo de anestesia'}], ref:c=>[c.tipoAnestesiaId]},
  aseguradoras: {t:'Aseguradoras', d:'Aseguradoras con las que se programan cirugías. Si una cotización del CRM trae una aseguradora nueva, se agrega sola.', f:[{k:'nombre',l:'Aseguradora'}], ref:c=>[c.aseguradoraId]},
  convenios:    {t:'Convenios y financieras', d:'Convenios o empresas de financiamiento al paciente.', f:[{k:'nombre',l:'Convenio / financiera'}], ref:c=>[c.convenioId]},
  laboratorio:  {t:'Laboratorio', d:'Estudios de laboratorio que se pueden solicitar por cirugía.', f:[{k:'nombre',l:'Estudio'}], ref:c=>c.laboratorio||[]},
  imagenologia: {t:'Imagenología', d:'Estudios de imagen pre o transoperatorios.', f:[{k:'nombre',l:'Estudio'}], ref:c=>c.imagenologia||[]},
  servicios:    {t:'Servicios de apoyo', d:'Otros departamentos que deben enterarse: banco de sangre, patología, UCI, CEyE, farmacia… El departamento agrupa los avisos en "Requerimientos por área".', f:[{k:'nombre',l:'Servicio'},{k:'departamento',l:'Departamento que lo atiende'}], ref:c=>c.servicios||[]},
  habitaciones: {t:'Tipos de habitación', d:'Para cirugías con hospitalización.', f:[{k:'nombre',l:'Tipo de habitación'}], ref:c=>[c.habitacionId]},
  personal:     {t:'Personal de quirófano', d:'Instrumentistas, circulantes y enfermería. Se avisa si una misma persona queda en dos salas a la vez.', f:[{k:'nombre',l:'Nombre'},{k:'rol',l:'Rol',type:'select',opts:()=>ROLES},{k:'telefono',l:'Teléfono'}], ref:c=>[c.instrumentistaId, c.circulanteId]},
  medicosExternos:{t:'Médicos externos', d:'Médicos que no están en el CRM (p. ej. cirujano invitado o anestesiólogo externo). Si la especialidad contiene "Anestesiología", aparecerá en la lista de anestesiólogos.', f:[{k:'nombre',l:'Nombre'},{k:'especialidad',l:'Especialidad',list:'dl-esp'},{k:'telefono',l:'Teléfono'}], ref:c=>[c.cirujanoId, c.anestesiologoId].map(x=>String(x||'').startsWith('ext:')?x.slice(4):null)},
  checklist:    {t:'Checklist prequirúrgico', d:'Requisitos para que una cirugía quede "lista". "Aplica" define cuándo se pide cada punto (p. ej. la carta de autorización solo con aseguradora).', f:[{k:'nombre',l:'Requisito'},{k:'aplica',l:'Aplica',type:'select',opts:()=>APLICA_OPC}], ref:c=>Object.keys(c.checklist||{}).filter(k=>c.checklist[k])},
  motivos:      {t:'Motivos de cancelación', d:'Opciones al cancelar o suspender una cirugía.', f:[{k:'nombre',l:'Motivo'}], ref:()=>[]}
};
function usos(k, id){ const d = CFG_DEFS[k]; if(!d || !d.ref) return 0; return S.cirugias.filter(c=> d.ref(c).includes(id)).length; }
function renderConfig(){
  const verUsuarios = GAS && puede('Administrador');
  const tab = (UI.cfgTab==='usuarios' && verUsuarios) ? 'usuarios' : (CFG_DEFS[UI.cfgTab] ? UI.cfgTab : 'salas');
  $('#main').innerHTML = `<div class="topbar"><div><h1>Configuración</h1><div class="sub">Catálogos que alimentan el formulario de programación${GAS?' · compartidos por todos los usuarios':''}</div></div></div>
    <div class="cfg-layout"><div class="cfg-nav card" style="padding:8px">${verUsuarios?`<button data-tab="usuarios" class="${tab==='usuarios'?'active':''}">${icon('user')} Usuarios y accesos</button>`:''}${Object.entries(CFG_DEFS).map(([k,d])=>`<button data-tab="${k}" class="${k===tab?'active':''}">${h(d.t)}${k==='horario'?'':`<span>${cfgActivos(k).length}</span>`}</button>`).join('')}</div>
    <div id="cfg-body"></div></div>`;
  $$('.cfg-nav button').forEach(b=> b.onclick = ()=>{ UI.cfgTab = b.dataset.tab; saveUI(); renderConfig(); });
  if(tab==='usuarios') return renderUsuarios();
  if(tab==='horario'){ renderCfgHorario(); return bloquearSiNoAdmin(); }
  const d = CFG_DEFS[tab]; const items = cfgList(tab);
  const especialidades = [...new Set((CRM.medicos||[]).map(m=>m.especialidad).filter(Boolean))].sort();
  $('#cfg-body').innerHTML = `<div class="card"><div style="font-family:var(--font-display); font-weight:700; font-size:16px">${h(d.t)}</div><div class="muted" style="font-size:12.5px; margin:4px 0 14px; line-height:1.5">${h(d.d)}</div>
    <div style="overflow-x:auto"><table class="tbl cfg-table"><thead><tr>${d.f.map(f=>`<th>${h(f.l)}</th>`).join('')}<th style="width:70px">Activo</th><th style="width:80px">En uso</th><th style="width:50px"></th></tr></thead><tbody>
    ${items.length ? items.map(it=>`<tr>${d.f.map(f=>{
      const v = it[f.k]==null?'':it[f.k];
      if(f.type==='select'){ const o = f.opts(); return `<td><select class="input" data-id="${it.id}" data-k="${f.k}"><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${h(x)}</option>`).join('')}${v && !o.includes(v)?`<option selected>${h(v)}</option>`:''}</select></td>`; }
      if(f.type==='color') return `<td><input type="color" data-id="${it.id}" data-k="${f.k}" value="${h(v||'#2660AB')}"></td>`;
      return `<td><input class="input" ${f.type==='number'?'type="number" min="1" step="1"':''} ${f.list?`list="${f.list}"`:''} data-id="${it.id}" data-k="${f.k}" value="${h(v)}" style="${f.w?'width:'+f.w+'px':''}"></td>`;
    }).join('')}<td><label class="switch"><input type="checkbox" data-id="${it.id}" data-k="activo" ${it.activo!==false?'checked':''}><span></span></label></td><td class="faint">${usos(tab, it.id)||'—'}</td><td><button class="btn btn-icon btn-danger" data-del="${it.id}" title="Eliminar">${icon('trash')}</button></td></tr>`).join('') : `<tr><td colspan="${d.f.length+3}" class="empty">Sin registros todavía.</td></tr>`}
    </tbody></table></div>
    <datalist id="dl-esp">${especialidades.map(e=>`<option value="${h(e)}">`).join('')}<option value="ANESTESIOLOGÍA"></datalist>
    <div class="row" style="margin-top:14px"><button class="btn btn-primary btn-sm" id="cfg-add">${icon('plus')} Agregar</button><button class="btn btn-sm" id="cfg-bulk">${icon('list')} Agregar varios (pegar lista)</button>
    ${tab==='proveedores'?`<button class="btn btn-sm" id="cfg-giros">${icon('edit')} Editar giros</button>`:''}</div></div>`;
  $$('#cfg-body [data-k]').forEach(el=> el.onchange = ()=>{
    const it = items.find(x=>x.id===el.dataset.id); if(!it) return;
    const k = el.dataset.k; it[k] = el.type==='checkbox' ? el.checked : (el.type==='number' ? Math.max(1, Number(el.value)||1) : el.value.trim());
    if(k==='nombre' && !it.nombre){ toast('El nombre no puede quedar vacío'); }
    guardarConfig(); if(k==='activo') renderConfig(); else toast('Guardado');
  });
  $$('#cfg-body [data-del]').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.del; const n = usos(tab, id); const it = items.find(x=>x.id===id);
    if(n){ toast('"'+(it.nombre||'')+'" se usa en '+n+' cirugía(s). Mejor desactívalo para conservar el historial.'); return; }
    confirmar('Eliminar', `¿Eliminar <b>${h(it.nombre||'(sin nombre)')}</b> del catálogo?`, 'Eliminar', ()=>{ S.config[tab] = items.filter(x=>x.id!==id); guardarConfig(); renderConfig(); }, true);
  });
  const nuevo = nombre=> Object.assign({id:uid('c'), nombre:nombre||'', activo:true}, tab==='equipos'?{cantidad:1, departamento:'Quirófano'}:{}, tab==='salas'?{color:['#2660AB','#158A4A','#6C4AB6','#B5750B','#C2291F','#0E7490','#8E1B3C'][items.length%7]}:{}, tab==='checklist'?{aplica:'Siempre'}:{}, tab==='personal'?{rol:'Instrumentista'}:{});
  $('#cfg-add').onclick = ()=>{ S.config[tab] = S.config[tab]||[]; S.config[tab].push(nuevo('')); guardarConfig(); renderConfig(); const ins = $$('#cfg-body input[data-k="nombre"]'); const last = ins[ins.length-1]; if(last) last.focus(); };
  $('#cfg-bulk').onclick = ()=>{
    const ov = openModal(`<div class="modal-head"><h2>Agregar varios · ${h(d.t)}</h2><button class="x-btn" data-close>${icon('x')}</button></div><div class="modal-body"><p class="muted" style="font-size:12.5px; margin-bottom:8px">Pega una lista, un nombre por renglón. Se omiten los que ya existen.</p><textarea class="input" id="bk-t" style="min-height:200px"></textarea></div><div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="bk-ok">Agregar</button></div>`);
    $('#bk-ok', ov).onclick = ()=>{ const ex = new Set(items.map(x=>norm(x.nombre))); let n = 0; $('#bk-t', ov).value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{ if(!ex.has(norm(x))){ ex.add(norm(x)); S.config[tab].push(nuevo(x)); n++; } }); guardarConfig(); closeTop(); renderConfig(); toast(n+' agregado(s)'); };
  };
  const gb = $('#cfg-giros'); if(gb) gb.onclick = ()=>{
    const ov = openModal(`<div class="modal-head"><h2>Giros de proveedor</h2><button class="x-btn" data-close>${icon('x')}</button></div><div class="modal-body"><p class="muted" style="font-size:12.5px; margin-bottom:8px">Uno por renglón.</p><textarea class="input" id="gr-t" style="min-height:200px">${h(S.config.girosProveedor.join('\n'))}</textarea></div><div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn btn-primary" id="gr-ok">Guardar</button></div>`);
    $('#gr-ok', ov).onclick = ()=>{ S.config.girosProveedor = $('#gr-t', ov).value.split('\n').map(x=>x.trim()).filter(Boolean); guardarConfig(); closeTop(); renderConfig(); };
  };
  bloquearSiNoAdmin();
}
function bloquearSiNoAdmin(){
  if(puede('Administrador')) return;
  const b = $('#cfg-body'); if(!b) return;
  $$('input, select, textarea, button', b).forEach(el=> el.disabled = true);
  b.insertAdjacentHTML('afterbegin', `<div class="alert info" style="margin-bottom:12px">${icon('info')}<div>Solo los administradores pueden modificar los catálogos. Puedes consultarlos.</div></div>`);
}

/* ---------- USUARIOS Y ACCESOS (modo Drive) ---------- */
async function renderUsuarios(){
  const body = $('#cfg-body');
  body.innerHTML = `<div class="card"><div class="empty"><div class="spin" style="width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--primary);animation:spin .8s linear infinite;margin:0 auto"></div><p style="margin-top:10px">Cargando usuarios…</p></div></div>`;
  let lista = [], bit = [];
  try{ lista = (await gs('api_usuarios')).usuarios || []; }catch(e){ body.innerHTML = `<div class="alert err">${icon('alert')}<div>${h(e.message||e)}</div></div>`; return; }
  try{ bit = (await gs('api_bitacora', 80)).bitacora || []; }catch(e){}
  body.innerHTML = `<div class="card"><div style="font-family:var(--font-display); font-weight:700; font-size:16px">Usuarios y accesos</div>
    <div class="muted" style="font-size:12.5px; margin:4px 0 14px; line-height:1.55">El acceso es por correo de Google (Gmail). Solo las personas de esta lista, con estatus activo, pueden entrar.<br><b>Administrador</b>: todo, incluidos catálogos y usuarios · <b>Programador</b>: programa, edita y cambia estatus · <b>Consulta</b>: solo ve la agenda, imprime y exporta.</div>
    <div class="fr" style="grid-template-columns:2fr 2fr 1fr auto; align-items:end; margin-bottom:16px; padding:12px; background:var(--surface-2); border-radius:12px">
      <div class="ff"><label>Correo de Gmail</label><input class="input" id="us-c" type="email" placeholder="nombre@gmail.com"></div>
      <div class="ff"><label>Nombre</label><input class="input" id="us-n" placeholder="Nombre y puesto"></div>
      <div class="ff"><label>Rol</label><select class="input" id="us-r">${ROLES_USUARIO.map(r=>`<option ${r==='Programador'?'selected':''}>${r}</option>`).join('')}</select></div>
      <button class="btn btn-primary" id="us-add">${icon('plus')} Dar acceso</button>
    </div>
    <div style="overflow-x:auto"><table class="tbl cfg-table"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Último acceso</th><th></th></tr></thead><tbody>
    ${lista.map(u=>{ const yo = u.correo===USER.correo; return `<tr><td><b>${h(u.correo)}</b>${yo?' <span class="pill p-blue">tú</span>':''}</td>
      <td><input class="input" data-u="${h(u.correo)}" data-k="nombre" value="${h(u.nombre||'')}"></td>
      <td><select class="input" data-u="${h(u.correo)}" data-k="rol" ${yo?'disabled':''}>${ROLES_USUARIO.map(r=>`<option ${r===u.rol?'selected':''}>${r}</option>`).join('')}</select></td>
      <td><label class="switch"><input type="checkbox" data-u="${h(u.correo)}" data-k="activo" ${u.activo?'checked':''} ${yo?'disabled':''}><span></span></label></td>
      <td class="faint" style="white-space:nowrap">${u.ultimo?h(new Date(u.ultimo).toLocaleString('es-MX',{dateStyle:'medium', timeStyle:'short'})):'nunca'}</td>
      <td>${yo?'':`<button class="btn btn-icon btn-danger" data-udel="${h(u.correo)}" title="Quitar acceso">${icon('trash')}</button>`}</td></tr>`; }).join('')}
    </tbody></table></div></div>
    <div class="section-title">${icon('undo')} Bitácora de movimientos</div>
    <div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
    ${bit.length ? bit.map(b=>`<tr><td style="white-space:nowrap">${h(new Date(b.fecha).toLocaleString('es-MX',{dateStyle:'short', timeStyle:'short'}))}</td><td>${h(b.usuario)}</td><td>${h(b.accion)}</td><td>${h(b.detalle)}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">Sin movimientos.</td></tr>'}
    </tbody></table></div>`;
  const guardarU = async (u, msgOk)=>{
    setSync('busy');
    try{ const r = await gs('api_guardarUsuario', JSON.stringify(u)); setSync('ok'); toast(msgOk + (r.nota ? ' · '+r.nota : '')); renderUsuarios(); }
    catch(e){ setSync('err'); toast('No se pudo guardar: '+(e.message||e)); }
  };
  $('#us-add').onclick = ()=>{
    const correo = $('#us-c').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){ toast('Escribe un correo válido'); return; }
    if(lista.some(u=>u.correo===correo)){ toast('Ese correo ya está en la lista'); return; }
    guardarU({correo, nombre:$('#us-n').value.trim(), rol:$('#us-r').value, activo:true}, 'Acceso otorgado a '+correo);
  };
  $$('[data-u]', body).forEach(el=> el.onchange = ()=>{ const u = Object.assign({}, lista.find(x=>x.correo===el.dataset.u)); u[el.dataset.k] = el.type==='checkbox' ? el.checked : el.value.trim(); guardarU(u, 'Usuario actualizado'); });
  $$('[data-udel]', body).forEach(b=> b.onclick = ()=> confirmar('Quitar acceso', `¿Quitar el acceso de <b>${h(b.dataset.udel)}</b>? También se le retirará el permiso de la Hoja de Google.`, 'Quitar acceso', async ()=>{
    try{ const r = await gs('api_eliminarUsuario', b.dataset.udel); toast('Acceso retirado'+(r.nota?' · '+r.nota:'')); renderUsuarios(); }catch(e){ toast(e.message||String(e)); }
  }, true));
}
function renderCfgHorario(){
  const hz = S.config.horario;
  $('#cfg-body').innerHTML = `<div class="card"><div style="font-family:var(--font-display); font-weight:700; font-size:16px">Horario y tiempos</div><div class="muted" style="font-size:12.5px; margin:4px 0 14px">Se usa para calcular la ocupación, marcar cirugías fuera de horario y separar cirugías consecutivas en la misma sala.</div>
    <div class="fr" style="max-width:720px">
      <div class="ff"><label>Inicio de quirófano</label><input class="input" type="time" id="hz-i" value="${h(hz.inicio)}"></div>
      <div class="ff"><label>Cierre de quirófano</label><input class="input" type="time" id="hz-f" value="${h(hz.fin)}"></div>
      <div class="ff"><label>Limpieza entre cirugías (min)</label><input class="input" type="number" min="0" step="5" id="hz-l" value="${h(hz.limpiezaMin)}"></div>
      <div class="ff"><label>Duración sugerida (min)</label><input class="input" type="number" min="15" step="15" id="hz-d" value="${h(hz.duracionDefaultMin)}"></div>
    </div><div class="row" style="margin-top:14px"><button class="btn btn-primary" id="hz-save">${icon('check')} Guardar</button></div></div>`;
  $('#hz-save').onclick = ()=>{
    const i = $('#hz-i').value, f = $('#hz-f').value;
    if(!i || !f || toMin(f) <= toMin(i)){ toast('El cierre debe ser posterior al inicio'); return; }
    Object.assign(hz, {inicio:i, fin:f, limpiezaMin: Math.max(0, Number($('#hz-l').value)||0), duracionDefaultMin: Math.max(15, Number($('#hz-d').value)||120)});
    guardarConfig(); toast('Horario guardado');
  };
}

/* =====================================================================
   CONEXIÓN CON EL CRM Y RESPALDOS
   ===================================================================== */
function renderDatos(){
  loadCRM();
  const anes = (CRM.medicos||[]).filter(m=>/anestesi/i.test(norm(m.especialidad))).length;
  let used = 0; if(!GAS) try{ used = new Blob([lsGet(KEY_DATA)||'']).size; }catch(e){}
  const fuenteTxt = CRM.fuente==='navegador' ? 'el CRM abierto en este mismo navegador (se actualiza solo)' : CRM.fuente==='hoja' ? 'la Hoja de Google (compartido con todos los usuarios)' : 'un archivo importado';
  $('#main').innerHTML = `<div class="topbar"><div><h1>Conexión y respaldos</h1><div class="sub">Cómo se comunican el CRM Médicos y esta plataforma</div></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="card"><div style="font-weight:700; margin-bottom:8px">${icon('link')} Datos del CRM</div>
        ${CRM.generado ? `<div class="alert ok" style="margin-bottom:10px">${icon('check')}<div>Generados ${h(new Date(CRM.generado).toLocaleString('es-MX',{dateStyle:'medium', timeStyle:'short'}))} · guardados en ${fuenteTxt}${CRM.version?' · CRM '+h(CRM.version):''}</div></div>
        <dl class="kv" style="grid-template-columns:1fr auto"><dt>Médicos</dt><dd>${CRM.medicos.length}</dd><dt>Anestesiólogos</dt><dd>${anes}</dd><dt>Cotizaciones</dt><dd>${CRM.cotizaciones.length}</dd><dt>Por programar</dt><dd>${porProgramar().length}</dd></dl>`
        : `<div class="alert warn">${icon('alert')}<div>Aún no hay datos del CRM.</div></div>`}
        ${GAS?`<p class="muted" style="font-size:12px; line-height:1.5; margin-top:10px">En el CRM: Configuración → Programación de quirófano → <b>Descargar datos para Programación</b>. Importa ese archivo aquí cada vez que confirmes cotizaciones; queda disponible para todos.</p>`:''}
        <div class="row ro-hide" style="margin-top:12px"><button class="btn btn-sm" id="dt-imp">${icon('upload')} Importar archivo del CRM</button><input type="file" id="dt-imp-f" accept="application/json,.json" style="display:none"></div>
      </div>
      <div class="card"><div style="font-weight:700; margin-bottom:8px">${icon('download')} Enviar programación al CRM</div>
        <p class="muted" style="font-size:12.5px; line-height:1.55">${GAS ? 'Descarga este archivo e impórtalo en el CRM (Configuración → Programación de quirófano → Importar). Así el CRM recibe fechas de cirugía, reprogramaciones, canceladas y realizadas.' : 'Si ambos archivos se abren desde el mismo sitio, el CRM lee la programación solo al abrirse: fecha de cirugía, cambios de fecha, canceladas y realizadas. Si se abren desde lugares distintos, descarga este archivo e impórtalo en el CRM (Configuración → Programación de quirófano).'}</p>
        <div class="row" style="margin-top:12px"><button class="btn btn-sm" id="dt-exp">${icon('download')} Descargar archivo para el CRM</button></div>
        <div class="faint" style="font-size:11.5px; margin-top:8px">${S.cirugias.filter(c=>c.cotizacion).length} cirugía(s) ligadas a cotizaciones.</div>
      </div>
      <div class="card"><div style="font-weight:700; margin-bottom:8px">${icon('db')} Respaldos</div>
        <p class="muted" style="font-size:12.5px; line-height:1.55">${GAS ? 'Los datos viven en la Hoja de Google y se comparten entre todos los usuarios. Google guarda el historial de versiones de la hoja; además puedes descargar un respaldo.' : `Los datos viven en este navegador (${(used/1024).toFixed(0)} KB). Descarga respaldos con frecuencia; también sirven para pasar la agenda a otra computadora.`}</p>
        <div class="row" style="margin-top:12px"><button class="btn btn-primary btn-sm" id="dt-bk">${icon('download')} Generar respaldo</button><button class="btn btn-sm admin-only" id="dt-rs">${icon('upload')} Restaurar</button><input type="file" id="dt-rs-f" accept="application/json,.json" style="display:none"><button class="btn btn-sm btn-danger admin-only" id="dt-reset">${icon('trash')} Borrar todo</button>
        ${GAS && SRV.url ? `<a class="btn btn-sm admin-only" href="${h(SRV.url)}" target="_blank" rel="noopener">${icon('list')} Abrir Hoja de Google</a>` : ''}</div>
      </div>
    </div>
    <div class="section-title">${icon('info')} Cómo funciona la liga con el CRM</div>
    <div class="card" style="font-size:13px; line-height:1.7">
      <ol style="padding-left:20px">
        ${GAS ? `<li><b>Esta versión vive en Google Drive.</b> La agenda, la configuración y los datos del CRM se guardan en una Hoja de Google y todos los usuarios autorizados ven lo mismo; los cambios de otros aparecen solos en menos de un minuto.</li>
        <li><b>Del CRM a Programación:</b> en el CRM descarga "Datos para Programación" e impórtalo aquí. Las cotizaciones en "Confirmado" o "Aprobada" aparecen en <b>Por programar</b>.</li>
        <li><b>De Programación al CRM:</b> descarga "Archivo para el CRM" e impórtalo allá: la fecha de cirugía se actualiza, una <b>Realizada</b> pasa la cotización a "Realizado" y una <b>Cancelada o Suspendida</b> evita que el CRM la marque como realizada sola.</li>`
        : `<li><b>Mismo sitio = automático.</b> Publica este archivo junto al CRM (por ejemplo, ambos en tu GitHub Pages) y ábrelos en el mismo navegador. El CRM publica sus médicos y cotizaciones cada vez que guarda, y esta plataforma los toma al instante, incluso con las dos pestañas abiertas.</li>
        <li><b>Al confirmar una cotización en el CRM</b> (estatus "Confirmado" con su fecha de programación), aparece aquí en <b>Por programar</b>. Al programarla se ligan por folio.</li>
        <li><b>De regreso al CRM:</b> la fecha de cirugía se actualiza si la reprogramas aquí. Una cirugía <b>Realizada</b> pasa la cotización a "Realizado", y una <b>Cancelada o Suspendida</b> evita que el CRM la marque como realizada sola al llegar la fecha.</li>
        <li><b>Lugares distintos</b> (p. ej. CRM como archivo local): usa los botones de importar y descargar de arriba y su equivalente en el CRM.</li>`}
      </ol>
    </div>
    <div class="card" style="text-align:center; padding:20px; margin-top:16px"><div style="font-size:12.5px; color:var(--text-muted); line-height:1.7">Programación de procedimientos ${APP_VERSION}${GAS?' · Google Drive':''} · Plataforma desarrollada por <b>IMAI Juances</b><br>Todos los derechos reservados © ${new Date().getFullYear()}</div></div>`;
  $('#dt-imp').onclick = ()=> $('#dt-imp-f').click();
  $('#dt-imp-f').onchange = e=> leerArchivo(e.target.files[0], async obj=>{
    if(!exigir('Programador')) return;
    try{ await importarArchivoCRM(obj); toast('CRM importado: '+CRM.medicos.length+' médicos, '+CRM.cotizaciones.length+' cotizaciones'); renderDatos(); updateNavBadges(); }
    catch(err){ setSync('ok'); toast(obj && obj.tipo==='noor_programacion' ? 'Ese es el archivo de Programación; aquí va el que descargas desde el CRM' : (err && err.message && err.message!=='formato' ? 'No se pudo guardar: '+err.message : 'El archivo no es una exportación del CRM (v2.34.0 o posterior)')); }
  });
  $('#dt-exp').onclick = ()=>{ const p = publicarPuente(); download('programacion-para-crm-'+todayYMD()+'.json', JSON.stringify(p, null, 1)); toast('Archivo descargado'); };
  $('#dt-bk').onclick = ()=>{ download('respaldo-programacion-noor-'+todayYMD()+'.json', JSON.stringify({tipo:'noor_programacion_respaldo', version_app:APP_VERSION, config:S.config, cirugias:S.cirugias.map(c=>{ const x = clone(c); delete x._ver; delete x._por; return x; }), seq:S.seq||0}, null, 1)); toast('Respaldo descargado'); };
  $('#dt-rs').onclick = ()=> $('#dt-rs-f').click();
  $('#dt-rs-f').onchange = e=> leerArchivo(e.target.files[0], obj=>{
    if(!exigir('Administrador')) return;
    if(!obj || obj.tipo!=='noor_programacion_respaldo' || !Array.isArray(obj.cirugias)){ toast('El archivo no es un respaldo de Programación'); return; }
    confirmar('Restaurar respaldo', `Se reemplazarán los datos actuales (${S.cirugias.length} cirugías) por los del respaldo (${obj.cirugias.length} cirugías)${GAS?' para <b>todos los usuarios</b>':''}. ¿Continuar?`, 'Restaurar', ()=> reemplazarTodo({config: obj.config, cirugias: obj.cirugias, seq: obj.seq||0}, 'Respaldo restaurado'), true);
  });
  $('#dt-reset').onclick = ()=>{
    if(!exigir('Administrador')) return;
    const ov = openModal(`<div class="modal-head"><h2>Borrar todo</h2><button class="x-btn" data-close>${icon('x')}</button></div><div class="modal-body"><p style="font-size:13px; line-height:1.6; margin-bottom:10px">Se eliminarán <b>${S.cirugias.length} cirugías</b> y la configuración de catálogos${GAS?' <b>para todos los usuarios</b>':' de este navegador'}. Descarga un respaldo antes. Escribe <b>BORRAR</b> para confirmar.</p><input class="input" id="rs-t"></div><div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn btn-danger" id="rs-ok">Borrar todo</button></div>`);
    $('#rs-ok', ov).onclick = ()=>{ if($('#rs-t', ov).value.trim().toUpperCase()!=='BORRAR'){ toast('Escribe BORRAR para confirmar'); return; } reemplazarTodo({config: defaultConfig(), cirugias: [], seq:0}, 'Datos borrados'); };
  };
}
async function reemplazarTodo(d, msg){
  if(GAS){
    setSync('busy');
    try{ await gs('api_restaurar', JSON.stringify(d)); await cargarDesdeServidor(); }
    catch(e){ setSync('err'); toast('No se pudo completar: '+(e.message||e)); return; }
  } else {
    lsSet(KEY_DATA, JSON.stringify({config:d.config, cirugias:d.cirugias, seq:d.seq||0})); if(!d.cirugias.length) lsDel(BRIDGE_PROG); loadAll(); save();
  }
  closeAll(); toast(msg); go('agenda');
}
function leerArchivo(file, cb){ if(!file) return; const r = new FileReader(); r.onload = ev=>{ let obj = null; try{ obj = JSON.parse(ev.target.result); }catch(e){ toast('El archivo no es JSON válido'); return; } cb(obj); }; r.readAsText(file); }

/* =====================================================================
   TEMA Y ARRANQUE
   ===================================================================== */
function applyTheme(){
  const eff = UI.theme==='auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : UI.theme;
  document.documentElement.setAttribute('data-theme', eff);
  $$('#theme-switch button').forEach(b=> b.classList.toggle('active', b.dataset.t===UI.theme));
}
async function boot(){
  loadAll();
  applyTheme();
  $('#brand-mark').innerHTML = icon('cal');
  $('#mob-menu').innerHTML = icon('menu');
  $('#mob-menu').onclick = ()=> $('#sidebar').classList.toggle('open');
  $('#app-version').textContent = 'Programación '+APP_VERSION+(GAS?' · Drive':'');
  $$('#theme-switch button').forEach(b=> b.onclick = ()=>{ UI.theme = b.dataset.t; saveUI(); applyTheme(); });
  if(window.matchMedia) try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(UI.theme==='auto') applyTheme(); }); }catch(e){}
  const r = location.hash.slice(1); if(PAGES.some(p=>p.id===r)) UI.page = r;
  if(GAS){
    let res;
    try{ res = await cargarDesdeServidor(); }
    catch(e){ const sinPermiso = /permiso|acceso/i.test(String(e.message||e)); $('#boot-msg').innerHTML = `<p style="color:${sinPermiso?'var(--text)':'var(--red)'}; margin-bottom:8px"><b>${sinPermiso?'Tu cuenta no tiene acceso':'No se pudo abrir la programación.'}</b></p><p>${h(e.message||e)}</p><p style="margin-top:12px"><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></p>`; return; }
    if(res.denegado){ $('#boot-msg').innerHTML = `<p style="margin-bottom:8px"><b style="color:var(--text)">Tu cuenta no tiene acceso</b></p><p>Entraste como <b>${h(res.correo||'(sin correo)')}</b>. Pide al administrador de Hospital Noor que agregue este correo en <b>Configuración → Usuarios y accesos</b>.</p>`; return; }
    setInterval(()=> sincronizar(false), 45000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sincronizar(false); });
  } else {
    publicarPuente();
    // Si el CRM está abierto en otra pestaña del mismo sitio, sus cambios llegan al instante
    window.addEventListener('storage', e=>{
      if(e.key===BRIDGE_CRM){ loadCRM(); updateNavBadges(); if(!layers.length && ['porprogramar','datos','agenda'].includes(UI.page)) render(); toast('Datos del CRM actualizados'); }
      if(e.key===KEY_DATA && e.newValue){ loadAll(); if(!layers.length) render(); }
    });
    window.addEventListener('focus', ()=>{ const g = CRM.generado; loadCRM(); if(CRM.generado!==g){ updateNavBadges(); if(!layers.length) render(); } });
  }
  aplicarRolUI(); pintarUsuario();
  renderNav(); render();
  const bt = $('#boot'); if(bt) bt.remove();
  window.addEventListener('afterprint', ()=>{ $('#print-area').innerHTML = ''; });
  setInterval(()=>{ if(UI.page==='agenda' && UI.view==='dia' && !layers.length) renderAgenda(); }, 5*60*1000);
}
boot();
</script>
