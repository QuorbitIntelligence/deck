<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospectos Médicos">
<meta name="theme-color" content="#8E1B3C">
<title>Prospectos Médicos v1.1 · Hospital Noor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" onerror="var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'; document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --surface-3:#E3E9F1;
  --border:#DCE3EC; --text:#101826; --text-muted:#5B6675; --text-faint:#8A94A3;
  --primary:#2660AB; --primary-dark:#1B3E73; --primary-light:#E7EFFA;
  --accent:#FF6B4A; --accent-light:#FFE9E3;
  --violet:#6C4AB6; --violet-light:#EDE7F9;
  --green:#158A4A; --green-bg:#DFF5E7;
  --amber:#B5750B; --amber-bg:#FCF0D6;
  --red:#C2291F; --red-bg:#FBE2DF;
  --blue:#1D5FBF; --blue-bg:#E1EBFB;
  --guinda:#8E1B3C; --guinda-dark:#6B1330; --guinda-light:#FBE7ED;
  --shadow: 0 1px 2px rgba(16,32,43,.04), 0 4px 16px rgba(16,32,43,.06);
  --shadow-lg: 0 8px 24px rgba(16,32,43,.10), 0 2px 6px rgba(16,32,43,.06);
  --radius: 14px; --radius-sm: 9px;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2C; --surface-2:#182238; --surface-3:#1F2C46;
  --border:#26334D; --text:#E9EFF4; --text-muted:#93A5B5; --text-faint:#5E7085;
  --primary:#5B9BE0; --primary-dark:#3E7AC0; --primary-light:#132A4A;
  --accent:#FF8266; --accent-light:#3A2018;
  --violet:#A48AE8; --violet-light:#241C3D;
  --green:#4ADE80; --green-bg:#123321;
  --amber:#FBBF24; --amber-bg:#3A2A08;
  --red:#F87171; --red-bg:#3A1512;
  --blue:#60A5FA; --blue-bg:#0F2544;
  --guinda:#D64D74; --guinda-dark:#B33A5D; --guinda-light:#3A1522;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{max-width:100vw;}
svg{width:16px; height:16px; display:inline-block; vertical-align:middle;}
canvas{max-width:100%;}
body{font-family:var(--font-body); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;}
::selection{background:var(--primary); color:#fff;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:
  radial-gradient(circle at 20% 20%, var(--primary-light), transparent 45%),
  radial-gradient(circle at 85% 80%, var(--violet-light), transparent 40%), var(--bg); z-index:500;}
.login-card{width:380px; max-width:90vw; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:40px 36px 32px; box-shadow:var(--shadow-lg); position:relative; overflow:hidden;}
.login-card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--primary),var(--guinda));}
.login-brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.login-brand .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); display:flex; align-items:center; justify-content:center;}
.login-brand h1{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:.2px;}
.login-sub{color:var(--text-muted); font-size:13.5px; margin-bottom:26px; line-height:1.5;}
.field-label{font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:7px; display:block;}
.pass-input{width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface-2); font-size:15px; color:var(--text); outline:none; transition:.15s; letter-spacing:1px;}
.pass-input:focus{border-color:var(--primary); background:var(--surface);}
.login-btn{width:100%; margin-top:16px; padding:13px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-weight:600; font-size:14.5px; transition:.15s;}
.login-btn:hover{background:var(--primary-dark);}
.login-err{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px;}
.login-foot{margin-top:22px; font-size:11.5px; color:var(--text-faint); text-align:center;}

/* ---------- APP LAYOUT ---------- */
#app{display:none; min-height:100vh;}
#app.show{display:flex;}
.sidebar{width:236px; flex-shrink:0; background:linear-gradient(180deg,var(--guinda),var(--guinda-dark)); border-right:none; display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
.brand .mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); flex-shrink:0;}
.brand h1{font-family:var(--font-display); font-size:16.5px; font-weight:700; color:#fff;}
.brand span{display:block; font-size:10px; color:rgba(255,255,255,.62); letter-spacing:.08em; font-weight:600;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.5); font-weight:700; margin:16px 10px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:7px 12px 7px 7px; border-radius:9px; color:rgba(255,255,255,.8); font-size:13.5px; font-weight:500; text-decoration:none; border:none; background:none; width:100%; text-align:left; transition:.12s;}
.nav-icon-chip{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,.14) !important; color:#fff !important;}
.nav-item svg{width:17px; height:17px; flex-shrink:0;}
.nav-item .nav-icon-chip svg{width:14px; height:14px;}
.nav-item:hover{background:rgba(255,255,255,.10); color:#fff;}
.nav-item.active{background:#fff; color:var(--guinda); font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.18);}
.nav-badge{flex-shrink:0; min-width:20px; text-align:center; padding:2px 6px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.02em;
  background:#CFFF04; color:#1a2e05; box-shadow:0 0 6px rgba(207,255,4,.85), 0 0 1px rgba(207,255,4,1) inset;}
.nav-item.active .nav-badge{background:var(--guinda); color:#CFFF04; box-shadow:0 0 6px rgba(142,27,60,.55);}
.nav-item.active .nav-icon-chip{background:var(--guinda-light) !important; color:var(--guinda) !important;}
[data-theme="dark"] .nav-item.active{color:var(--guinda);}
.sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.18);}
.theme-switch{display:flex; background:rgba(255,255,255,.12); border-radius:9px; padding:3px; gap:2px;}
.theme-switch button{flex:1; padding:7px 0; border:none; background:none; border-radius:7px; font-size:11px; color:rgba(255,255,255,.7); font-weight:600;}
.theme-switch button.active{background:#fff; color:var(--guinda); box-shadow:var(--shadow);}
.logout-link{margin-top:10px; font-size:12px; color:rgba(255,255,255,.55); text-align:center; display:block; padding:6px;}
.logout-link:hover{color:#fff;}

.main{flex:1; min-width:0; overflow-x:hidden;}
.topbar{position:sticky; top:0; z-index:20; background:var(--bg); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; padding:calc(18px + env(safe-area-inset-top,0px)) 28px 18px; border-bottom:1px solid transparent;}
.topbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg,var(--primary),var(--guinda) 60%,transparent);}
.topbar h2{font-family:var(--font-display); font-size:22px; font-weight:700;}
.topbar .crumbs{font-size:12.5px; color:var(--text-faint); margin-top:2px;}
.searchbox{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; width:280px;}
.searchbox input{border:none; background:none; outline:none; font-size:13px; width:100%; color:var(--text);}
.searchbox svg{width:15px; height:15px; color:var(--text-faint); flex-shrink:0;}
.content{padding:6px 28px 60px;}

/* ---------- COMPONENTS ---------- */
.grid{display:grid; gap:16px;}
.kpi-grid{grid-template-columns:repeat(4,1fr);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.kpi-card{display:flex; flex-direction:column; gap:6px;}
.kpi-top{display:flex; align-items:center; justify-content:space-between;}
.kpi-label{font-size:12px; color:var(--text-muted); font-weight:600;}
.kpi-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
.kpi-icon svg{width:15px; height:15px;}
.kpi-value{font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-.3px;}
.kpi-pct{display:inline-block; font-family:var(--font-body); font-size:11px; font-weight:700; color:var(--text-faint); background:var(--surface-2); border-radius:999px; padding:1.5px 7px; vertical-align:middle; margin-left:2px;}
.kpi-delta{font-size:11.5px; font-weight:600;}

.section-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:28px 0 14px; display:flex; align-items:center; justify-content:space-between;}
.two-col{grid-template-columns:1.4fr 1fr;}
.chart-wrap{position:relative; height:230px;}

.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);} .dot-blue{background:var(--blue);} .dot-violet{background:var(--violet);}
.dot-prio{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
.dot-prio-alta{background:#FF2D4E; box-shadow:0 0 7px 1.5px #FF2D4E, 0 0 2px #FF2D4E;}
.dot-prio-media{background:#FFDE21; box-shadow:0 0 7px 1.5px #FFDE21, 0 0 2px #FFDE21;}
.dot-prio-baja{background:#FF8A00; box-shadow:0 0 7px 1.5px #FF8A00, 0 0 2px #FF8A00;}
.followup-bubble{position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); left:22px; z-index:410; background:var(--surface); border:1.5px solid var(--amber); border-radius:14px; padding:13px 34px 13px 16px; box-shadow:var(--shadow-lg); max-width:300px; animation:fbIn .25s ease;}
#reminder-stack{position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); right:22px; z-index:411; display:flex; flex-direction:column-reverse; gap:10px; max-width:300px;}
.reminder-card{position:relative; background:var(--surface); border:1.5px solid var(--guinda); border-radius:12px; padding:12px 30px 12px 14px; box-shadow:var(--shadow-lg); display:flex; gap:10px; animation:fbIn .25s ease;}
.reminder-card.is-overdue{border-color:var(--red); background:var(--red-bg);}
.reminder-body{display:flex; gap:10px; cursor:pointer; flex:1; min-width:0;}
.reminder-icon{width:26px; height:26px; border-radius:50%; background:var(--guinda-light); color:var(--guinda); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.reminder-card.is-overdue .reminder-icon{background:var(--red-bg); color:var(--red);}
.reminder-title{font-size:12px; font-weight:700; color:var(--text);}
.reminder-sub{font-size:10.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reminder-dismiss{position:absolute; top:8px; right:8px; width:18px; height:18px; border:none; background:none; color:var(--text-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.reminder-dismiss svg{width:11px; height:11px;}
.fb-body{display:flex; gap:10px; align-items:flex-start; cursor:pointer;}
.fb-body svg{width:18px; height:18px; color:var(--amber); flex-shrink:0; margin-top:1px;}
.fb-title{font-size:12.5px; font-weight:700; color:var(--text);}
.fb-sub{font-size:10.5px; color:var(--text-muted); margin-top:2px; line-height:1.4;}
.fb-dismiss{position:absolute; top:8px; right:8px; width:18px; height:18px; border:none; background:none; color:var(--text-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.fb-dismiss svg{width:12px; height:12px;}
@keyframes fbIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.monitor-row{display:flex; align-items:flex-start; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border);}
.monitor-row:last-child{border-bottom:none;}
.monitor-live-dot{width:8px; height:8px; border-radius:50%; background:var(--guinda); box-shadow:0 0 0 0 rgba(142,27,60,.5); animation:liveDotPulse 2s infinite;}
@keyframes liveDotPulse{0%{box-shadow:0 0 0 0 rgba(142,27,60,.45);} 70%{box-shadow:0 0 0 7px rgba(142,27,60,0);} 100%{box-shadow:0 0 0 0 rgba(142,27,60,0);}}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 8px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.pill-green{background:var(--green-bg); color:var(--green);}
.pill-amber{background:var(--amber-bg); color:var(--amber);}
.pill-red{background:var(--red-bg); color:var(--red);}
.pill-blue{background:var(--blue-bg); color:var(--blue);}
.pill-muted{background:var(--surface-2); color:var(--text-muted);}

.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow); max-width:100%;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap;}
tbody td{padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:.1s;}
tbody tr.clickable:hover{background:var(--surface-2); cursor:pointer;}
tbody tr.clickable.row-selected{background:var(--primary-light) !important;}
tbody tr.clickable.row-selected:hover{background:var(--primary-light) !important;}
.mono{font-family:var(--font-mono); font-size:12px; color:var(--text-muted);}
.avatar{width:32px; height:32px; border-radius:9px; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; font-family:var(--font-display); flex-shrink:0;}
[data-theme="dark"] .avatar{color:var(--primary);}
.name-cell{display:flex; align-items:center; gap:10px;}
.name-cell .sub{font-size:11.5px; color:var(--text-faint); font-weight:500;}

.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.btn{padding:9px 16px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:.12s;}
.btn:hover{background:var(--surface-2);}
.btn svg{width:14px; height:14px;}
.btn-primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-guinda{background:var(--guinda); border-color:var(--guinda); color:#fff;}
.btn-guinda:hover{background:var(--guinda-dark);}
.btn-whatsapp{width:30px; height:30px; border-radius:50%; background:#25D366; border:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 6px rgba(37,211,102,.4); transition:.12s;}
.pr-icon-btn{width:23px; height:23px; box-shadow:none;}
.pr-icon-btn svg{width:12px; height:12px;}
.pr-badge{position:absolute; top:-5px; right:-5px; background:var(--guinda); color:#fff; font-size:8px; font-weight:700; border-radius:999px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 2px;}
.btn-whatsapp:hover{transform:scale(1.08);}
.btn-whatsapp svg{width:17px; height:17px;}
.btn-whatsapp.disabled{background:var(--surface-3); box-shadow:none; cursor:not-allowed;}
.btn-danger{color:var(--red); border-color:var(--red-bg);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:6px 11px; font-size:12px;}
.select, .input{padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--text); outline:none;}
.select:focus, .input:focus{border-color:var(--primary);}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip{padding:6px 12px; border-radius:999px; border:1px solid var(--border); font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface);}
.chip.active{background:var(--text); color:var(--surface); border-color:var(--text);}
.estatus-glow-row{flex-wrap:wrap;}
.estatus-glow{border-color:var(--glow-color,var(--border)); color:var(--glow-color,var(--text-muted)); box-shadow:0 0 0 1px var(--glow-color,transparent), 0 0 10px -2px var(--glow-color,transparent); font-weight:700;}
.estatus-glow.active{background:var(--glow-color,var(--text)); color:#fff; box-shadow:0 0 14px -1px var(--glow-color,transparent), 0 0 0 1px var(--glow-color,transparent);}
.estatus-count{display:inline-block; min-width:18px; padding:1px 5px; border-radius:999px; background:rgba(0,0,0,.08); font-size:10.5px; font-weight:800; margin-left:3px;}
.estatus-glow.active .estatus-count{background:rgba(255,255,255,.28);}

.pagination{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; font-size:12px; color:var(--text-muted);}
.pagination .btns{display:flex; gap:6px;}
.pagination button{width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface);}
.pagination button:disabled{opacity:.4; cursor:default;}

/* drawer / modal */
.overlay{position:fixed; inset:0; background:rgba(10,15,25,.45); z-index:100; display:none;}
.overlay.show{display:block;}
.drawer{position:fixed; top:0; right:0; height:100vh; width:480px; max-width:92vw; background:var(--surface); z-index:101; box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column;}
.drawer.show{transform:translateX(0);}
.drawer-head{padding:22px 24px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
.drawer-body{padding:22px 24px; overflow-y:auto; flex:1;}
.drawer-close{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.drawer-close svg{width:14px; height:14px;}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab-btn{padding:9px 4px; margin-right:18px; font-size:12.5px; font-weight:600; color:var(--text-faint); border:none; background:none; border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--primary); border-color:var(--primary);}
.detail-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; gap:14px;}
.detail-row .k{color:var(--text-faint); font-weight:500;}
.detail-row .v{text-align:right; font-weight:600;}
.sensitive-mask{font-family:var(--font-mono); letter-spacing:1px;}

.modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:640px; max-width:92vw; max-height:88vh; overflow-y:auto; background:var(--surface); border-radius:18px; z-index:101; box-shadow:var(--shadow-lg); display:none;}
.modal.show{display:block;}
.modal-head{padding:22px 26px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--surface); z-index:2;}
.modal-body{padding:22px 26px;}
.modal-foot{padding:16px 26px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--surface);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

.toast{background:var(--text); color:var(--bg); padding:12px 18px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px; animation:toastin .2s ease;}

.uc-input{text-transform:uppercase;}

.result-main{flex:1; min-width:0;}
.result-title{font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.add-circle{width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:16px; font-weight:600; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0;}
.add-circle:hover{background:var(--primary-dark);}
.selected-chip{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--primary-light); border:1px solid var(--primary); border-radius:10px; margin-top:8px;}

.selected-chip .txt{flex:1; font-size:12.5px; font-weight:600; color:var(--text);}
.selected-chip button{background:none; border:none; color:var(--text-faint); width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.pill-small{font-size:10px; padding:2px 7px;}
.clausula-row{display:flex; align-items:flex-start; gap:9px; padding:8px 4px; border-bottom:1px solid var(--border); font-size:12px;}
.clausula-row:last-child{border-bottom:none;}
.clausula-row input[type=checkbox]{margin-top:3px; flex-shrink:0;}
.switch{position:relative; width:36px; height:20px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--surface-3); border-radius:999px; transition:.15s; cursor:pointer;}
.switch .track:before{content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--primary);}
.switch input:checked + .track:before{transform:translateX(16px);}
.mark-toggle{width:22px; height:22px; border:2px solid var(--text-faint); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; background:var(--surface); flex-shrink:0; color:#fff; transition:.12s;}
.mark-toggle svg{width:13px; height:13px; stroke-width:3;}
.mark-toggle.active{background:var(--primary); border-color:var(--primary);}
.mark-toggle:hover{border-color:var(--primary);}
.pill-violet{background:var(--violet-light); color:var(--violet);}

.cal-range-label{font-family:var(--font-display); font-weight:700; font-size:15px;}

.cal-day{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:160px; display:flex; flex-direction:column;}

.cal-day-head{font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.cal-day.is-today .cal-day-head{color:var(--guinda);}
.cal-case-card{background:var(--surface-2); border-radius:8px; padding:8px 9px; margin-bottom:7px; cursor:pointer; transition:.12s;}

  background-image:repeating-linear-gradient(to bottom, transparent, transparent 22px, var(--border) 22px, var(--border) 23px); background-attachment:local;}
.week-objetivo{background:var(--guinda-light); border:1px solid var(--guinda); border-radius:12px; padding:12px 14px; margin-bottom:16px;}

.hour-label-col{display:flex; flex-direction:column;}

.ring-track{fill:none; stroke:var(--border); stroke-width:5;}

.ring-center-dot{position:absolute; top:50%; left:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:var(--guinda); box-shadow:0 0 0 0 rgba(142,27,60,.5); animation:ringDotPulse 2.2s ease-in-out infinite;}

@keyframes ringDash{0%,100%{stroke-dashoffset:230;} 50%{stroke-dashoffset:40;}}
@keyframes ringDotPulse{0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(142,27,60,.45);} 50%{transform:scale(1.35); box-shadow:0 0 0 8px rgba(142,27,60,0);}}

function normalizeText(s){ return (s==null?'':String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function fuzzyMatch(haystack, query){
  if(!query) return true;
  const h = normalizeText(haystack);
  const tokens = normalizeText(query).split(/\s+/).filter(Boolean);
  return tokens.every(t=>h.includes(t));
}
document.addEventListener('input', e=>{
  if(e.target && e.target.classList && e.target.classList.contains('uc-input') && e.target.tagName!=='SELECT'){
    const el = e.target, pos = el.selectionStart;
    el.value = el.value.toUpperCase();
    if(pos!=null) el.setSelectionRange(pos,pos);
  }
});
function fmtDate(d){
  if(!d) return '—';
  try{
    let dt;
    if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d)){
      const [y,mo,da] = d.split('-').map(Number);
      dt = new Date(y, mo-1, da);
    } else {
      dt = new Date(d);
    }
    return dt.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  }catch(e){return d;}
}
function fmtDateTime(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return d;} }
function initials(name){ return (name||'').replace(/^DR[A]?\.?\s+/i,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function getMonday(d){ const date = new Date(d); date.setHours(0,0,0,0); const day = date.getDay(); const diff = (day===0?-6:1-day); date.setDate(date.getDate()+diff); return date; }
function ymd(d){ const dt = new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function slugify(text){
  return (text||'').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'')
    .toUpperCase();
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
function toast(msg, icoName){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div'); el.className='toast';
  el.innerHTML = `${icon(icoName||'check','')} <span>${msg}</span>`;
  el.querySelector('svg').style.width='15px'; el.querySelector('svg').style.height='15px'; el.querySelector('svg').style.flexShrink='0';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.2s'; setTimeout(()=>el.remove(),200); }, 2800);
}

  <div class="kpi-top"><span class="kpi-label" style="font-size:10.5px;">${label}</span>

  <div class="kpi-value" style="font-size:19px;">${value}</div></div>`; }
function wireEspecialidadPicker(searchElId, resultsElId, especialidadesConCount, onSelect){
  const searchEl = document.getElementById(searchElId);
  const resultsEl = document.getElementById(resultsElId);
  function rowsHtml(list){
    return `<div class="result-row" data-val="todas"><div class="result-main"><div class="result-title">Todas las especialidades</div></div></div>` +
      (list.length ? list.map(([e,c])=>`<div class="result-row" data-val="${e.replace(/"/g,'&quot;')}"><div class="result-main"><div class="result-title">${e}</div><div class="result-sub">${c} médico(s)</div></div></div>`).join('') : `<div class="picker-empty">Sin coincidencias</div>`);
  }
  function wireRows(){
    resultsEl.querySelectorAll('[data-val]').forEach(row=> row.onclick = ()=>{
      const val = row.dataset.val;
      searchEl.value = val==='todas' ? '' : val;
      resultsEl.style.display='none';
      onSelect(val);
    });
  }
  searchEl.onfocus = ()=>{ resultsEl.innerHTML = rowsHtml(especialidadesConCount); resultsEl.style.display='block'; wireRows(); };
  searchEl.oninput = ()=>{
    const q = searchEl.value;
    const filtered = q.trim() ? especialidadesConCount.filter(([e])=>fuzzyMatch(e,q)) : especialidadesConCount;
    resultsEl.innerHTML = rowsHtml(filtered);
    resultsEl.style.display='block';
    wireRows();
  };
  document.addEventListener('click', e=>{ if(!e.target.closest('.picker-wrap')) resultsEl.style.display='none'; });
}

/* ============================================================
   PROSPECTOS — directorio de médicos candidatos a Lead
============================================================ */
let prospectosState = { page:1, perPage:50, search:'', especialidad:'todas', selected:{} };
let prSortState = { campo:null, dir:'asc' };
function prThOrd(label, campo){
  const activo = prSortState.campo===campo;
  const arrow = activo ? (prSortState.dir==='asc'?' ▲':' ▼') : '';
  return `<th style="cursor:pointer; user-select:none;" onclick="prOrdenarPor('${campo}')">${label}${arrow}</th>`;
}
function prOrdenarPor(campo){
  if(prSortState.campo===campo) prSortState.dir = prSortState.dir==='asc'?'desc':'asc';
  else prSortState = { campo, dir:'asc' };
  renderProspectos();
}
function getProspectosFiltrados(){
  const base = DB.prospectos.filter(p=>{
    if(prospectosState.search && !fuzzyMatch(p.nombre+' '+p.especialidad+' '+(p.hospital||''), prospectosState.search)) return false;
    if(prospectosState.especialidad!=='todas' && !(p.especialidad||'').split(',').map(e=>e.trim()).includes(prospectosState.especialidad)) return false;
    return true;
  });
  if(!prSortState.campo){
    return base.sort((a,b)=> (a.especialidad||'').localeCompare(b.especialidad||'','es') || a.nombre.localeCompare(b.nombre,'es'));
  }
  const campo = prSortState.campo, dir = prSortState.dir==='asc'?1:-1;
  return base.sort((a,b)=>{
    const va = (a[campo]||'').toString().toLowerCase();
    const vb = (b[campo]||'').toString().toLowerCase();
    if(!va && vb) return 1;
    if(va && !vb) return -1;
    return va.localeCompare(vb,'es')*dir;
  });
}
function conteoPorEspecialidadProspectos(){
  const counts = {};
  DB.prospectos.forEach(p=> (p.especialidad||'').split(',').forEach(e=>{ const t=e.trim(); if(t) counts[t]=(counts[t]||0)+1; }));
  return counts;
}
function renderProspectos(){
  const counts = conteoPorEspecialidadProspectos();
  const especialidadesConCount = Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0],'es'));
  document.getElementById('content-pr').innerHTML = `
    <div id="pr-bar-wrap"></div>
    <div class="toolbar">
      <div class="searchbox" style="width:280px;">${icon('search')}<input id="pr-search" placeholder="Buscar por nombre, especialidad u hospital…" value="${prospectosState.search}"></div>
      <div class="picker-wrap" style="position:relative;">
        <div class="searchbox" style="width:260px;">${icon('search')}<input id="pr-especialidad" placeholder="Buscar especialidad…" value="${prospectosState.especialidad!=='todas'?prospectosState.especialidad:''}" autocomplete="off"></div>
        <div id="pr-especialidad-results" class="picker-results" style="display:none;"></div>
      </div>
      <span id="pr-count" style="font-size:11.5px; color:var(--text-faint);"></span>
      <span id="pr-selected-count" style="font-size:11.5px; color:var(--guinda); font-weight:700;"></span>
      <button class="btn btn-danger" id="pr-bulk-delete" style="display:none;">${icon('trash')} Eliminar seleccionados</button>
      <button class="btn btn-guinda" style="margin-left:auto;" onclick="openProspectosMassEdit()">${icon('config')} Edición masiva</button>
      <button class="btn" onclick="openProspectosReporteModal()">${icon('download')} Generar reporte</button>
      <button class="btn" onclick="abrirGraficasProspectos()">${icon('analytics')} Ver gráficas de avance</button>
      <button class="btn btn-primary" onclick="generateProspectosAvancePDF()">${icon('download')} Reporte de avance PDF</button>
    </div>
    <div class="table-wrap">
      <table><thead><tr><th style="width:32px;"><input type="checkbox" id="pr-select-all"></th>
        ${prThOrd('Médico','nombre')}${prThOrd('Especialidad','especialidad')}${prThOrd('Hospital','hospital')}${prThOrd('Teléfono','telefono')}${prThOrd('Correo','correo')}${prThOrd('Estatus de contacto','estatus_contacto')}<th>Acciones</th></tr></thead>
      <tbody id="pr-tbody"></tbody></table>
    </div>`;
  drawProspectosBar();
  document.getElementById('pr-search').oninput = (e)=>{ prospectosState.search=e.target.value; drawProspectosTable(); };
  wireEspecialidadPicker('pr-especialidad', 'pr-especialidad-results', especialidadesConCount, (val)=>{ prospectosState.especialidad=val; drawProspectosTable(); drawProspectosBar(); });
  document.getElementById('pr-select-all').onchange = (e)=>{
    getProspectosFiltrados().forEach(p=>{ prospectosState.selected[p.id] = e.target.checked; });
    drawProspectosTable();
  };
  document.getElementById('pr-bulk-delete').onclick = ()=>{
    const ids = Object.entries(prospectosState.selected).filter(([,v])=>v).map(([id])=>id);
    if(!ids.length) return;
    if(!confirm('¿Eliminar '+ids.length+' prospecto(s) seleccionado(s)? Esta acción no se puede deshacer.')) return;
    DB.prospectos = DB.prospectos.filter(p=>!ids.includes(p.id));
    ids.forEach(id=> delete prospectosState.selected[id]);
    persistExtra(); toast(ids.length+' prospecto(s) eliminados'); renderProspectos();
  };
  drawProspectosTable();
}
function eliminarProspecto(id){
  const p = DB.prospectos.find(x=>x.id===id); if(!p) return;
  if(!confirm('¿Eliminar a "'+p.nombre+'" de Prospectos? Útil si es un duplicado. Esta acción no se puede deshacer.')) return;
  DB.prospectos = DB.prospectos.filter(x=>x.id!==id);
  delete prospectosState.selected[id];
  persistExtra(); toast('Prospecto eliminado'); renderProspectos();
}
function marcarContacto(p){
  const now = new Date().toISOString();
  if(!p.fecha_primer_contacto) p.fecha_primer_contacto = now;
  p.fecha_ultimo_contacto = now;
}
function abrirNotasProspecto(id){
  const p = DB.prospectos.find(x=>x.id===id); if(!p) return;
  openModal(`
    <div class="modal-head"><div style="font-weight:700; font-size:16px;">Notas — ${p.nombre}</div><button class="drawer-close" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="form-field full"><label>Notas (ej. médico fallecido, duplicado, dato incorrecto, etc.)</label>
        <textarea class="input" id="pr-notas-ta" style="width:100%; min-height:120px;">${p.notas||''}</textarea>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pr-notas-save">${icon('check')} Guardar</button></div>`);

/* Convertir a Lead — "Opción A": esta herramienta es independiente de la plataforma
   principal (otro origen/otro localStorage), así que no puede escribir el nuevo
   médico directamente en el CRM. En su lugar, muestra los datos listos para copiar
   y, cuando confirmes que ya diste de alta al médico en la plataforma principal
   (botón "Nuevo médico" del Paso 1 de la cotización, o el módulo de Leads),
   se quita de este listado y se registra para las estadísticas de conversión. */
function convertirProspectoALead(id){
  const p = DB.prospectos.find(x=>x.id===id); if(!p) return;
  const especialidadPrincipal = (p.especialidad||'').split(',')[0].trim();
  const datos = [

    ['Especialidad', especialidadPrincipal||'—'],
    ['Teléfono', p.telefono||'—'],
    ['Correo', p.correo||'—'],
    ['Origen', 'Prospectos ('+(p.origen||'')+')'],
  ];
  const bloqueCopiable = 'Nombre: '+p.nombre+'\nEspecialidad: '+(especialidadPrincipal||'—')+'\nTeléfono: '+(p.telefono||'—')+'\nCorreo: '+(p.correo||'—')+'\nOrigen: Prospectos ('+(p.origen||'')+')';
  openModal(`
    <div class="modal-head"><div style="font-weight:700; font-size:16px;">Convertir a Lead</div><button class="drawer-close" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">
        Esta herramienta de Prospectos vive por separado de tu plataforma principal, así que el alta se hace ahí manualmente — con el botón <b>"Nuevo médico"</b> (disponible incluso desde el Paso 1 del cotizador) o desde el módulo de Leads. Copia los datos de abajo y pégalos allá.
      </div>
      <div class="card" style="padding:14px 16px; margin-bottom:14px;">
        ${datos.map(([label,val])=>`<div style="display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--border); font-size:12.5px;"><span style="color:var(--text-faint);">${label}</span><span style="font-weight:600; text-align:right;">${val}</span></div>`).join('')}
      </div>
      <button class="btn" style="width:100%; justify-content:center;" id="ctl-copy-all">${icon('quote')} Copiar todos los datos</button>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="ctl-confirm">${icon('check')} Ya lo di de alta — quitar de Prospectos</button>
    </div>`);
  document.getElementById('ctl-copy-all').onclick = ()=>{
    copiarAlPortapapeles(bloqueCopiable);
    toast('Datos copiados');
  };
  document.getElementById('ctl-confirm').onclick = ()=>{
    if(!confirm('¿Confirmas que ya diste de alta a "'+p.nombre+'" en la plataforma principal? Se quitará de este listado de Prospectos.')) return;
    DB.convertidos_historial.push({ nombre: p.nombre, especialidad: p.especialidad||'', fecha: new Date().toISOString() });
    DB.prospectos = DB.prospectos.filter(x=>x.id!==id);
    persistExtra(); closeModal(); toast(p.nombre+' se quitó de Prospectos'); renderProspectos();
  };
}
function copiarAlPortapapeles(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>copiarAlPortapapelesFallback(text));
  } else {
    copiarAlPortapapelesFallback(text);
  }
}
function copiarAlPortapapelesFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

/* computeProspectosStats: adaptado para no depender de DB.medicos (otro origen/archivo).
   Los "convertidos" se cuentan a partir de DB.convertidos_historial, que se llena
   cuando confirmas la conversión manual en convertirProspectoALead(). */
function computeProspectosStats(especialidadFiltro){
  const universo = especialidadFiltro==='todas' ? DB.prospectos : DB.prospectos.filter(p=>(p.especialidad||'').split(',').map(e=>e.trim()).includes(especialidadFiltro));
  const total = universo.length;
  const gestionados = universo.filter(p=>p.estatus_contacto || (p.envios_whatsapp>0) || (p.envios_email>0)).length;
  const pct = total ? Math.round(gestionados/total*100) : 0;
  const estBreak = { 'Sin datos de contacto':0, 'Sin gestionar':0, 'Contacto establecido':0, 'Sin contacto establecido':0 };
  let conTel=0, conCorreo=0, conAmbos=0;
  universo.forEach(p=>{
    if(!p.telefono && !p.correo) estBreak['Sin datos de contacto']++;
    else { estBreak[p.estatus_contacto||'Sin gestionar']++; if(p.telefono&&p.correo) conAmbos++; else if(p.telefono) conTel++; else conCorreo++; }
  });
  const hoyStr = ymd(new Date());
  const inicioSemana = getMonday(new Date());
  const contactadosHoy = universo.filter(p=>p.fecha_ultimo_contacto && ymd(new Date(p.fecha_ultimo_contacto))===hoyStr).length;
  const contactadosSemana = universo.filter(p=>p.fecha_ultimo_contacto && new Date(p.fecha_ultimo_contacto)>=inicioSemana).length;
  const convertidos = DB.convertidos_historial.filter(c=> especialidadFiltro==='todas' || (c.especialidad||'').split(',').map(e=>e.trim()).includes(especialidadFiltro)).length;
  const tasaConversion = gestionados ? Math.round(convertidos/gestionados*100) : 0;
  const msgWA = universo.reduce((s,p)=>s+(p.envios_whatsapp||0),0);
  const msgEmail = universo.reduce((s,p)=>s+(p.envios_email||0),0);
  const msgSeg = universo.reduce((s,p)=>s+(p.envios_seguimiento||0),0);
  return { universo, total, gestionados, pct, estBreak, conTel, conCorreo, conAmbos, contactadosHoy, contactadosSemana, convertidos, tasaConversion, msgWA, msgEmail, msgSeg };
}

  document.querySelector('.modal').style.width = '780px';
  wireEspecialidadPicker('pr-graf-especialidad', 'pr-graf-especialidad-results', especialidadesConCount, (val)=>{ graficasProspectosFiltro = val; dibujarGraficasProspectosContenido(); });
  dibujarGraficasProspectosContenido();
}
function dibujarGraficasProspectosContenido(){
  const s = computeProspectosStats(graficasProspectosFiltro);
  const cont = document.getElementById('pr-graf-contenido'); if(!cont) return;
  cont.innerHTML = `
    <div class="card" style="padding:14px 18px; margin-bottom:16px;">
      <div style="font-size:11.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:12px;">${s.gestionados} / ${s.total} gestionados · ${s.pct}%</div>
      <div class="grid kpi-grid">
        ${miniKpi('Sin datos de contacto', s.estBreak['Sin datos de contacto'], 'x', 'guinda')}
        ${miniKpi('Sin gestionar', s.estBreak['Sin gestionar'], 'followup', 'blue')}
        ${miniKpi('Contacto establecido', s.estBreak['Contacto establecido'], 'check', 'green')}
        ${miniKpi('Sin contacto establecido', s.estBreak['Sin contacto establecido'], 'x', 'amber')}
        ${miniKpi('Con teléfono', s.conTel+s.conAmbos, 'whatsapp', 'green')}
        ${miniKpi('Con correo', s.conCorreo+s.conAmbos, 'quote', 'primary')}
        ${miniKpi('Con ambos datos', s.conAmbos, 'check', 'primary')}
        ${miniKpi('Contactados hoy', s.contactadosHoy, 'calendar', 'violet')}
        ${miniKpi('Contactados esta semana', s.contactadosSemana, 'calendar', 'violet')}
        ${miniKpi('Convertidos a Lead', s.convertidos, 'plus', 'green')}
        ${miniKpi('Tasa de conversión', s.tasaConversion+'%', 'analytics', 'green')}
        ${miniKpi('Mensajes WhatsApp', s.msgWA, 'whatsapp', 'green')}
        ${miniKpi('Correos enviados', s.msgEmail, 'quote', 'primary')}
        ${miniKpi('Mensajes de seguimiento', s.msgSeg, 'history', 'violet')}
      </div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:16px;">
      <div><div style="font-weight:700; font-size:12px; margin-bottom:8px;">Por estatus de contacto</div><div class="chart-wrap" style="height:220px;"><canvas id="chart-pr-estatus"></canvas></div></div>
      <div><div style="font-weight:700; font-size:12px; margin-bottom:8px;">${graficasProspectosFiltro==='todas'?'Top 8 especialidades':'Detalle de '+graficasProspectosFiltro}</div><div class="chart-wrap" style="height:220px;"><canvas id="chart-pr-especialidad"></canvas></div></div>
    </div>`;
  setTimeout(()=>{
    try{
      new Chart(document.getElementById('chart-pr-estatus'), { type:'bar', data:{ labels:Object.keys(s.estBreak), datasets:[{ data:Object.values(s.estBreak), backgroundColor:['#8E1B3C','#9CA3AF','#22C55E','#D69A1F'], borderRadius:6 }]},
        options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{font:{size:10}}}, x:{ticks:{font:{size:9}}}} } });
      if(graficasProspectosFiltro==='todas'){
        const espCounts = conteoPorEspecialidadProspectos();
        const topEsp = Object.entries(espCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
        new Chart(document.getElementById('chart-pr-especialidad'), { type:'bar', data:{ labels:topEsp.map(e=>e[0]), datasets:[{ data:topEsp.map(e=>e[1]), backgroundColor:'#1B3E73', borderRadius:6 }]},
          options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{font:{size:10}}}, y:{ticks:{font:{size:9}}}} } });
      } else {
        const data = { 'Con teléfono':s.conTel+s.conAmbos, 'Con correo':s.conCorreo+s.conAmbos, 'Contactados hoy':s.contactadosHoy, 'Convertidos':s.convertidos };
        new Chart(document.getElementById('chart-pr-especialidad'), { type:'bar', data:{ labels:Object.keys(data), datasets:[{ data:Object.values(data), backgroundColor:'#1B3E73', borderRadius:6 }]},
          options:{ indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{font:{size:10}}}, y:{ticks:{font:{size:9}}}} } });
      }
    }catch(e){}

}
function generateProspectosAvancePDF(){
  if(!window.jspdf){ toast('No se pudo generar el PDF'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const M = 14.17;
  const FS = 8;
  const AZUL = [30,70,150], AZUL_CLARO = [237,243,255];

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...AZUL);
  doc.text('REPORTE DE AVANCE — PROSPECTOS (PARA DIRECCIÓN MÉDICA)', M, M+10);
  doc.setDrawColor(...AZUL); doc.setLineWidth(1); doc.line(M, M+18, pageW-M, M+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(FS); doc.setTextColor(100,100,100);
  const total = DB.prospectos.length;
  const gestionados = DB.prospectos.filter(p=>p.estatus_contacto || (p.envios_whatsapp>0) || (p.envios_email>0)).length;
  doc.text('Generado el '+fmtDate(new Date())+' · '+total+' prospecto(s) totales · '+gestionados+' gestionado(s) ('+(total?Math.round(gestionados/total*100):0)+'%)', M, M+30);

  const estCounts = {}; DB.prospectos.forEach(p=>{ const e = (!p.telefono&&!p.correo)?'Sin datos de contacto':(p.estatus_contacto||'Sin gestionar'); estCounts[e]=(estCounts[e]||0)+1; });
  const bodyEst = Object.entries(estCounts).map(([k,v])=>[k, v, total?((v/total*100).toFixed(1)+'%'):'0%']);
  doc.autoTable({ startY:M+42, head:[['Estatus de contacto','Registros','% del total']], body:bodyEst,
    theme:'grid', styles:{font:'helvetica', fontSize:FS, cellPadding:3, lineColor:[210,215,225], lineWidth:0.4},
    headStyles:{fillColor:AZUL_CLARO, textColor:AZUL, fontStyle:'bold', fontSize:FS}, margin:{left:M, right:M} });

  let y = doc.lastAutoTable.finalY + 16;
  doc.setFont('helvetica','bold'); doc.setFontSize(FS+1); doc.setTextColor(...AZUL);
  doc.text('DESGLOSE POR ESPECIALIDAD', M, y); y += 4;
  const espCounts = conteoPorEspecialidadProspectos();
  const bodyEsp = Object.entries(espCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k, v]);
  doc.autoTable({ startY:y+4, head:[['Especialidad','Registros']], body:bodyEsp,
    theme:'grid', styles:{font:'helvetica', fontSize:FS, cellPadding:2.5, lineColor:[210,215,225], lineWidth:0.4},
    headStyles:{fillColor:AZUL_CLARO, textColor:AZUL, fontStyle:'bold', fontSize:FS}, margin:{left:M, right:M, bottom:M+12} });

  const trabajados = DB.prospectos.filter(p=>p.fecha_primer_contacto).sort((a,b)=> new Date(a.fecha_primer_contacto)-new Date(b.fecha_primer_contacto));
  if(trabajados.length){
    doc.addPage();
    doc.setFont('helvetica','bold'); doc.setFontSize(FS+1); doc.setTextColor(...AZUL);
    doc.text('MÉDICOS CON LOS QUE SE HA TRABAJADO ('+trabajados.length+')', M, M+14);
    const bodyTrab = trabajados.map(p=>[p.nombre, p.especialidad||'—', fmtDateTime(p.fecha_primer_contacto), fmtDateTime(p.fecha_ultimo_contacto), p.estatus_contacto||'Sin gestionar']);
    doc.autoTable({ startY:M+22, head:[['Médico','Especialidad','Primer contacto','Último contacto','Estatus']], body:bodyTrab,
      theme:'grid', styles:{font:'helvetica', fontSize:FS, cellPadding:2.5, lineColor:[210,215,225], lineWidth:0.4},
      headStyles:{fillColor:AZUL_CLARO, textColor:AZUL, fontStyle:'bold', fontSize:FS}, margin:{left:M, right:M, bottom:M+12} });
  }

  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(FS-1); doc.setTextColor(150,150,150);
    doc.text('Hospital Noor Clinic', M, pageH-M+8);
    doc.text('Página '+i+' de '+n, pageW-M, pageH-M+8, {align:'right'});
  }
  doc.save('Reporte_Avance_Prospectos.pdf');
  toast('Reporte generado');
}
function openProspectosReporteModal(){
  const especialidades = todasLasEspecialidadesProspectos();
  openModal(`
    <div class="modal-head"><div style="font-weight:700; font-size:16px;">Generar reporte de Prospectos</div><button class="drawer-close" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="form-field full" style="margin-bottom:14px;"><label>Especialidad</label>
        <select class="select" id="pr-rep-especialidad" style="width:100%;">
          <option value="todas">Todas las especialidades (reporte general)</option>
          ${especialidades.map(e=>`<option value="${e}">${e}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:11.5px; color:var(--text-faint); margin-bottom:14px;">El reporte se ordena por especialidad y, dentro de cada una, alfabéticamente por nombre.</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn" id="pr-rep-xls">${icon('download')} Exportar XLS</button>
      <button class="btn btn-primary" id="pr-rep-pdf">${icon('download')} Exportar PDF</button>
    </div>`);
  document.getElementById('pr-rep-pdf').onclick = ()=> generateProspectosPDF(document.getElementById('pr-rep-especialidad').value);
  document.getElementById('pr-rep-xls').onclick = ()=> generateProspectosXLS(document.getElementById('pr-rep-especialidad').value);
}
function prospectosParaReporte(especialidadFiltro){
  let list = DB.prospectos;
  if(especialidadFiltro && especialidadFiltro!=='todas'){
    list = list.filter(p=> (p.especialidad||'').split(',').map(e=>e.trim()).includes(especialidadFiltro));
  }
  return [...list].sort((a,b)=> (a.especialidad||'').localeCompare(b.especialidad||'','es') || a.nombre.localeCompare(b.nombre,'es'));
}
function generateProspectosPDF(especialidadFiltro){
  if(!window.jspdf){ toast('No se pudo generar el PDF'); return; }
  const list = prospectosParaReporte(especialidadFiltro);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const M = 14.17;
  const FS = 8;
  const AZUL = [30,70,150], AZUL_CLARO = [237,243,255];

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...AZUL);
  const titulo = 'DIRECTORIO DE PROSPECTOS'+(especialidadFiltro&&especialidadFiltro!=='todas'?' — '+especialidadFiltro.toUpperCase():'');
  doc.text(titulo, M, M+10);
  doc.setDrawColor(...AZUL); doc.setLineWidth(1); doc.line(M, M+18, pageW-M, M+18);
  doc.setFont('helvetica','normal'); doc.setFontSize(FS); doc.setTextColor(100,100,100);
  doc.text('Generado el '+fmtDate(new Date())+' · '+list.length+' prospecto(s)', M, M+30);

  const body = list.map(p=>[p.nombre, p.especialidad||'—', p.hospital||'—', p.telefono||'—', p.correo||'—']);
  doc.autoTable({
    startY: M+40, head:[['Médico','Especialidad','Hospital','Teléfono','Correo']], body,
    theme:'grid', styles:{font:'helvetica', fontSize:FS, textColor:[40,40,40], cellPadding:2.5, lineColor:[210,215,225], lineWidth:0.4},
    headStyles:{fillColor:AZUL_CLARO, textColor:AZUL, fontStyle:'bold', fontSize:FS},
    margin:{left:M, right:M, bottom:M+12}
  });

  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(FS-1); doc.setTextColor(150,150,150);
    doc.text('Hospital Noor Clinic', M, pageH-M+8);
    doc.text('Página '+i+' de '+n, pageW-M, pageH-M+8, {align:'right'});
  }
  const sufijo = especialidadFiltro&&especialidadFiltro!=='todas' ? '_'+slugify(especialidadFiltro) : '_general';
  doc.save('Prospectos'+sufijo+'.pdf');
  toast('Reporte generado');
}
function generateProspectosXLS(especialidadFiltro){
  if(!window.XLSX){ toast('No se pudo generar el XLS'); return; }
  const list = prospectosParaReporte(especialidadFiltro);
  const rows = list.map(p=>({ 'Médico':p.nombre, 'Especialidad':p.especialidad||'', 'Hospital':p.hospital||'', 'Teléfono':p.telefono||'', 'Correo':p.correo||'', 'Origen':p.origen||'' }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:35},{wch:30},{wch:28},{wch:15},{wch:28},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Prospectos');
  const sufijo = especialidadFiltro&&especialidadFiltro!=='todas' ? '_'+slugify(especialidadFiltro) : '_general';
  XLSX.writeFile(wb, 'Prospectos'+sufijo+'.xlsx');
  toast('Reporte XLS generado');
}

/* ============ ARRANQUE / LOGIN ============ */
function doLogin(){
  const val = document.getElementById('pass-input').value;
  if(val !== ACCESS_PASSWORD){
    document.getElementById('login-err').textContent = 'Clave incorrecta';
    return;
  }
  document.getElementById('login-err').textContent = '';
  SESSION.authed = true;
  showApp();
}
function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  cargarDatos();
  renderProspectos();
}
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('pass-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.querySelectorAll('#theme-switch button').forEach(b=> b.onclick = ()=>{ SESSION.theme=b.dataset.t; localStorage.setItem('pr_theme', b.dataset.t); applyTheme(); });
applyTheme();
</script>
